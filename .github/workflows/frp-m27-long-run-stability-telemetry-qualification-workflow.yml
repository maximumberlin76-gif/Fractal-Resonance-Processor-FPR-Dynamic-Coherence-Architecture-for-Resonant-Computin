      - name: Validate the closed M27 repository boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path("frp_m27_long_run_stability_telemetry_qualification.py"),
              Path("tests/test_frp_m27_long_run_stability_telemetry_qualification.py"),
              Path("artifacts/m27/contracts/m27-long-run-telemetry-contract.json"),
              Path("artifacts/m27/workloads/m27-long-run-workload-catalog.json"),
              Path("artifacts/m27/checkpoints/m27-long-run-checkpoint-evidence.json"),
              Path("artifacts/m27/telemetry/m27-telemetry-semantics.json"),
              Path("artifacts/m27/reports/m27-long-run-stability-report.json"),
              Path("artifacts/m27/manifests/m27-long-run-stability-manifest.json"),
              Path("artifacts/m27/manifests/m27-long-run-stability-qualification.json"),
          ]
          required.extend(sorted(Path("schemas/m27").glob("*")))
          missing = [str(path) for path in required if not path.is_file() or path.is_symlink()]
          if missing:
              raise SystemExit(f"M27 required file boundary failed: {missing}")

          contract = json.loads(required[2].read_text(encoding="utf-8"))
          evidence = json.loads(required[4].read_text(encoding="utf-8"))
          if contract["immutable_core"]["balanced_ternary_notation"] != "-1/0/1":
              raise SystemExit("M27 immutable ternary notation mismatch")
          if contract["immutable_core"]["temporal_scheduler_modes"] != ["1/7", "7/1"]:
              raise SystemExit("M27 scheduler mode boundary mismatch")
          if evidence["total_ticks"] != 49152 or evidence["checkpoint_count"] != 96:
              raise SystemExit("M27 long-run evidence boundary mismatch")
          print("M27 closed repository boundary: PASS")
          PY

          while IFS= read -r status_path; do
            changed_path="${status_path:3}"
            case "$changed_path" in
              frp_m27_long_run_stability_telemetry_qualification.py|\
              schemas/m27/*|\
              artifacts/m27/*|\
              tests/test_frp_m27_long_run_stability_telemetry_qualification.py)
                ;;
              *)
                echo "Unexpected working-tree change during M27: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git status --porcelain=v1)

      - name: Create the complete M27 qualification commit and publish main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            frp_m27_long_run_stability_telemetry_qualification.py \
            schemas/m27 \
            artifacts/m27 \
            tests/test_frp_m27_long_run_stability_telemetry_qualification.py

          while IFS= read -r staged_path; do
            case "$staged_path" in
              frp_m27_long_run_stability_telemetry_qualification.py|\
              schemas/m27/*|\
              artifacts/m27/*|\
              tests/test_frp_m27_long_run_stability_telemetry_qualification.py)
                ;;
              *)
                echo "Unexpected staged M27 path: $staged_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          if git diff --cached --quiet; then
            echo "M27 canonical qualification is already committed; no commit is required."
            exit 0
          fi

          git commit \
            -m "Add M27 long-run stability and telemetry qualification" \
            -m "Qualify 49,152 deterministic ticks across free, 7/1, and 1/7 scheduler profiles. Retain ordered checkpoint chains, zero-event intervals, pending-route and transition-capacity relations, explicitly dimensionless model-derived telemetry proxies, bounded artifacts, and byte-identical rerun evidence while preserving the immutable -1/0/1 core."
