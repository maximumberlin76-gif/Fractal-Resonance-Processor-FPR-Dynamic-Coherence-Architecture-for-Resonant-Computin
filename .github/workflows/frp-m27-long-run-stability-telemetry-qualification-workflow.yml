            2>&1 | tee /tmp/m27_long_run_b.log
          cmp --silent /tmp/m27_long_run_a.json /tmp/m27_long_run_b.json
          sha256sum /tmp/m27_long_run_a.json /tmp/m27_long_run_b.json | tee /tmp/m27_long_run_sha256.txt

