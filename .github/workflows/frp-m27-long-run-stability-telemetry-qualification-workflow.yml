          expected_files = json.loads(r"""{"frp_m27_long_run_stability_telemetry_qualification.py":{"bytes":48903,"raw_sha256":"ffd251d97db3550e66e111737172deeaae267d958c7cb929602a34370456d1fd"},"schemas/m27/frp_m27_long_run_telemetry_contract.v2.9.0.schema.json":{"bytes":3906,"raw_sha256":"2ee7fd6ef7a02d44bec7096631edc6a264bdd8f0708e75afcc49315eee0a7f53"},"schemas/m27/frp_m27_long_run_workload_catalog.v2.9.0.schema.json":{"bytes":3101,"raw_sha256":"515f523d931179fd3c84723da832e3cdb41344e35a1b201a8a325ffe2fd80dd2"},"schemas/m27/frp_m27_long_run_checkpoint_evidence.v2.9.0.schema.json":{"bytes":10764,"raw_sha256":"e74b53a2e88b690c89dd92145d8e5de9050b403fb0d7f736f99080937e4ab056"},"schemas/m27/frp_m27_telemetry_semantics.v2.9.0.schema.json":{"bytes":2609,"raw_sha256":"200daba136349ade552e08f927adbcc3d00e6eb496e5b980f07c42d2887e16fd"},"schemas/m27/frp_m27_long_run_stability_report.v2.9.0.schema.json":{"bytes":3472,"raw_sha256":"82263ad2f3b160e73961f5ae9ab56800b6e2aacf7e85c09ae23c44c64294bc60"},"schemas/m27/frp_m27_long_run_stability_manifest.v2.9.0.schema.json":{"bytes":2669,"raw_sha256":"7c40b29d491588979ab83f1e32727870cc9974645026081d902b0e4b66ace124"},"schemas/m27/frp_m27_long_run_stability_qualification.v2.9.0.schema.json":{"bytes":1980,"raw_sha256":"5d5546cc419e9e535942a11ac96af4d8dd005c7ba98dc51911326b4f3281c61a"},"schemas/m27/frp_m27_schema_registry.json":{"bytes":1054,"raw_sha256":"c4b84b197a3600e7b0a9976e991f578b0cc1053d6f9fa8a59063dfc9a4319141"},"tests/test_frp_m27_long_run_stability_telemetry_qualification.py":{"bytes":16166,"raw_sha256":"27e57d8b8e9ad537794ad0d3ef01e72a27be3d5f8e735771bda1b6efc573b3a3"}}""")
          payload_root = Path(os.environ["M27_PAYLOAD_ROOT"])
          staging = payload_root / "staging"

          compact = "".join(encoded.split())
          try:
              compressed = base64.b64decode(compact, validate=True)
          except binascii.Error as exc:
              raise SystemExit(f"M27 payload Base64 validation failed: {exc}") from exc
          observed_archive_sha256 = hashlib.sha256(compressed).hexdigest()
          if observed_archive_sha256 != expected_archive_sha256:
              raise SystemExit(
                  "M27 payload digest mismatch: "
                  f"{observed_archive_sha256} != {expected_archive_sha256}"
