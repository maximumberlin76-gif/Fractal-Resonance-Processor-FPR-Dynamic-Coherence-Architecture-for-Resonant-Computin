name: FRP M27 Long-Run Stability and Telemetry Qualification

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m27-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-m27:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M27_PAYLOAD_ROOT: /tmp/frp_m27_creation
      M27_SOURCE_COMMIT: 67e9cc6d3e5dd2e96380b7cadb16b66f5e7d2427
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python --version
          python -m pip show jsonschema

      - name: Validate the immutable M26 to M27 source boundary
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${M27_SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$M27_SOURCE_COMMIT" HEAD
          test "$(git show -s --format=%s "$M27_SOURCE_COMMIT")" = "Add M26 declared-target implementation evidence"
          test "$(git rev-parse "$M27_SOURCE_COMMIT")" = "$M27_SOURCE_COMMIT"

          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/frp-m27-long-run-stability-telemetry-qualification-workflow.yml|\
              frp_m27_long_run_stability_telemetry_qualification.py|\
              schemas/m27/*|\
              artifacts/m27/*|\
              tests/test_frp_m27_long_run_stability_telemetry_qualification.py)
                ;;
              *)
                echo "Unexpected change after the exact M26 boundary: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$M27_SOURCE_COMMIT"..HEAD)

          test -f .github/workflows/frp-m27-long-run-stability-telemetry-qualification-workflow.yml

