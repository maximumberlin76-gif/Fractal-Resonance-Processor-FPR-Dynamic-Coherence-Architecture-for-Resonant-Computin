          try:
              archive_bytes = bz2.decompress(compressed)
          except OSError as exc:
              raise SystemExit(f"M27 payload decompression failed: {exc}") from exc

          if payload_root.exists():
              shutil.rmtree(payload_root)
          staging.mkdir(parents=True)

          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:") as archive:
              members = archive.getmembers()
              observed_names = [member.name for member in members]
              if observed_names != list(expected_files):
                  raise SystemExit("M27 payload member inventory mismatch")
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or any(part in ("", ".", "..") for part in member.name.split("/"))
                      or not member.isfile()
                      or member.issym()
                      or member.islnk()
                  ):
                      raise SystemExit(f"unsafe M27 payload member: {member.name}")
