      - name: Validate the extracted M27 source and immutable core vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile frp_m27_long_run_stability_telemetry_qualification.py
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [Path("frp_m27_long_run_stability_telemetry_qualification.py")]
          paths.extend(sorted(Path("schemas/m27").glob("*")))
          paths.append(Path("tests/test_frp_m27_long_run_stability_telemetry_qualification.py"))
          forbidden = "-1/0/" + "+1"
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if forbidden in text:
                  raise SystemExit(f"forbidden ternary notation in {path}")
          registry = json.loads(Path("schemas/m27/frp_m27_schema_registry.json").read_text(encoding="utf-8"))
          if len(registry["records"]) != 7:
              raise SystemExit("M27 schema registry is incomplete")
          print("M27 extracted source and immutable core vocabulary: PASS")
          PY

      - name: Run the complete deterministic M27 workload twice
        shell: bash
        run: |
