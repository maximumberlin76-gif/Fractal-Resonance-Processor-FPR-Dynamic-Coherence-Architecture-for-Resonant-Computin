name: FRP M31E1 Phase-Interference Thermal Package

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m31e1-phase-interference-thermal-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-m31-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_PATH: rtl/m31/frp_m31_phase_interference_thermal_pkg.sv
      TARGET_BYTES: "19239"
      TARGET_LINES: "561"
      TARGET_SHA256: 33c4e73 robots 
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ github.ref_name }}" = "main"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          echo "Manual main-branch boundary: PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify M31 control boundaries and capture protected histories
        shell: bash
        run: |
          set -euo pipefail

          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          historical_inventory() {
            find . -maxdepth 1 -type f \
              '(' -name 'RELEASE_NOTES_v*.md' \
                  -o -name 'TEST_REPORT_v*.md' \
                  -o -name 'FRP_VALIDATION_INDEX_v*.md' \
                  -o -name 'RELEASE_CHECKLIST_v*.md' ')' \
              -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          protected_rtl_inventory() {
            find rtl -type f ! -path 'rtl/m31/*' -print0 \
              | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          check_identity() {
            path="$1"
            bytes="$2"
            digest="$3"
            test -f "$path"
            test ! -L "$path"
            test "$(wc -c < "$path")" -eq "$bytes"
            test "$(sha256sum "$path" | cut -d' ' -f1)" = "$digest"
          }

          tree_inventory artifacts > /tmp/m31e1-artifacts.before
          tree_inventory benchmarks > /tmp/m31e1-benchmarks.before
          tree_inventory schemas > /tmp/m31e1-schemas.before
          tree_inventory fpga > /tmp/m31e1-fpga.before
          protected_rtl_inventory > /tmp/m31e1-protected-rtl.before
          historical_inventory > /tmp/m31e1-history.before

          while IFS='|' read -r path bytes digest
          do
            check_identity "$path" "$bytes" "$digest"
          done <<'CONTROL_IDENTITIES'
          README.md|10430|9fb5ccd3db24705f0f2c80723dd9b1f2c344e5b53c447927532ab29c2b34ca41
          USAGE.md|66358|d1f5868a07c6322feb1ba8d36d6aff9972976848f26d63be6494d4ae722473c1
          REPRODUCIBILITY.md|84646|e6b9fba117314e593cdb47e984ada655402d8d25b7510df2471eb505c19512db
          MILESTONES.md|65183|d897a00d07be90efe13135a62be07dc367b10a0653f95348e2f3ef9f62a6d451
          NOTICE.md|4814|d5e3bbdfebb1a77fc2ba54d7e2ac12802eeac5bd4f2537b22eef6d10c8e4aac1
          CHANGELOG.md|137894|b243bf728871f498c413ef43c4eb243c2fd6512bed80f452381b9846c9356fab
          CI.md|137571|87d891c84c1c1118c0204ef7fbd31b5d63ff8da3dc916b30af0ad05fcda7dafc
          ROADMAP.md|53373|611570be05d0e3a0d514c08c3f2e163a0b37e40edc2898ad524e795112fb5e7a
