            artifacts/m18/m15_vectors/frp_m15_trig_lut_q30.vec \
            "$STAGE/frp_m31_sin_q30.mem" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          rows = []
          for line in source.read_text(encoding="utf-8").splitlines():
              if not line or line.startswith("#"):
                  continue
              index_text, value_text = (
                  field.strip() for field in line.split("|")
              )
              if int(index_text, 16) != len(rows):
                  raise SystemExit("non-canonical sine LUT index")
              rows.append(int(value_text))
          if len(rows) != 4096:
              raise SystemExit("sine LUT entry count mismatch")
          target.write_text(
              "".join(f"{value & 0xffffffff:08X}\n" for value in rows),
              encoding="ascii",
          )
          PY

          test "$(sha256sum "$STAGE/frp_m31_sin_q30.mem" | cut -d' ' -f1)" = \
            "$SIN_MEMORY_SHA256"

          (
            cd "$STAGE"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > /tmp/m31e1-target.manifest

          test "$(wc -l < /tmp/m31e1-target.manifest)" -eq 20
          test "$(sha256sum /tmp/m31e1-target.manifest | cut -d' ' -f1)" = \
            "$TARGET_MANIFEST_SHA256"
          test "$(find "$STAGE" -maxdepth 1 -type f -name '*.sv' | wc -l)" -eq 18
          test "$(wc -l < "$STAGE/frp_m31_sin_q30.mem")" -eq 4096
          test ! -L "$STAGE"
          find "$STAGE" -type l -print -quit | grep -q . && exit 1 || true
          echo "Complete M31 RTL assembly: PASS"

      - name: Install integrity-bound complete M31 RTL contour
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(cat /tmp/m31e1-stage-path)"

          if test -e "$TARGET_DIR"; then
            test -d "$TARGET_DIR"
            test ! -L "$TARGET_DIR"
            diff -r "$STAGE" "$TARGET_DIR"
          else
            cp -a "$STAGE" "$TARGET_DIR"
          fi

          (
            cd "$TARGET_DIR"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > /tmp/m31e1-installed.manifest
          cmp /tmp/m31e1-target.manifest /tmp/m31e1-installed.manifest
          echo "Complete M31 RTL installation: PASS"

      - name: Lint and execute inherited active-zero RTL qualification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/frp-m31-execution-obj
          verilator \
            --lint-only \
            --sv \
            --timing \
            --assert \
            -Wall \
            -Wno-fatal \
            --top-module frp_m31_execution_tb \
            -Irtl/m31 \
            rtl/m31/frp_m31_execution_tb.sv
          verilator \
            --binary \
            --sv \
            --timing \
            --assert \
            -Wall \
            -Wno-fatal \
            -CFLAGS "-std=c++20" \
            --top-module frp_m31_execution_tb \
            --Mdir /tmp/frp-m31-execution-obj \
            -Irtl/m31 \
            rtl/m31/frp_m31_execution_tb.sv
          /tmp/frp-m31-execution-obj/Vfrp_m31_execution_tb \
            2>&1 | tee /tmp/m31e1-execution.log
          grep -F "FRP M31 deterministic RTL testbench completed." \
            /tmp/m31e1-execution.log

      - name: Lint and execute complete M31 RTL qualification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/frp-m31-complete-obj
          verilator \
            --lint-only \
            --sv \
            --timing \
            --assert \
            -Wall \
            -Wno-fatal \
            --top-module frp_m31_tb \
            -Irtl/m31 \
            rtl/m31/frp_m31_tb.sv
          verilator \
            --binary \
            --sv \
            --timing \
            --assert \
            -Wall \
            -Wno-fatal \
            -CFLAGS "-std=c++20" \
            --top-module frp_m31_tb \
            --Mdir /tmp/frp-m31-complete-obj \
            -Irtl/m31 \
            rtl/m31/frp_m31_tb.sv
          /tmp/frp-m31-complete-obj/Vfrp_m31_tb \
            2>&1 | tee /tmp/m31e1-complete.log
          grep -Fx "FRP_M31_COMPLETE_RTL: PASS" /tmp/m31e1-complete.log
          grep -Fx "phase/coherence/resonance/active-zero/thermal/stability: PASS" \
            /tmp/m31e1-complete.log

      - name: Verify preservation and exact change boundary
        shell: bash
        run: |
          set -euo pipefail

          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          historical_inventory() {
            find . -maxdepth 1 -type f \
              \( -name 'RELEASE_NOTES_v*.md' \
                 -o -name 'TEST_REPORT_v*.md' \
                 -o -name 'FRP_VALIDATION_INDEX_v*.md' \
                 -o -name 'RELEASE_CHECKLIST_v*.md' \) \
              -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          protected_rtl_inventory() {
            find rtl -type f ! -path 'rtl/m31/*' -print0 \
              | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          tree_inventory artifacts > /tmp/m31e1-artifacts.after
          tree_inventory benchmarks > /tmp/m31e1-benchmarks.after
          tree_inventory schemas > /tmp/m31e1-schemas.after
          tree_inventory fpga > /tmp/m31e1-fpga.after
          protected_rtl_inventory > /tmp/m31e1-protected-rtl.after
          historical_inventory > /tmp/m31e1-history.after

          cmp /tmp/m31e1-artifacts.before /tmp/m31e1-artifacts.after
          cmp /tmp/m31e1-benchmarks.before /tmp/m31e1-benchmarks.after
          cmp /tmp/m31e1-schemas.before /tmp/m31e1-schemas.after
          cmp /tmp/m31e1-fpga.before /tmp/m31e1-fpga.after
          cmp /tmp/m31e1-protected-rtl.before /tmp/m31e1-protected-rtl.after
          cmp /tmp/m31e1-history.before /tmp/m31e1-history.after

          unexpected="$(
            git status --porcelain \
              | awk '{print $2}' \
              | grep -Ev '^rtl/m31(/|$)' \
              || true
          )"
          test -z "$unexpected"
          echo "Preservation and exact change boundary: PASS"

      - name: Commit and publish only rtl/m31
        shell: bash
        run: |
          set -euo pipefail
          git add -- rtl/m31

          unexpected="$(
            git diff --cached --name-only \
              | grep -Ev '^rtl/m31/' \
              || true
          )"
          test -z "$unexpected"

          if git diff --cached --quiet; then
            echo "Exact complete M31 RTL contour is already published."
            exit 0
          fi

          test "$(git diff --cached --name-only | wc -l)" -eq 20
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add complete FRP M31 RTL contour"
          git push origin HEAD:main

      - name: Publish M31E1 summary
        if: always()
        shell: bash
        run: |
          {
            echo "## FRP M31E1 Complete RTL Contour"
            echo
            echo "- Trigger: manual workflow_dispatch on main"
            echo "- Target: rtl/m31"
            echo "- Files: 20 total, including 18 SystemVerilog sources"
            echo "- Numeric boundary: S32Q16 / S32Q30 / PHASE_U32 / GAMMA_S32"
            echo "- Trigonometric boundary: exact 4096-entry published M15 LUT"
            echo "- Ternary notation: -1/0/1 with active computational zero"
            echo "- Opposite polarity: tick-separated routing through zero"
            echo "- Qualified chain: phase, coherence, resonance, active-zero, thermal, stability"
            echo "- Historical evidence, benchmarks, schemas, releases, FPGA and prior RTL: preserved"
          } >> "$GITHUB_STEP_SUMMARY"
