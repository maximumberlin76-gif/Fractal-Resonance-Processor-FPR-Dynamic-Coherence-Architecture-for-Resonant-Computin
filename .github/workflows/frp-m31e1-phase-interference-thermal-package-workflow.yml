      - name: Qualify package constants and semantic boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from decimal import Decimal, ROUND_HALF_UP
          from pathlib import Path

          path = Path(os.environ["TARGET_PATH"])
          raw = path.read_bytes()
          expected = (int(os.environ["TARGET_BYTES"]), os.environ["TARGET_SHA256"])
          observed = (len(raw), hashlib.sha256(raw).hexdigest())
          if observed != expected:
              raise SystemExit(f"M31 package identity mismatch: {observed}")
          if raw.count(b"\n") != int(os.environ["TARGET_LINES"]):
              raise SystemExit("M31 package line-count mismatch")

          text = raw.decode("utf-8")
          required = (
              "package frp_m31_phase_interference_thermal_pkg;",
              "balanced ternary -1/0/1",
              "FRP_M31_ACTIVE_ZERO",
              "FRP_M31_PHASE_TARGET_POS_THRESHOLD_Q30",
              "FRP_M31_THERMAL_DECAY_Q30",
              "FRP_M31_THERMAL_GAIN_Q30",
              "frp_m31_phase_projection_to_target",
              "frp_m31_pending_route_is_coherent",
              "frp_m31_classify_transition",
              "frp_m31_transition_selected_target",
              "frp_m31_transition_next_pending",
              "frp_m31_decode_scheduler_state",
              "frp_m31_scheduler_allows_transition",
              "frp_m31_calc_request_lanes",
              "FRP_M31_REQUEST_LANE_PROFILES_VALID",
              "normalized RC proxy, not physical temperature",
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f"M31 package boundaries missing: {missing}")
          if "-1/0/" + chr(43) + "1" in text:
              raise SystemExit("forbidden ternary notation present")
          if "frp_m16_pkg" in text or "frp_m22_csr_pkg" in text:
              raise SystemExit("M31 package is not standalone")

          def q30(value: str) -> int:
              return int(
                  (Decimal(value) * (1 << 30)).quantize(
                      Decimal("1"), rounding=ROUND_HALF_UP
                  )
              )

          expected_constants = {
              "FRP_M31_PHASE_TARGET_POS_THRESHOLD_Q30": q30("0.33"),
              "FRP_M31_PHASE_TARGET_NEG_THRESHOLD_Q30": -q30("0.33"),
              "FRP_M31_THERMAL_DECAY_Q30": q30("0.95"),
              "FRP_M31_THERMAL_GAIN_Q30": q30("0.01"),
          }
          for name, value in expected_constants.items():
              match = re.search(
                  rf"{name}\s*=\s*(-?32'sd\d+)\s*;",
                  text,
                  flags=re.MULTILINE,
              )
              if match is None:
                  raise SystemExit(f"constant declaration missing: {name}")
              observed_value = int(match.group(1).replace("32'sd", ""))
              if observed_value != value:
                  raise SystemExit(
                      f"constant mismatch for {name}: {observed_value} != {value}"
                  )

          profile = json.loads(
              Path(
                  "benchmarks/architecture_comparison/profiles/"
                  "thermal_proxy_profile_v1.json"
              ).read_text(encoding="utf-8")
          )
          if profile != {
              "schema": "frp.benchmark.thermal_proxy_profile.v1",
              "suite_name": "FRP Comparative Architecture Benchmark Suite",
              "profile_name": "common_rc_thermal_proxy_v1",
              "temperature_unit": "normalized_temperature_proxy",
              "ambient_temperature_proxy": 0.0,
              "thermal_decay": 0.95,
              "thermal_gain": 0.01,
              "update_equation": (
                  "ambient + (temperature - ambient) * thermal_decay + "
                  "normalized_cycle_cost * thermal_gain"
              ),
              "thermal_profile_sha256": (
                  "8cc2992f5699c47c88e81c17a4a5f0c8ff5bb7a5b32ebf73ab0e5a0f9c5494c8"
              ),
          }:
              raise SystemExit("published thermal proxy profile mismatch")

          evidence = json.loads(
              Path(
                  "artifacts/m31/evidence/"
                  "m31-phase-interference-active-zero-thermal-evidence.json"
              ).read_text(encoding="utf-8")
          )
          core = evidence.get("core", {})
          if core.get("balanced_ternary_notation") != "-1/0/1":
              raise SystemExit("M31 ternary notation mismatch")
          if core.get("active_neutral_state") != 0:
              raise SystemExit("M31 active-zero state mismatch")
          if core.get("opposite_transition_routes") != [[-1, 0, 1], [1, 0, -1]]:
              raise SystemExit("M31 opposite-transition routes mismatch")
          if core.get("temporal_scheduler_modes") != ["1/7", "7/1"]:
              raise SystemExit("M31 scheduler mode boundary mismatch")
          if core.get("service_scheduler_mode") != "free":
              raise SystemExit("M31 service scheduler mode mismatch")

          print("M31 package constants and semantic boundaries: PASS")
          PY

          git diff --check

      - name: Compile and execute deterministic package smoke test
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/frp_m31e1_pkg_smoke.sv <<'SV'
          module frp_m31e1_pkg_smoke;
            import frp_m31_phase_interference_thermal_pkg::*;

            task automatic check(input bit condition, input string message);
              if (!condition) begin
                $fatal(1, "%s", message);
              end
            endtask

            initial begin
              check(FRP_M31_STATE_BITS == 2, "state width");
              check(FRP_M31_PERIOD_TICKS == 8, "scheduler period");
              check(FRP_M31_DEFAULT_CELLS == 8, "default cell profile");
              check(FRP_M31_DEFAULT_REQUEST_LANES == 2, "default lane profile");
              check(FRP_M31_DEFAULT_PACKED_STATE_BITS == 16, "packed state width");
              check(FRP_M31_REQUEST_LANE_PROFILES_VALID, "lane profiles");
              check(!FRP_M31_THERMAL_PROXY_IS_PHYSICAL_TEMPERATURE,
                    "thermal proxy classification");

              check(frp_m31_is_valid_ternary(FRP_M31_TERN_NEG), "negative trit");
              check(frp_m31_is_valid_ternary(FRP_M31_ACTIVE_ZERO), "active zero");
              check(frp_m31_is_valid_ternary(FRP_M31_TERN_POS), "positive trit");
              check(!frp_m31_is_valid_ternary(FRP_M31_TERN_RESERVED),
                    "reserved trit rejection");

              check(
                frp_m31_phase_projection_to_target(32'sd354334803)
                  == FRP_M31_TERN_POS,
                "positive phase target"
              );
              check(
                frp_m31_phase_projection_to_target(32'sd354334802)
                  == FRP_M31_ACTIVE_ZERO,
                "positive threshold stays zero"
              );
              check(
                frp_m31_phase_projection_to_target(-32'sd354334802)
                  == FRP_M31_ACTIVE_ZERO,
                "negative threshold stays zero"
              );
              check(
                frp_m31_phase_projection_to_target(-32'sd354334803)
                  == FRP_M31_TERN_NEG,
                "negative phase target"
              );

              check(
                frp_m31_classify_transition(
                  FRP_M31_TERN_NEG,
                  FRP_M31_TERN_POS,
                  FRP_M31_TERN_ZERO
                ) == FRP_M31_TRANS_OPPOSITE_REQUEST,
                "opposite transition classification"
              );
              check(
                frp_m31_transition_selected_target(
                  FRP_M31_TERN_NEG,
                  FRP_M31_TERN_POS,
                  FRP_M31_TERN_ZERO
                ) == FRP_M31_ACTIVE_ZERO,
                "opposite transition first leg"
              );
              check(
                frp_m31_transition_next_pending(
                  FRP_M31_TERN_NEG,
                  FRP_M31_TERN_POS,
                  FRP_M31_TERN_ZERO
                ) == FRP_M31_TERN_POS,
                "opposite transition retained target"
              );
              check(
                frp_m31_classify_transition(
                  FRP_M31_ACTIVE_ZERO,
                  FRP_M31_TERN_NEG,
                  FRP_M31_TERN_POS
                ) == FRP_M31_TRANS_PENDING_COMPLETION,
                "pending completion priority"
              );
              check(
                frp_m31_transition_selected_target(
                  FRP_M31_ACTIVE_ZERO,
                  FRP_M31_TERN_NEG,
                  FRP_M31_TERN_POS
                ) == FRP_M31_TERN_POS,
                "pending target selection"
              );
              check(
                frp_m31_transition_next_pending(
                  FRP_M31_ACTIVE_ZERO,
                  FRP_M31_TERN_NEG,
                  FRP_M31_TERN_POS
                ) == FRP_M31_TERN_ZERO,
                "pending target clear"
              );

              check(
                frp_m31_decode_scheduler_state(FRP_M31_MODE_7_1, 3'd7)
                  == FRP_M31_SCHED_COMMIT,
                "7/1 commit tick"
              );
              check(
                frp_m31_decode_scheduler_state(FRP_M31_MODE_1_7, 3'd0)
                  == FRP_M31_SCHED_EXCITE,
                "1/7 excite tick"
              );
              check(
                frp_m31_scheduler_allows_transition(
                  FRP_M31_SCHED_BALANCE,
                  FRP_M31_TRANS_OPPOSITE_REQUEST
                ),
                "balance allows active-zero first leg"
              );
              check(
                frp_m31_scheduler_allows_transition(
                  FRP_M31_SCHED_COMMIT,
                  FRP_M31_TRANS_PENDING_COMPLETION
                ),
                "commit allows pending completion"
              );

              $display("FRP_M31E1_PACKAGE_SMOKE: PASS");
              $finish;
            end
          endmodule
          SV

          rm -rf /tmp/frp-m31e1-obj
          verilator \
            --lint-only \
            --sv \
            -Wall \
            -Wno-fatal \
            --top-module frp_m31e1_pkg_smoke \
            "$TARGET_PATH" \
            /tmp/frp_m31e1_pkg_smoke.sv
          verilator \
            --binary \
            --sv \
            --assert \
            -Wall \
            -Wno-fatal \
            --top-module frp_m31e1_pkg_smoke \
            --Mdir /tmp/frp-m31e1-obj \
            "$TARGET_PATH" \
            /tmp/frp_m31e1_pkg_smoke.sv
          /tmp/frp-m31e1-obj/Vfrp_m31e1_pkg_smoke \
            | tee /tmp/m31e1-package-smoke.log
          grep -Fx "FRP_M31E1_PACKAGE_SMOKE: PASS" \
            /tmp/m31e1-package-smoke.log

      - name: Verify preservation boundary and exact change scope
        shell: bash
        run: |
          set -euo pipefail

          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          historical_inventory() {
            find . -maxdepth 1 -type f \
              '(' -name 'RELEASE_NOTES_v*.md' \
                  -o -name 'TEST_REPORT_v*.md' \
                  -o -name 'FRP_VALIDATION_INDEX_v*.md' \
                  -o -name 'RELEASE_CHECKLIST_v*.md' ')' \
              -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          protected_rtl_inventory() {
            find rtl -type f ! -path 'rtl/m31/*' -print0 \
              | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          tree_inventory artifacts > /tmp/m31e1-artifacts.after
          tree_inventory benchmarks > /tmp/m31e1-benchmarks.after
          tree_inventory schemas > /tmp/m31e1-schemas.after
          tree_inventory fpga > /tmp/m31e1-fpga.after
          protected_rtl_inventory > /tmp/m31e1-protected-rtl.after
          historical_inventory > /tmp/m31e1-history.after

          cmp /tmp/m31e1-artifacts.before /tmp/m31e1-artifacts.after
          cmp /tmp/m31e1-benchmarks.before /tmp/m31e1-benchmarks.after
          cmp /tmp/m31e1-schemas.before /tmp/m31e1-schemas.after
          cmp /tmp/m31e1-fpga.before /tmp/m31e1-fpga.after
          cmp /tmp/m31e1-protected-rtl.before /tmp/m31e1-protected-rtl.after
          cmp /tmp/m31e1-history.before /tmp/m31e1-history.after

          python - <<'PY'
          import os
          import subprocess

          target = os.environ["TARGET_PATH"]
          lines = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              text=True,
          ).splitlines()
          unexpected = [line for line in lines if not line.endswith(" " + target)]
          if unexpected:
              raise SystemExit(f"unexpected worktree changes: {unexpected}")
          if len(lines) > 1:
              raise SystemExit(f"multiple target changes detected: {lines}")
          print("Exact M31 package change scope: PASS")
          PY

          git diff --check
          test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
          test "$(wc -l < "$TARGET_PATH")" -eq "$TARGET_LINES"
          test "$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)" = "$TARGET_SHA256"
          echo "Evidence, benchmark, schema, release, FPGA, and earlier RTL histories: PRESERVED"

      - name: Commit and publish only the M31 package
        shell: bash
        run: |
          set -euo pipefail
          if test -z "$(git status --porcelain --untracked-files=all -- "$TARGET_PATH")"; then
            echo "Exact M31 package is already published."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"

          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 1
          test "${staged[0]}" = "$TARGET_PATH"

          git commit -m "Add FRP M31 phase-interference thermal RTL package"
          git push origin HEAD:main

      - name: Publish M31E1 summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          # FRP M31E1 Phase-Interference Thermal Package

          - Manual `main` execution required.
          - Adds only `rtl/m31/frp_m31_phase_interference_thermal_pkg.sv`.
          - Encodes balanced ternary `-1/0/1` with active state `0`.
          - Encodes strict phase-target thresholds and the current normalized RC proxy coefficients.
          - Encodes tick-separated active-zero transition and scheduler semantics.
          - Runs all 60 focused M31 Python tests plus a compiled SystemVerilog smoke test.
          - Preserves every evidence, benchmark, schema, release, FPGA, and earlier RTL file.
          SUMMARY
