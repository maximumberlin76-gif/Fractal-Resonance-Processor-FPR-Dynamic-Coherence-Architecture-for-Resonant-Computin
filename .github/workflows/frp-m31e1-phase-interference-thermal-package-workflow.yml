name: FRP M31E1 Complete RTL Contour

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m31e1-complete-rtl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-m31-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_DIR: rtl/m31
      AUTHORED_ARCHIVE_SHA256: ba6274abd082661c13eb3acb65df227b395ad082702de02d35bfef66ab6e3590
      AUTHORED_BASE64_SHA256: 8c2adee77fe7968352c32d3323964bea4f3e8d1276b4028c262a5ff552b5bb66
      TARGET_MANIFEST_SHA256: 3eda747b8bf2e5796988f197b7d69b2f19bd1b803a72fbfa7700d21619158d6f
      SIN_MEMORY_SHA256: adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ github.ref_name }}" = "main"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          echo "Manual main-branch boundary: PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Capture protected repository histories
        shell: bash
        run: |
          set -euo pipefail

          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          historical_inventory() {
            find . -maxdepth 1 -type f \
              \( -name 'RELEASE_NOTES_v*.md' \
                 -o -name 'TEST_REPORT_v*.md' \
                 -o -name 'FRP_VALIDATION_INDEX_v*.md' \
                 -o -name 'RELEASE_CHECKLIST_v*.md' \) \
              -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          protected_rtl_inventory() {
            find rtl -type f ! -path 'rtl/m31/*' -print0 \
              | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          check_identity() {
            path="$1"
            bytes="$2"
            digest="$3"
            test -f "$path"
            test ! -L "$path"
            test "$(wc -c < "$path")" -eq "$bytes"
            test "$(sha256sum "$path" | cut -d' ' -f1)" = "$digest"
          }

          tree_inventory artifacts > /tmp/m31e1-artifacts.before
          tree_inventory benchmarks > /tmp/m31e1-benchmarks.before
          tree_inventory schemas > /tmp/m31e1-schemas.before
          tree_inventory fpga > /tmp/m31e1-fpga.before
          protected_rtl_inventory > /tmp/m31e1-protected-rtl.before
          historical_inventory > /tmp/m31e1-history.before

          while IFS='|' read -r path bytes digest
          do
            check_identity "$path" "$bytes" "$digest"
          done <<'CONTROL_IDENTITIES'
          README.md|10430|9fb5ccd3db24705f0f2c80723dd9b1f2c344e5b53c447927532ab29c2b34ca41
          USAGE.md|66358|d1f5868a07c6322feb1ba8d36d6aff9972976848f26d63be6494d4ae722473c1
          REPRODUCIBILITY.md|84646|e6b9fba117314e593cdb47e984ada655402d8d25b7510df2471eb505c19512db
          MILESTONES.md|65183|d897a00d07be90efe13135a62be07dc367b10a0653f95348e2f3ef9f62a6d451
          NOTICE.md|4814|d5e3bbdfebb1a77fc2ba54d7e2ac12802eeac5bd4f2537b22eef6d10c8e4aac1
          CHANGELOG.md|137894|b243bf728871f498c413ef43c4eb243c2fd6512bed80f452381b9846c9356fab
          CI.md|137571|87d891c84c1c1118c0204ef7fbd31b5d63ff8da3dc916b30af0ad05fcda7dafc
          ROADMAP.md|53373|611570be05d0e3a0d514c08c3f2e163a0b37e40edc2898ad524e795112fb5e7a
          PROJECT_STRUCTURE.md|75854|17adf275c6af9996e7af9e2e36982893b9d0d60c297d6458d90854b01424c02d
          INSTALL.md|51529|df1dcd53d5f195cbc02bb3abbed61c08450ff9673816afcaec785a3f58642e96
          SECURITY.md|11961|65bd8aaf9da131cf79ecb617727bce16f7c5241a949491a0851b83a6fccd235b
          CONTRIBUTING.md|81983|e18fa5d7a89f8c01253649126d005d09c3a15cce5298336573f8f46514d4e001
          CODE_OF_CONDUCT.md|14161|266980d8336f2bc537f098e05786aa10a071c0821a7066a8f5bca695e436132f
          funding_brief.md|81846|06b32eb46c62ae49798a09e568e5fa3f43cd143a03f6680d6421697b4d72f1fe
          FRP_VALIDATION_INDEX_v3_3_0.md|12438|d9cc92a9a51797d536875710933109a42f24120739c8e2960d82205dbb785d3b
          RELEASE_NOTES_v3_3_0.md|8189|16bb207b2b254ba980272b23e448ad737cd7e2de5da3bdfc005ea9ca2010b648
          TEST_REPORT_v3_3_0.md|9570|0caabfb9387bf337adbc1724f2b2e8657430145e812b2ff70379212580ba1dd0
          requirements.txt|33|75b9bd6237473a063c852298fee983bdfcf550cb1cc828a237afaf726cccc3c7
          frp_m31_phase_interference_thermal_evidence.py|42092|1e4ccfd7b157cd2bac609c34dfec9da791653a31af7b29b75502c755807b9c62
          tests/test_frp_m31_phase_interference_thermal_evidence.py|22370|f64214a9c785d8cf579e3a6a5afa6e364772d8972775cc010a3dba89d852c1ed
          schemas/m31/frp.m31.phase_interference_active_zero_thermal_evidence.v1.schema.json|1468|53d79d45d70753ccd24c3dc4c97af6fee481f86a9d7cdca7ef78b486c76479f7
          artifacts/m31/evidence/m31-phase-interference-active-zero-thermal-evidence.json|39993|bdaa676acbfb09d86d848070e8a2673c5ce6902657a0b13b2e4293383bec8b42
          artifacts/m31/manifests/m31-phase-interference-active-zero-thermal-evidence-manifest.json|828|80f0841d0041cd22c2f76175b6139e601aede7b69823356ae1fefbce5f793e7c
          artifacts/m31/qualification/m31-phase-interference-active-zero-thermal-evidence-qualification.json|1512|4c2446f954e01ec0aa37cc6c0fc70cf4a87ec565c450628e31b0efcac9160224
          artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz|10189989|05ea33f6f3f505d315af930c2d51779f7189905308473f32a57375e477069caa
          artifacts/m18/m15_vectors/frp_m15_trig_lut_q30.vec|72471|caadbbf97fe0bacf2d82eaa5da4cd1fb6cf1e1514809d3e743311e19893d11bb
          CONTROL_IDENTITIES

          test -d rtl/m16
          test ! -L rtl
          test ! -L rtl/m16
          if test -e "$TARGET_DIR"; then
            test -d "$TARGET_DIR"
            test ! -L "$TARGET_DIR"
          fi
          echo "Protected repository histories: PASS"

      - name: Install exact dependencies and Verilator
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ! command -v verilator >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y verilator g++
          fi
          verilator --version

      - name: Run all 60 focused M31 qualification tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_frp_m31_phase_interference_thermal_evidence -v \
            2>&1 | tee /tmp/m31e1-python-tests.log
          grep -F "Ran 60 tests" /tmp/m31e1-python-tests.log
          grep -Fx "OK" /tmp/m31e1-python-tests.log

      - name: Assemble exact complete M31 RTL contour
        shell: bash
        run: |
          set -euo pipefail
          umask 022

          STAGE="$(mktemp -d)"
          printf '%s\n' "$STAGE" > /tmp/m31e1-stage-path

          for component in \
            active_neutral \
            assertions \
            capacity_guard \
            core \
            pending_routes \
            pkg \
            request_lanes \
            scheduler \
            state_update \
            tb
          do
            source_path="rtl/m16/frp_m16_${component}.sv"
            target_path="$STAGE/frp_m31_${component}.sv"
            test -f "$source_path"
            test ! -L "$source_path"
            sed \
              -e 's/M16/M31/g' \
              -e 's/m16/m31/g' \
              -e 's/v1\.8\.0/v3.3.0/g' \
              "$source_path" > "$target_path"
          done

          mv "$STAGE/frp_m31_core.sv" "$STAGE/frp_m31_execution_core.sv"
          mv "$STAGE/frp_m31_tb.sv" "$STAGE/frp_m31_execution_tb.sv"

          sed -i \
            -e 's/FRP_M31_CORE_SV/FRP_M31_EXECUTION_CORE_SV/g' \
            -e 's/module frp_m31_core/module frp_m31_execution_core/g' \
            -e 's/endmodule : frp_m31_core/endmodule : frp_m31_execution_core/g' \
            "$STAGE/frp_m31_execution_core.sv"

          sed -i \
            -e 's/FRP_M31_TB_SV/FRP_M31_EXECUTION_TB_SV/g' \
            -e 's/frp_m31_core\.sv/frp_m31_execution_core.sv/g' \
            -e 's/module frp_m31_tb/module frp_m31_execution_tb/g' \
            -e 's/frp_m31_core #(/frp_m31_execution_core #(/g' \
            -e 's/endmodule : frp_m31_tb/endmodule : frp_m31_execution_tb/g' \
            "$STAGE/frp_m31_execution_tb.sv"

          sed -i \
            's/FRP_M31_DEFAULT_CELLS          = 16/FRP_M31_DEFAULT_CELLS          = 8/' \
            "$STAGE/frp_m31_pkg.sv"

          cat > /tmp/frp-m31-authored.b64 <<'FRP_M31_AUTHORED_PAYLOAD'
