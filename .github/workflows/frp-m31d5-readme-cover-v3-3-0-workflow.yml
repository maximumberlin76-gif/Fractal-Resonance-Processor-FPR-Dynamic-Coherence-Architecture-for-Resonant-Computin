name: FRP M31D5 README Cover v3.3.0

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m31d5-readme-cover-v3-3-0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-readme-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_PATH: README.md
      SOURCE_README_BYTES: "124523"
      SOURCE_README_LINES: "4960"
      SOURCE_README_SHA256: 9bdeaa319df33aa59d087919b197063d463a36e71ba58f4b02205640def516d8
      TARGET_BYTES: "10430"
      TARGET_LINES: "254"
      TARGET_SHA256: 9fb5ccd3db24705f0f2c80723dd9b1f2c344e5b53c447927532ab29c2b34ca41
      PAYLOAD_GZIP_BYTES: "3471"
      PAYLOAD_GZIP_SHA256: 8ae8250e66dd8d0a1ba283902d86f3d50f8ac6e9ab021fef2e6dec1bad52d4a0
      PAYLOAD_BASE64_LENGTH: "4628"
      PAYLOAD_BASE64_SHA256: acb375a96cda862aa9e5e62fd3a7e261a48c2172597b01206a6ca607343a405d
      ARTIFACTS_FILES: "127"
      ARTIFACTS_INVENTORY_SHA256: 0d86a8c50c86ba0196f635903cb8cc8d635dd1399787625f7619ad4dd8121f2b
      BENCHMARKS_FILES: "19"
      BENCHMARKS_INVENTORY_SHA256: 54dc4ae9aa858ccd60f577367be909abf1266b76fcefe10c8223e1f22cc78670
      SCHEMAS_FILES: "125"
      SCHEMAS_INVENTORY_SHA256: 384cede6b31eea78b9e85804405d7d8bb3bec42e0ce8489d3f9ed20d36f213d9
      HISTORICAL_RECORDS: "51"
      HISTORICAL_INVENTORY_SHA256: 4e9e38fc72b1704712eb4a8da34ee1cdd658c5a1bb69d070954e0cb431dccaa2
      REQUIREMENTS_PATH: requirements.txt
      REQUIREMENTS_BYTES: "33"
      REQUIREMENTS_SHA256: 75b9bd6237473a063c852298fee983bdfcf550cb1cc828a237afaf726cccc3c7
      D1_INDEX_PATH: FRP_VALIDATION_INDEX_v3_3_0.md
      D1_INDEX_BYTES: "12438"
      D1_INDEX_SHA256: d9cc92a9a51797d536875710933109a42f24120739c8e2960d82205dbb785d3b
      D2_NOTES_PATH: RELEASE_NOTES_v3_3_0.md
      D2_NOTES_BYTES: "8189"
      D2_NOTES_SHA256: 16bb207b2b254ba980272b23e448ad737cd7e2de5da3bdfc005ea9ca2010b648
      D3_REPORT_PATH: TEST_REPORT_v3_3_0.md
      D3_REPORT_BYTES: "9570"
      D3_REPORT_SHA256: 0caabfb9387bf337adbc1724f2b2e8657430145e812b2ff70379212580ba1dd0
      M31_SOURCE_PATH: frp_m31_phase_interference_thermal_evidence.py
      M31_SOURCE_BYTES: "42092"
      M31_SOURCE_SHA256: 1e4ccfd7b157cd2bac609c34dfec9da791653a31af7b29b75502c755807b9c62
      M31_TEST_PATH: tests/test_frp_m31_phase_interference_thermal_evidence.py
      M31_TEST_BYTES: "22370"
      M31_TEST_SHA256: f64214a9c785d8cf579e3a6a5afa6e364772d8972775cc010a3dba89d852c1ed
      M31_SCHEMA_PATH: schemas/m31/frp.m31.phase_interference_active_zero_thermal_evidence.v1.schema.json
      M31_SCHEMA_BYTES: "1468"
      M31_SCHEMA_SHA256: 53d79d45d70753ccd24c3dc4c97af6fee481f86a9d7cdca7ef78b486c76479f7
      M31_EVIDENCE_PATH: artifacts/m31/evidence/m31-phase-interference-active-zero-thermal-evidence.json
      M31_EVIDENCE_BYTES: "39993"
      M31_EVIDENCE_SHA256: bdaa676acbfb09d86d848070e8a2673c5ce6902657a0b13b2e4293383bec8b42
      M31_MANIFEST_PATH: artifacts/m31/manifests/m31-phase-interference-active-zero-thermal-evidence-manifest.json
      M31_MANIFEST_BYTES: "828"
      M31_MANIFEST_SHA256: 80f0841d0041cd22c2f76175b6139e601aede7b69823356ae1fefbce5f793e7c
      M31_QUALIFICATION_PATH: artifacts/m31/qualification/m31-phase-interference-active-zero-thermal-evidence-qualification.json
      M31_QUALIFICATION_BYTES: "1512"
      M31_QUALIFICATION_SHA256: 4c2446f954e01ec0aa37cc6c0fc70cf4a87ec565c450628e31b0efcac9160224
      M30_ARCHIVE_PATH: artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
      M30_ARCHIVE_BYTES: "10189989"
      M30_ARCHIVE_SHA256: 05ea33f6f3f505d315af930c2d51779f7189905308473f32a57375e477069caa
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ github.ref_name }}" = "main"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          echo "Manual main-branch boundary: PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Snapshot protected repository histories
        shell: bash
        run: |
          set -euo pipefail
          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          tree_inventory artifacts > /tmp/m31d5-artifacts.before
          tree_inventory benchmarks > /tmp/m31d5-benchmarks.before
          tree_inventory schemas > /tmp/m31d5-schemas.before
          historical_inventory > /tmp/m31d5-history.before

          test "$(wc -l < /tmp/m31d5-artifacts.before)" -eq "$ARTIFACTS_FILES"
          test "$(sha256sum /tmp/m31d5-artifacts.before | cut -d' ' -f1)" = "$ARTIFACTS_INVENTORY_SHA256"
          test "$(wc -l < /tmp/m31d5-benchmarks.before)" -eq "$BENCHMARKS_FILES"
          test "$(sha256sum /tmp/m31d5-benchmarks.before | cut -d' ' -f1)" = "$BENCHMARKS_INVENTORY_SHA256"
          test "$(wc -l < /tmp/m31d5-schemas.before)" -eq "$SCHEMAS_FILES"
          test "$(sha256sum /tmp/m31d5-schemas.before | cut -d' ' -f1)" = "$SCHEMAS_INVENTORY_SHA256"
          test "$(wc -l < /tmp/m31d5-history.before)" -eq "$HISTORICAL_RECORDS"
          test "$(sha256sum /tmp/m31d5-history.before | cut -d' ' -f1)" = "$HISTORICAL_INVENTORY_SHA256"

          readme_sha="$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)"
          if test "$readme_sha" = "$SOURCE_README_SHA256"; then
            test "$(wc -c < "$TARGET_PATH")" -eq "$SOURCE_README_BYTES"
            test "$(wc -l < "$TARGET_PATH")" -eq "$SOURCE_README_LINES"
          elif test "$readme_sha" = "$TARGET_SHA256"; then
            test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
            test "$(wc -l < "$TARGET_PATH")" -eq "$TARGET_LINES"
          else
            echo "README source boundary mismatch: $readme_sha" >&2
            exit 1
          fi
          echo "Protected repository histories snapshotted: PASS"

      - name: Verify exact M31 publication boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          exact = (
              (os.environ["REQUIREMENTS_PATH"], int(os.environ["REQUIREMENTS_BYTES"]), os.environ["REQUIREMENTS_SHA256"]),
              (os.environ["D1_INDEX_PATH"], int(os.environ["D1_INDEX_BYTES"]), os.environ["D1_INDEX_SHA256"]),
              (os.environ["D2_NOTES_PATH"], int(os.environ["D2_NOTES_BYTES"]), os.environ["D2_NOTES_SHA256"]),
              (os.environ["D3_REPORT_PATH"], int(os.environ["D3_REPORT_BYTES"]), os.environ["D3_REPORT_SHA256"]),
              (os.environ["M31_SOURCE_PATH"], int(os.environ["M31_SOURCE_BYTES"]), os.environ["M31_SOURCE_SHA256"]),
              (os.environ["M31_TEST_PATH"], int(os.environ["M31_TEST_BYTES"]), os.environ["M31_TEST_SHA256"]),
              (os.environ["M31_SCHEMA_PATH"], int(os.environ["M31_SCHEMA_BYTES"]), os.environ["M31_SCHEMA_SHA256"]),
              (os.environ["M31_EVIDENCE_PATH"], int(os.environ["M31_EVIDENCE_BYTES"]), os.environ["M31_EVIDENCE_SHA256"]),
              (os.environ["M31_MANIFEST_PATH"], int(os.environ["M31_MANIFEST_BYTES"]), os.environ["M31_MANIFEST_SHA256"]),
              (os.environ["M31_QUALIFICATION_PATH"], int(os.environ["M31_QUALIFICATION_BYTES"]), os.environ["M31_QUALIFICATION_SHA256"]),
              (os.environ["M30_ARCHIVE_PATH"], int(os.environ["M30_ARCHIVE_BYTES"]), os.environ["M30_ARCHIVE_SHA256"]),
          )
          for path_text, expected_bytes, expected_sha256 in exact:
              path = Path(path_text)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"required regular file is missing: {path}")
              raw = path.read_bytes()
              if (len(raw), hashlib.sha256(raw).hexdigest()) != (expected_bytes, expected_sha256):
                  raise SystemExit(f"M31 publication-boundary mismatch: {path}")
          print("Exact M31 publication boundary: PASS")
          PY

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$REQUIREMENTS_PATH"

      - name: Run all 60 focused M31 qualification tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_frp_m31_phase_interference_thermal_evidence -v 2>&1 | tee /tmp/m31d5-tests.log
          grep -F "Ran 60 tests" /tmp/m31d5-tests.log
          grep -Fx "OK" /tmp/m31d5-tests.log

      - name: Install the clean v3.3.0 README cover
        shell: bash
        run: |
          set -euo pipefail
