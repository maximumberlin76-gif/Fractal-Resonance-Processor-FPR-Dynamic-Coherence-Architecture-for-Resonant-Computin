      - name: Qualify the README cover
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          root = Path(".")
          target = Path(os.environ["TARGET_PATH"])
          raw = target.read_bytes()
          if (len(raw), hashlib.sha256(raw).hexdigest()) != (
              int(os.environ["TARGET_BYTES"]), os.environ["TARGET_SHA256"]
          ):
              raise SystemExit("README cover identity mismatch")
          if not raw.endswith(bytes([10])) or raw.endswith(bytes([10, 10])):
              raise SystemExit("README cover newline mismatch")

          text = raw.decode("utf-8")
          if text.count("# Fractal Resonance Processor (FRP)") != 1:
              raise SystemExit("README title count mismatch")
          required = (
              "Ternary Fractal Resonant Coherence Processor",
              "version-v3.3.0",
              "FRP v3.3.0",
              "M31 — Phase-Interference, Active-Zero, and Thermal-Evidence Publication",
              "60 / 60 PASS",
              "13 / 13 PASS",
              "4 / 4 exact",
              "Classical bit addition is not the",
              "The discrete processor domain is `-1/0/1`.",
              "State `0` is active",
              "Actual direct events | `0`",
              "15.6923076923",
              "93.63%",
              "FRP published bytes → FRP-Trace-Observatory",
              "Maksym Marnov (Alchimist)",
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"README cover claims missing: {missing}")

          forbidden = (
              "<!-- FRP-V3.3.0-M31-CURRENT-RELEASE:START -->",
              "Current repository release:",
              "byte-identical between this header",
              "version-v3.2.0",
              "-1/0/" + chr(43) + "1",
          )
          present = [item for item in forbidden if item in text]
          if present:
              raise SystemExit(f"stale README cover content present: {present}")

          fences = [line for line in text.splitlines() if line.startswith("```")]
          if len(fences) != 12 or any(line != "```" for line in fences):
              raise SystemExit("README code-fence boundary mismatch")

          missing_links = []
          for link in re.findall(r"\[[^\]]*\]\(([^)]+)\)", text):
              if link.startswith(("http://", "https://", "#")):
                  continue
              if not (root / link).exists():
                  missing_links.append(link)
          if missing_links:
              raise SystemExit(f"README relative links missing: {missing_links}")
          print("Clean FRP v3.3.0 README cover: PASS")
          PY

      - name: Prove protected histories are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          tree_inventory artifacts > /tmp/m31d5-artifacts.after
          tree_inventory benchmarks > /tmp/m31d5-benchmarks.after
          tree_inventory schemas > /tmp/m31d5-schemas.after
          historical_inventory > /tmp/m31d5-history.after
          cmp --silent /tmp/m31d5-artifacts.before /tmp/m31d5-artifacts.after
          cmp --silent /tmp/m31d5-benchmarks.before /tmp/m31d5-benchmarks.after
          cmp --silent /tmp/m31d5-schemas.before /tmp/m31d5-schemas.after
          cmp --silent /tmp/m31d5-history.before /tmp/m31d5-history.after
          echo "Evidence, benchmark, schema, and release histories: BYTE-IDENTICAL"

      - name: Verify only README changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          untracked="$(git ls-files --others --exclude-standard)"
          if test -n "$changed"; then
            test "$changed" = "$TARGET_PATH"
          fi
          test -z "$untracked"
          echo "README-only replacement boundary: PASS"

      - name: Commit and publish the README cover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          staged="$(git diff --cached --name-only)"
          if test -z "$staged"; then
            test -z "$(git status --porcelain)"
            echo "FRP v3.3.0 README cover is already published."
            exit 0
          fi
          test "$staged" = "$TARGET_PATH"
          git commit -m "Replace README with FRP v3.3.0 M31 cover"
          git push origin HEAD:main

      - name: Verify published state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
          test "$(wc -l < "$TARGET_PATH")" -eq "$TARGET_LINES"
          test "$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)" = "$TARGET_SHA256"
          {
            echo "## FRP M31D5 README Cover v3.3.0"
            echo
            echo "- Updated file: README.md"
            echo "- Cover: single current version and current milestone"
            echo "- M31 focused tests: 60 / 60 PASS"
            echo "- Evidence and benchmark histories: byte-identical"
            echo "- Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
