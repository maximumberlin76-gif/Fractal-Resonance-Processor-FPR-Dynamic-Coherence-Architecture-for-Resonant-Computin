          kL3A
          """
          encoded_text = "".join(encoded.split())
          expected_size = 19440
          expected_sha256 = "f7060b60b428ac75be7a05be9635a4ea56dc9f1bce6d672adb4bd289dd3038eb"

          def decode_exact(value):
              try:
                  candidate = base64.b64decode(value, validate=True)
              except (ValueError, binascii.Error):
                  return None
              if (
                  len(candidate) == expected_size
                  and hashlib.sha256(candidate).hexdigest() == expected_sha256
              ):
                  return candidate
              return None

          raw = decode_exact(encoded_text)
          if raw is None:
              alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="
              prime = 1_000_003
              expected_length = 25920
              expected_sum = 773613
              expected_weighted_sum = 858907
              if len(encoded_text) != expected_length:
                  raise SystemExit("M24 payload integrity failure")
              invalid = [index for index, character in enumerate(encoded_text) if character not in alphabet]
              if len(invalid) > 1:
                  raise SystemExit("M24 payload integrity failure")
              if invalid:
                  position = invalid[0]
                  known = [alphabet.index(character) for character in encoded_text if character in alphabet]
                  original = (expected_sum - sum(known)) % prime
                  weighted_known = sum(
                      (index + 1) * alphabet.index(character)
                      for index, character in enumerate(encoded_text)
                      if character in alphabet
                  ) % prime
                  if (
                      original >= len(alphabet)
                      or ((position + 1) * original + weighted_known) % prime
                      != expected_weighted_sum
                  ):
                      raise SystemExit("M24 payload integrity failure")
              else:
                  values = [alphabet.index(character) for character in encoded_text]
                  delta = (expected_sum - sum(values)) % prime
                  weighted_delta = (
                      expected_weighted_sum
                      - sum((index + 1) * value for index, value in enumerate(values))
                  ) % prime
                  if delta == 0:
                      raise SystemExit("M24 payload integrity failure")
                  encoded_position = weighted_delta * pow(delta, -1, prime) % prime
                  if not 1 <= encoded_position <= len(encoded_text):
                      raise SystemExit("M24 payload integrity failure")
                  position = encoded_position - 1
                  original = (values[position] + delta) % prime
                  if original >= len(alphabet):
                      raise SystemExit("M24 payload integrity failure")
              repaired = (
                  encoded_text[:position]
                  + alphabet[original]
                  + encoded_text[position + 1:]
              )
              raw = decode_exact(repaired)
              if raw is None:
                  raise SystemExit("M24 payload integrity failure")
              print(f"M24_PAYLOAD_SINGLE_SYMBOL_REPAIRED={position + 1}")

          expected_members = (
              'bootstrap.py',
              'source',
              'source/formal',
              'source/formal/m24',
              'source/formal/m24/frp_m24_bounded_liveness_formal.sv',
              'source/formal/m24/frp_m24_core_properties_formal.sv',
              'source/formal/m24/frp_m24_expected_counterexamples_formal.sv',
              'source/formal/m24/frp_m24_package_properties_formal.sv',
              'source/formal/m24/frp_m24_reset_readiness_formal.sv',
              'source/formal/m24/frp_m24_scheduler_properties_formal.sv',
              'source/frp_m24_formal_bounded_verification.py',
              'source/schemas',
              'source/schemas/m24',
              'source/schemas/m24/frp_m24_formal_bounded_proof_evidence.v2.6.0.schema.json',
              'source/schemas/m24/frp_m24_formal_bounded_verification_contract.v2.6.0.schema.json',
              'source/schemas/m24/frp_m24_formal_bounded_verification_manifest.v2.6.0.schema.json',
              'source/schemas/m24/frp_m24_formal_bounded_verification_qualification.v2.6.0.schema.json',
              'source/schemas/m24/frp_m24_property_inventory.v2.6.0.schema.json',
              'source/schemas/m24/frp_m24_schema_registry.json',
              'source/tests',
              'source/tests/test_frp_m24_formal_bounded_verification.py',
          )
          root = Path(os.environ["M24_ROOT"])
          if root != Path("/tmp/frp_m24_creation") or root.is_symlink():
              raise SystemExit("unsafe M24_ROOT")
          if root.exists():
              if not root.is_dir():
                  raise SystemExit("invalid M24_ROOT")
              shutil.rmtree(root)
          root.mkdir(mode=0o700)

          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:bz2") as archive:
              members_found = archive.getmembers()
              names = tuple(member.name for member in members_found)
              if names != expected_members:
                  raise SystemExit("M24 payload member boundary failure")
              for member in members_found:
                  path = PurePosixPath(member.name)
                  if (
                      "\\" in member.name
                      or path.is_absolute()
                      or any(part in ("", ".", "..") for part in member.name.split("/"))
                      or member.issym()
                      or member.islnk()
                  ):
                      raise SystemExit(f"unsafe M24 payload member: {member.name}")
                  target = root.joinpath(*path.parts)
                  if member.isdir():
                      target.mkdir(mode=0o700, parents=True, exist_ok=True)
                      os.chmod(target, 0o700)
                      continue
                  if not member.isfile():
                      raise SystemExit(f"unsupported M24 payload member: {member.name}")
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"unreadable M24 payload member: {member.name}")
                  target.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  with target.open("xb") as output:
                      output.write(stream.read())
                  os.chmod(target, 0o700 if member.name == "bootstrap.py" else 0o600)
          print(f"M24_PAYLOAD={len(expected_members)}/{len(expected_members)} PASS")
          PY

      - name: Prove, generate, commit, and validate complete M24 closure
        shell: bash
        run: |
          set -euo pipefail
          python "${M24_ROOT}/bootstrap.py"

      - name: Retain M24 formal logs, witnesses, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frp-m24-formal-bounded-verification-reports
          path: |
            /tmp/frp_m24_evidence/*
            /tmp/frp_m24_formal/logs/*
            /tmp/frp_m24_formal/witness/*
          if-no-files-found: warn
          retention-days: 90
