name: FRP M24 Formal Bounded Verification Closure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frp-m24-formal-bounded-verification-closure-workflow.yml"
      - "frp_m24_formal_bounded_verification.py"
      - "formal/m24/**"
      - "schemas/m24/**"
      - "artifacts/m24/**"
      - "tests/test_frp_m24_formal_bounded_verification.py"
      - "rtl/m16/**"
      - "rtl/m23/**"
      - "artifacts/m23/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: frp-m24-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close-m24:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M24_ROOT: /tmp/frp_m24_creation
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact Python and formal dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt yowasp-yosys==0.68.0.0.post1208
          python --version
          yowasp-yosys -V

