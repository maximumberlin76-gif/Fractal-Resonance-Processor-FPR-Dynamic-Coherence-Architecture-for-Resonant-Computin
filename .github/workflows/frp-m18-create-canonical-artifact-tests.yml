name: FRP M18 Create Canonical Artifact Tests

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m18-create-canonical-artifact-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-and-qualify-tests:
    name: Create and Qualify M18 Canonical Artifact Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TARGET_PATH: tests/test_frp_m18_canonical_artifacts.py
      WORKFLOW_PATH: .github/workflows/frp-m18-create-canonical-artifact-tests.yml
      EXPECTED_TARGET_SHA256: d640101d082191de9631543bf3a4cdde5171bf63ec14c81abb65ed2a3349b431
      EXPECTED_PAYLOAD_SHA256: 8e9057bb790bcf905fea453716dca9ac547a8c7c901637a62e5bb2eafda17632
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/frp_m18_create_tests_pycache
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          git ls-files --error-unmatch "$WORKFLOW_PATH"
          test ! -e "$TARGET_PATH"
          printf '%s  %s\n' \
            "4562e0d6b5a0611ce7623d66b563aea7e90afb98e9f534a581a64d59e47c11b1" \
            "frp_m18_canonical_artifacts.py" \
            "35dbce174597da749d95cc8cdbc41f1b67a3d042296ae84e61915ee09c5fdea6" \
            "schemas/m18/frp_m18_schema_registry.json" \
            "75b9bd6237473a063c852298fee983bdfcf550cb1cc828a237afaf726cccc3c7" \
            "requirements.txt" \
            "bdf034303e9557a87ff53fce9193b9480360202e5ece8247d35f44678a871710" \
            "artifacts/m18/manifests/canonical-artifact-manifest.json" \
            "432fef4d9a96e1181a6dc5b96dab64ac5726b1aeccb92702d02bce0721c87c13" \
            "artifacts/m18/manifests/canonical-artifact-qualification.json" \
            "0c05d34d1a550086248e8b95b8ecbc00fd056081bf77ad9b88e65eaa9995950a" \
            "artifacts/m18/manifests/canonical-artifact-self-test.json" \
            | sha256sum --check --strict

      - name: Install exact M18 dependencies
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          import importlib.metadata
          from jsonschema import Draft202012Validator

          if importlib.metadata.version("jsonschema") != "4.25.1":
              raise SystemExit("jsonschema version mismatch")
          if Draft202012Validator.META_SCHEMA.get("$schema") != (
              "https://json-schema.org/draft/2020-12/schema"
          ):
              raise SystemExit("Draft202012Validator is unavailable")
          PY

