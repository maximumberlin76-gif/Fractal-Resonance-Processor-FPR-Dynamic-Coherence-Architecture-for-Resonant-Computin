          """
          encoded_payload = "".join(encoded_payload.split())
          if len(encoded_payload) != 21776:
              raise SystemExit(
                  f"encoded payload length mismatch: {len(encoded_payload)}"
              )
          compressed = base64.b64decode(encoded_payload, validate=True)
          if hashlib.sha256(compressed).hexdigest() != os.environ[
              "EXPECTED_PAYLOAD_SHA256"
          ]:
              raise SystemExit("compressed payload SHA-256 mismatch")
          source_bytes = bz2.decompress(compressed)
          if hashlib.sha256(source_bytes).hexdigest() != os.environ[
              "EXPECTED_TARGET_SHA256"
          ]:
              raise SystemExit("decoded target SHA-256 mismatch")

          root = Path.cwd().resolve()
          relative = Path(os.environ["TARGET_PATH"])
          if (
              relative.is_absolute()
              or ".." in relative.parts
              or relative.as_posix()
              != "tests/test_frp_m18_canonical_artifacts.py"
          ):
              raise SystemExit("unsafe target path")
          target = root / relative
          current = root
          for part in relative.parts[:-1]:
              current /= part
              if current.is_symlink():
                  raise SystemExit("symbolic-link target component")
          if target.exists() or target.is_symlink():
              raise SystemExit("NEW target already exists")
          temporary = target.with_name(f".{target.name}.m18-stage")
          if temporary.exists() or temporary.is_symlink():
              raise SystemExit("temporary sibling already exists")
          try:
              with temporary.open("xb") as stream:
                  stream.write(source_bytes)
                  stream.flush()
                  os.fsync(stream.fileno())
              os.replace(temporary, target)
          finally:
              if temporary.exists():
                  temporary.unlink()
          print(f"created={relative.as_posix()}")
          print(f"bytes={len(source_bytes)}")
          print(f"sha256={hashlib.sha256(source_bytes).hexdigest()}")
          PY
          printf '%s  %s\n' "$EXPECTED_TARGET_SHA256" "$TARGET_PATH" \
            | sha256sum --check --strict

      - name: Validate, compile, and import test module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import hashlib
          import importlib.util
          import os
          from pathlib import Path

          path = Path(os.environ["TARGET_PATH"])
          source = path.read_bytes()
          text = source.decode("utf-8")
          if len(source) != 91579 or len(text.splitlines()) != 2267:
              raise SystemExit("target size mismatch")
          if not source.endswith(b"\n") or b"\r" in source or b"\t" in source:
              raise SystemExit("target formatting mismatch")
          if any(marker in text for marker in ("TODO", "FIXME", "TBD")):
              raise SystemExit("prohibited marker detected")
          if hashlib.sha256(source).hexdigest() != os.environ[
              "EXPECTED_TARGET_SHA256"
          ]:
              raise SystemExit("target SHA-256 mismatch")
          tree = ast.parse(text, filename=str(path))
          names = [
              node.name
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.ClassDef))
          ]
          if len(names) != len(set(names)):
              raise SystemExit("duplicate top-level definition")
          for node in tree.body:
              if isinstance(node, ast.ClassDef):
                  methods = [
                      child.name
                      for child in node.body
                      if isinstance(child, ast.FunctionDef)
                  ]
                  if len(methods) != len(set(methods)):
                      raise SystemExit(f"duplicate method in {node.name}")
          spec = importlib.util.spec_from_file_location("m18_tests", path)
          if spec is None or spec.loader is None:
              raise SystemExit("test-module import specification failure")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          expected_counts = {
              "EXPECTED_SCHEMA_IDENTIFIERS": 24,
              "GENERATED_PATHS": 36,
              "MANIFEST_BOUND_PATHS": 64,
              "SELF_TEST_CASE_IDS": 34,
          }
          for name, count in expected_counts.items():
              if len(getattr(module, name)) != count:
                  raise SystemExit(f"{name} count mismatch")
          PY
          python -m py_compile \
            frp_m18_canonical_artifacts.py \
            tests/test_frp_m18_canonical_artifacts.py

      - name: Run producer self-test
        shell: bash
        run: |
          set -euo pipefail
          python frp_m18_canonical_artifacts.py \
            --self-test \
            --output json \
            > /tmp/frp_m18_self_test.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/frp_m18_self_test.json").read_text(encoding="utf-8")
          )
          expected = {
              "case_count": 34,
              "passed_count": 34,
              "failed_count": 0,
              "overall_status": "PASS",
          }
          if any(payload.get(key) != value for key, value in expected.items()):
              raise SystemExit("producer self-test mismatch")
          PY

      - name: Run isolated M18 test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s tests \
            -p 'test_frp_m18_canonical_artifacts.py' \
            -v

      - name: Run complete repository test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v

      - name: Commit qualified test module and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$EXPECTED_TARGET_SHA256" "$TARGET_PATH" \
            | sha256sum --check --strict
          git diff --exit-code
          mapfile -t status_lines < <(
            git status --porcelain --untracked-files=all
          )
          if [[ "${#status_lines[@]}" -ne 1 ]] \
            || [[ "${status_lines[0]}" != "?? $TARGET_PATH" ]]; then
            printf 'unexpected repository status:\n%s\n' \
              "${status_lines[*]}" >&2
            exit 1
          fi
          git add -- "$TARGET_PATH"
          git rm -- "$WORKFLOW_PATH"
          git diff --cached --check
          mapfile -t staged_paths < <(
            git diff --cached --name-only | sort
          )
          mapfile -t expected_paths < <(
            printf '%s\n' "$TARGET_PATH" "$WORKFLOW_PATH" | sort
          )
          if [[ "${staged_paths[*]}" != "${expected_paths[*]}" ]]; then
            printf 'unexpected staged paths:\n%s\n' \
              "${staged_paths[*]}" >&2
            exit 1
          fi
          staged_sha256="$(
            git show ":$TARGET_PATH" | sha256sum | awk '{print $1}'
          )"
          test "$staged_sha256" = "$EXPECTED_TARGET_SHA256"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Add M18 canonical artifact qualification tests" \
            -m "Add independent unittest coverage for the M18 producer, registry, formal schemas, canonical artifacts, manifests, qualification records, self-tests, determinism, and security boundaries. Remove the one-time creation workflow after successful qualification."
          git push origin HEAD:main
          test -z "$(git status --porcelain --untracked-files=all)"
          {
            echo "### FRP M18 canonical artifact tests"
            echo
            echo "- Target: $TARGET_PATH"
            echo "- SHA-256: $EXPECTED_TARGET_SHA256"
            echo "- Isolated M18 suite: PASS"
            echo "- Complete repository suite: PASS"
            echo "- One-time workflow: removed"
          } >> "$GITHUB_STEP_SUMMARY"
