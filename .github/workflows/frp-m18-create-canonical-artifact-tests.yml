              "".join(encoded_payload.split()),
              validate=True,
          )
          if hashlib.sha256(compressed).hexdigest() != os.environ[
              "EXPECTED_PAYLOAD_SHA256"
          ]:
              raise SystemExit("compressed payload SHA-256 mismatch")

          source_bytes = gzip.decompress(compressed)
          observed_sha256 = hashlib.sha256(source_bytes).hexdigest()
          if observed_sha256 != os.environ["EXPECTED_TARGET_SHA256"]:
              raise SystemExit("decoded target SHA-256 mismatch")

          repository_root = Path.cwd().resolve()
          relative_target = Path(os.environ["TARGET_PATH"])
          if (
              relative_target.is_absolute()
              or ".." in relative_target.parts
              or relative_target.as_posix()
              != "tests/test_frp_m18_canonical_artifacts.py"
          ):
              raise SystemExit("unsafe or unexpected target path")

          target = repository_root / relative_target
          current = repository_root
          for part in relative_target.parts[:-1]:
              current = current / part
              if current.is_symlink():
                  raise SystemExit("symbolic-link target component")
          if target.exists() or target.is_symlink():
              raise SystemExit("NEW target already exists")
          if not target.parent.is_dir():
              raise SystemExit("target parent directory is missing")

          temporary = target.with_name(f".{target.name}.m18-stage")
          if temporary.exists() or temporary.is_symlink():
              raise SystemExit("temporary sibling already exists")
          try:
              with temporary.open("xb") as stream:
                  stream.write(source_bytes)
                  stream.flush()
                  os.fsync(stream.fileno())
              os.replace(temporary, target)
          finally:
              if temporary.exists():
                  temporary.unlink()

          if hashlib.sha256(target.read_bytes()).hexdigest() != observed_sha256:
              raise SystemExit("created target SHA-256 mismatch")
          print(f"created={relative_target.as_posix()}")
          print(f"bytes={len(source_bytes)}")
          print(f"sha256={observed_sha256}")
          PY

          printf '%s  %s\n' "$EXPECTED_TARGET_SHA256" "$TARGET_PATH" \
            | sha256sum --check --strict

      - name: Validate source structure and formatting
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import ast
          import hashlib
          import os
          from pathlib import Path


          path = Path(os.environ["TARGET_PATH"])
          source_bytes = path.read_bytes()
          source_text = source_bytes.decode("utf-8")
          if len(source_bytes) != 91579:
              raise SystemExit("target byte length mismatch")
          if len(source_text.splitlines()) != 2267:
              raise SystemExit("target source-line count mismatch")
          if not source_bytes.endswith(b"\n") or b"\r" in source_bytes:
              raise SystemExit("target is not LF-only with final LF")
          if b"\t" in source_bytes:
              raise SystemExit("tab character detected")
          for marker in ("TODO", "FIXME", "TBD"):
              if marker in source_text:
                  raise SystemExit(f"prohibited marker detected: {marker}")
          observed_sha256 = hashlib.sha256(source_bytes).hexdigest()
          if observed_sha256 != os.environ["EXPECTED_TARGET_SHA256"]:
              raise SystemExit("target SHA-256 changed before validation")

          tree = ast.parse(source_text, filename=str(path))
          required_classes = {
              "M18ProducerInterfaceTests",
              "M18SchemaRegistryTests",
              "M18FormalSchemaTests",
              "M18CanonicalArtifactTests",
              "M18ManifestTests",
              "M18QualificationRecordTests",
              "M18SelfTestRecordTests",
              "M18DeterminismTests",
              "M18SecurityBoundaryTests",
          }
          classes = [
              node for node in tree.body if isinstance(node, ast.ClassDef)
          ]
          if {node.name for node in classes} != required_classes:
              raise SystemExit("required M18 test-class set mismatch")
          top_level_names = [
              node.name
              for node in tree.body
              if isinstance(
                  node,
                  (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef),
              )
          ]
          if len(top_level_names) != len(set(top_level_names)):
              raise SystemExit("duplicate top-level definition")
          for class_node in classes:
              method_names = [
                  node.name
                  for node in class_node.body
                  if isinstance(
                      node,
                      (ast.FunctionDef, ast.AsyncFunctionDef),
                  )
              ]
              if len(method_names) != len(set(method_names)):
                  raise SystemExit(
                      f"duplicate method in {class_node.name}"
                  )
          if "expectedFailure" in source_text:
              raise SystemExit("expected failure is prohibited")
          print("source_structure=PASS")
          print("source_formatting=PASS")
          PY

      - name: Compile and import M18 sources
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q \
            frp_m18_canonical_artifacts.py \
            tests/test_frp_m18_canonical_artifacts.py

          python - <<'PY'
          import tests.test_frp_m18_canonical_artifacts as test_module

          if len(test_module.EXPECTED_SCHEMA_IDENTIFIERS) != 24:
              raise SystemExit("schema identifier count mismatch")
          if len(test_module.GENERATED_PATHS) != 36:
              raise SystemExit("generated path count mismatch")
          if len(test_module.MANIFEST_BOUND_PATHS) != 64:
              raise SystemExit("manifest path count mismatch")
          if len(test_module.SELF_TEST_CASE_IDS) != 34:
              raise SystemExit("self-test case count mismatch")
          print("test_module_import=PASS")
          PY

      - name: Run producer self-test
        shell: bash
        run: |
          set -euo pipefail

          self_test_path="/tmp/frp_m18_create_tests_self_test.json"
          python frp_m18_canonical_artifacts.py \
            --self-test \
            --output json \
            > "$self_test_path"

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "/tmp/frp_m18_create_tests_self_test.json"
              ).read_text(encoding="utf-8")
          )
          expected = {
              "case_count": 34,
              "passed_count": 34,
              "failed_count": 0,
              "overall_status": "PASS",
          }
          for key, value in expected.items():
              if payload.get(key) != value:
                  raise SystemExit(f"self-test {key} mismatch")
          print("producer_self_test=34/34 PASS")
          PY

      - name: Run isolated M18 test suite
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest discover \
            -s tests \
            -p 'test_frp_m18_canonical_artifacts.py' \
            -v

      - name: Run complete repository test suite
        shell: bash
        run: |
          set -euo pipefail

          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v

      - name: Commit qualified test module and remove this workflow
        shell: bash
        run: |
          set -euo pipefail

          printf '%s  %s\n' "$EXPECTED_TARGET_SHA256" "$TARGET_PATH" \
            | sha256sum --check --strict
          git diff --exit-code

          mapfile -t status_lines < <(
            git status --porcelain --untracked-files=all
          )
          if [[ "${#status_lines[@]}" -ne 1 ]] \
            || [[ "${status_lines[0]}" != "?? $TARGET_PATH" ]]; then
            printf 'unexpected repository status:\n%s\n' \
              "${status_lines[*]}" >&2
            exit 1
          fi

          git add -- "$TARGET_PATH"
          git rm -- "$WORKFLOW_PATH"
          git diff --cached --check

          mapfile -t staged_paths < <(
            git diff --cached --name-only | sort
          )
          expected_paths=(
            "$WORKFLOW_PATH"
            "$TARGET_PATH"
          )
          mapfile -t expected_paths < <(
            printf '%s\n' "${expected_paths[@]}" | sort
          )
          if [[ "${staged_paths[*]}" != "${expected_paths[*]}" ]]; then
            printf 'unexpected staged paths:\n%s\n' \
              "${staged_paths[*]}" >&2
            exit 1
          fi

          staged_sha256="$(
            git show ":$TARGET_PATH" | sha256sum | awk '{print $1}'
          )"
          test "$staged_sha256" = "$EXPECTED_TARGET_SHA256"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Add M18 canonical artifact qualification tests" \
            -m "Add independent unittest coverage for the M18 producer, registry, formal schemas, canonical artifacts, manifests, qualification records, self-tests, determinism, and security boundaries. Remove the one-time creation workflow after successful qualification."
          git push origin HEAD:main

          test -z "$(git status --porcelain --untracked-files=all)"

          {
            echo "### FRP M18 canonical artifact tests"
            echo
            echo "- Target: $TARGET_PATH"
            echo "- SHA-256: $EXPECTED_TARGET_SHA256"
            echo "- Isolated M18 suite: PASS"
            echo "- Complete repository suite: PASS"
            echo "- One-time workflow: removed"
          } >> "$GITHUB_STEP_SUMMARY"
