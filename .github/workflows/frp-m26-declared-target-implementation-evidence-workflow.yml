          expected_files = {"constraints/m26/frp_m26_ice40_hx8k_ct256.sdc":"fb14c501f2f568301d2697304cc69c721293e8ee888dc25fe4ecc6ea984e0957","frp_m26_declared_target_implementation_evidence.py":"03126e4ba71ced2f81d4d360cbfd3a4ceb0f9c97e986d969ef61531c5cb5cfd5","rtl/m26/frp_m26_declared_target_top.sv":"4f12873a8b00ef9bdc9ce0eaeaf92549c5e1867527e80d21bf80a79e5e3b3912","rtl/m26/frp_m26_protocol_monitor_synthesis_stub.sv":"b5d7a79ad7f174b42f262a79e6f76af0199ad8ba8ae4dc491f89324dc0c28a05","schemas/m26/frp_m26_declared_target_implementation_contract.v2.8.0.schema.json":"a64cbb7fc6f13d8aa774398c4f099f89e298b783e45652877ffaf479375fd451","schemas/m26/frp_m26_declared_target_implementation_manifest.v2.8.0.schema.json":"ba3b7ca1c9c7cb15340cfc6353ed549eea320e2322843031ec27582627acb4b9","schemas/m26/frp_m26_declared_target_implementation_qualification.v2.8.0.schema.json":"454c44cdda3d83ab0568c6e74baaab36873241e0acdbed8ea24bc61212dd11f4","schemas/m26/frp_m26_declared_target_implementation_report.v2.8.0.schema.json":"c5ad304519816924e741f3e2486450075f854647b1af641f5933c558b06af2d9","schemas/m26/frp_m26_reproducibility_record.v2.8.0.schema.json":"4cd9459fc2bceeb469f5fd2493ad45709df74cb44558697a79e2e2260aab0562","schemas/m26/frp_m26_schema_registry.json":"236fbaf0ebda06b676eab58176269e3e35283f285689c7bee2dfd6669ffcf40f","schemas/m26/frp_m26_tool_command_provenance.v2.8.0.schema.json":"67e6746733b1506d0691dd1607b3225d6c050fd62a89dafde139fe87e4a4ba9b","tests/test_frp_m26_declared_target_implementation_evidence.py":"cbd6e2ac90b802a8d4a97d53865a0939f7694491f221eee0092d4ae306cfd8d8"}

          try:
              compressed = base64.b64decode("".join(encoded.split()), validate=True)
          except binascii.Error as exc:
              raise SystemExit(f"invalid M26 base64 payload: {exc}")
          observed_archive_sha256 = hashlib.sha256(compressed).hexdigest()
          if observed_archive_sha256 != expected_archive_sha256:
              raise SystemExit(
                  "M26 payload digest mismatch: "
                  f"{observed_archive_sha256} != {expected_archive_sha256}"
              )

          extracted = {}
          with tarfile.open(fileobj=io.BytesIO(compressed), mode="r:bz2") as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or not path.parts
                      or any(part in ("", ".", "..") for part in member.name.split("/"))
                  ):
                      raise SystemExit(f"unsafe M26 payload path: {member.name}")
                  if member.isdir():
                      continue
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f"non-regular M26 payload member: {member.name}")
                  if member.name in extracted:
                      raise SystemExit(f"duplicate M26 payload member: {member.name}")
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"unreadable M26 payload member: {member.name}")
                  extracted[member.name] = stream.read()

          if set(extracted) != set(expected_files):
              missing = sorted(set(expected_files) - set(extracted))
              extra = sorted(set(extracted) - set(expected_files))
              raise SystemExit(f"M26 payload membership mismatch: missing={missing}, extra={extra}")

          for relative, expected_digest in sorted(expected_files.items()):
              observed_digest = hashlib.sha256(extracted[relative]).hexdigest()
              if observed_digest != expected_digest:
                  raise SystemExit(
                      f"M26 source digest mismatch for {relative}: "
                      f"{observed_digest} != {expected_digest}"
                  )

          work_root = Path(os.environ["M26_PAYLOAD_ROOT"])
          if work_root.is_symlink():
              raise SystemExit(f"M26 payload root is a symlink: {work_root}")
          if work_root.exists():
              shutil.rmtree(work_root)
          work_root.mkdir(parents=True, mode=0o700)

          repository_root = Path.cwd().resolve()
          for relative, raw in sorted(extracted.items()):
              parts = PurePosixPath(relative).parts
              work_target = work_root.joinpath(*parts)
              work_target.parent.mkdir(parents=True, exist_ok=True)
              work_target.write_bytes(raw)

              destination = repository_root.joinpath(*parts)
              if destination.is_symlink():
                  raise SystemExit(f"refusing M26 symlink destination: {relative}")
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(raw)

          print(json.dumps({
              "status": "PASS",
              "archive_sha256": observed_archive_sha256,
              "file_count": len(extracted),
          }, sort_keys=True))
          PY

      - name: Enforce the immutable core vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("frp_m26_declared_target_implementation_evidence.py"),
              *sorted(Path("rtl/m26").glob("*.sv")),
              *sorted(Path("constraints/m26").glob("*.sdc")),
              *sorted(Path("schemas/m26").glob("*.json")),
              Path("tests/test_frp_m26_declared_target_implementation_evidence.py"),
          ]
          forbidden = "-1/0/" + "+1"
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if forbidden in text:
                  raise SystemExit(f"non-canonical ternary notation in {path}")
          PY
          grep -F '"balanced_ternary_notation": {"const": "-1/0/1"}' schemas/m26/frp_m26_declared_target_implementation_contract.v2.8.0.schema.json
          grep -F '"temporal_scheduler_modes": {"const": ["1/7", "7/1"]}' schemas/m26/frp_m26_declared_target_implementation_contract.v2.8.0.schema.json

      - name: Run the exact declared-target implementation twice
        shell: bash
        run: |
          set -euo pipefail
          python frp_m26_declared_target_implementation_evidence.py \
            --run-implementation \
            --repository-root . \
            --work-root "$M26_IMPLEMENTATION_ROOT" \
            --yosys yowasp-yosys \
            --nextpnr yowasp-nextpnr-ice40 \
            --source-commit "$M26_SOURCE_COMMIT" \
            --output /tmp/frp_m26_implementation_result.json
          python -m json.tool /tmp/frp_m26_implementation_result.json

      - name: Generate the complete deterministic M26 artifact package
        shell: bash
        run: |
          set -euo pipefail
          python frp_m26_declared_target_implementation_evidence.py \
            --generate \
            --repository-root . \
            --output-root . \
            --implementation-result /tmp/frp_m26_implementation_result.json \
            --source-commit "$M26_SOURCE_COMMIT" \
            --output /tmp/frp_m26_generation.json
          python -m json.tool /tmp/frp_m26_generation.json

      - name: Run complete M26 qualification tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_frp_m26_declared_target_implementation_evidence.py' -v
          python frp_m26_declared_target_implementation_evidence.py \
            --verify \
            --repository-root . \
            --source-commit "$M26_SOURCE_COMMIT" \
            --output /tmp/frp_m26_verification.json
          python frp_m26_declared_target_implementation_evidence.py \
            --self-test \
            --repository-root . \
            --source-commit "$M26_SOURCE_COMMIT" \
            --output /tmp/frp_m26_self_test.json
          python -m json.tool /tmp/frp_m26_verification.json
          python -m json.tool /tmp/frp_m26_self_test.json

      - name: Run the complete repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate the closed M26 change boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- rtl/m16 rtl/m22 rtl/m23 artifacts/m25 schemas/m25

          while IFS= read -r changed_path; do
            case "$changed_path" in
              frp_m26_declared_target_implementation_evidence.py|\
              rtl/m26/*|\
              constraints/m26/*|\
              schemas/m26/*|\
              artifacts/m26/*|\
              tests/test_frp_m26_declared_target_implementation_evidence.py)
                ;;
              *)
                echo "M26 attempted to modify an undeclared path: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | LC_ALL=C sort -u
          )

      - name: Create the qualified M26 commit and push main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            frp_m26_declared_target_implementation_evidence.py \
            rtl/m26 \
            constraints/m26 \
            schemas/m26 \
            artifacts/m26 \
            tests/test_frp_m26_declared_target_implementation_evidence.py

          if git diff --cached --quiet; then
            echo "M26 package is already byte-identical; no commit required."
            exit 0
          fi

          git commit -m "Add M26 declared-target implementation evidence" \
            -m "Bind reproducible synthesis, place-and-route, timing, resource, warning, and digest evidence to the declared iCE40HX8K-CT256 target while preserving the immutable -1/0/1 core and the 1/7 and 7/1 temporal scheduler modes."

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Retain M26 implementation and qualification logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frp-m26-declared-target-implementation-logs-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/frp_m26_implementation/run_a/**
            /tmp/frp_m26_implementation/run_b/**
            /tmp/frp_m26_implementation_result.json
            /tmp/frp_m26_generation.json
            /tmp/frp_m26_verification.json
            /tmp/frp_m26_self_test.json
