name: FRP M26 Declared-Target Implementation Evidence

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m26-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close-m26:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      M26_PAYLOAD_ROOT: /tmp/frp_m26_creation
      M26_IMPLEMENTATION_ROOT: /tmp/frp_m26_implementation
      M26_SOURCE_COMMIT: d83e23785d292adaaf419c31e51abb294ddf98f9
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact Python and implementation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -r requirements.txt \
            yowasp-yosys==0.68.0.0.post1208 \
            yowasp-nextpnr-ice40==0.11.1.0.post826
          python --version
          yowasp-yosys -V
          yowasp-nextpnr-ice40 --version

      - name: Validate the immutable M25 to M26 source boundary
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${M26_SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$M26_SOURCE_COMMIT" HEAD

          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/frp-m26-declared-target-implementation-evidence-workflow.yml|\
              frp_m26_declared_target_implementation_evidence.py|\
              rtl/m26/*|\
              constraints/m26/*|\
              schemas/m26/*|\
              artifacts/m26/*|\
              tests/test_frp_m26_declared_target_implementation_evidence.py)
                ;;
              *)
                echo "Unexpected change after the exact M25 boundary: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$M26_SOURCE_COMMIT"..HEAD)

          test "$(git show -s --format=%s "$M26_SOURCE_COMMIT")" = "Add M25 fault negative-path and recovery qualification"
          test "$(git rev-parse "$M26_SOURCE_COMMIT")" = "$M26_SOURCE_COMMIT"

