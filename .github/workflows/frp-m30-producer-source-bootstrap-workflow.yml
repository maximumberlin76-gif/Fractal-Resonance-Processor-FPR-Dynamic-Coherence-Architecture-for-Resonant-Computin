name: FRP M30 Producer Source Bootstrap Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m30-producer-source-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-m30-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      M30_SOURCE_COMMIT: ff3dd434da5dcbd9e8fa62444f658ed4c495b540
      M30_SOURCE_PATH: frp_m30_reproducibility_qualification_archival_closure.py
      M30_SOURCE_SHA256: 764b82eace9d90b79d7955a80c571e9e4d22de395d2e5b6ee4d38e910af0c870
      M30_SOURCE_BZ2_SHA256: 2262bc98dca8e7b5c585fdc908f96b258b2502616eacb9d900c2a231505fa7ab
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate the immutable M29 source boundary
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${M30_SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$M30_SOURCE_COMMIT" HEAD
          test "$(git rev-parse "$M30_SOURCE_COMMIT")" = "$M30_SOURCE_COMMIT"
          test "$(git show -s --format=%s "$M30_SOURCE_COMMIT")" = \
            "Add M29 system integration and downstream compatibility closure"
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(
              Path(
                  "artifacts/m29/contracts/"
                  "m29-system-integration-contract.json"
              ).read_text(encoding="utf-8")
          )
          qualification = json.loads(
              Path(
                  "artifacts/m29/manifests/"
                  "m29-system-integration-qualification.json"
              ).read_text(encoding="utf-8")
          )
          expected_core = {
              "balanced_ternary_notation": "-1/0/1",
              "semantic_values": [-1, 0, 1],
              "active_neutral_state": 0,
              "opposite_transition_routes": [[-1, 0, 1], [1, 0, -1]],
              "actual_direct_events": 0,
              "temporal_scheduler_modes": ["1/7", "7/1"],
              "service_scheduler_mode": "free",
          }
          if contract.get("immutable_core") != expected_core:
              raise SystemExit("M29 immutable core boundary mismatch")
          boundary = contract.get("integration_boundary", {})
          expected_boundary = {
              "downstream_repository": "FRP-Trace-Observatory",
              "direction": "upstream_to_published_bytes_to_downstream",
              "existing_scaffold_action": "preserve_existing_scaffold",
              "downstream_writeback": "forbidden",
              "downstream_source_mutation": "forbidden",
              "downstream_semantic_reimplementation": "forbidden",
              "upstream_dependency_on_downstream_code": False,
              "downstream_files_modified_by_m29": False,
          }
          for key, expected in expected_boundary.items():
              if boundary.get(key) != expected:
                  raise SystemExit(f"M29 Observatory boundary mismatch: {key}")
          if qualification.get("status") != "PASS":
              raise SystemExit("M29 qualification is not PASS")
          if qualification.get("check_count") != 48:
              raise SystemExit("M29 qualification count mismatch")
          if qualification.get("failed_count") != 0:
              raise SystemExit("M29 qualification failure")
          print("Immutable M29 source boundary: PASS")
          PY

      - name: Restore and validate the complete M30 producer source
        shell: bash
        run: |
          set -euo pipefail
          install -d /tmp/frp_m30_producer_bootstrap
