          M30_PRODUCER_B64
          python - <<'PY'
          import bz2
          import hashlib
          import os
          from pathlib import Path

          compressed_path = Path("/tmp/frp_m30_producer_bootstrap/source.py.bz2")
          compressed = compressed_path.read_bytes()
          if hashlib.sha256(compressed).hexdigest() != os.environ["M30_SOURCE_BZ2_SHA256"]:
              raise SystemExit("M30 producer compressed digest mismatch")
          try:
              raw = bz2.decompress(compressed)
          except OSError as exc:
              raise SystemExit("M30 producer bzip2 validation failed") from exc
          if hashlib.sha256(raw).hexdigest() != os.environ["M30_SOURCE_SHA256"]:
              raise SystemExit("M30 producer source digest mismatch")
          destination = Path(os.environ["M30_SOURCE_PATH"])
          if destination.exists() and destination.is_symlink():
              raise SystemExit("refusing M30 producer symlink destination")
          destination.write_bytes(raw)
          if destination.stat().st_size != 89441:
              raise SystemExit("M30 producer byte count mismatch")
          print("M30 producer source restored: PASS")
          PY

      - name: Validate the complete M30 producer semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$M30_SOURCE_PATH"
          python - <<'PY'
          import ast
          import hashlib
          import os
          from pathlib import Path

          path = Path(os.environ["M30_SOURCE_PATH"])
          raw = path.read_bytes()
          text = raw.decode("utf-8")
          if hashlib.sha256(raw).hexdigest() != os.environ["M30_SOURCE_SHA256"]:
              raise SystemExit("installed M30 producer digest mismatch")
          ast.parse(text, filename=str(path))
          forbidden = "-1/0/" + "+1"
          if forbidden in text:
              raise SystemExit("forbidden ternary notation in M30 producer")
          required = (
              '"balanced_ternary_notation": "-1/0/1"',
              '"temporal_scheduler_modes": ["1/7", "7/1"]',
              '"service_scheduler_mode": "free"',
              '"repository": "FRP-Trace-Observatory"',
              '"downstream_writeback": "forbidden"',
              "frp-m30-producer-source-bootstrap-workflow.yml",
              "frp-m30-qualification-test-bootstrap-workflow.yml",
              "frp-m30-reproducibility-qualification-archival-release-closure-workflow.yml",
              '("workflow_index_complete", len(workflows) == 40)',
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f"M30 producer semantic boundary missing: {missing}")
          print("M30 producer semantic boundary: PASS")
          PY

      - name: Commit and publish only the M30 producer source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$M30_SOURCE_PATH"
          if git diff --cached --quiet; then
            echo "M30 producer source is already committed; no commit is required."
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "$M30_SOURCE_PATH"
          git commit \
            -m "Add M30 reproducibility qualification producer source" \
            -m "Add the integrity-verified M30 producer source while preserving the immutable -1/0/1 core, active neutral state 0, temporal schedulers 1/7 and 7/1, separate free service mode, and the FRP Trace Observatory one-way read-only published-byte boundary."
          git push origin HEAD:main
