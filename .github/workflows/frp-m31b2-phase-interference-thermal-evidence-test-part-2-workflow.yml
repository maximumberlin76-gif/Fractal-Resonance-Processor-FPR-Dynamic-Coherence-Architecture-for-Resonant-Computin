name: FRP M31B2 Phase-Interference Thermal Evidence Test Part 2 Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m31b2-evidence-test-part-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-m31-test-payload-part-2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      M31_SOURCE_PATH: frp_m31_phase_interference_thermal_evidence.py
      M31_SOURCE_SHA256: 1e4ccfd7b157cd2bac609c34dfec9da791653a31af7b29b75502c755807b9c62
      M31_SOURCE_BYTES: "42092"
      M31_TEST_PATH: tests/test_frp_m31_phase_interference_thermal_evidence.py
      M31_TEST_SHA256: f64214a9c785d8cf579e3a6a5afa6e364772d8972775cc010a3dba89d852c1ed
      M31_TEST_BYTES: "22370"
      M31_PART_1_PATH: .frp-bootstrap/m31/test.py.bz2.b64.part01
      M31_OLD_PART_1_SHA256: 396b1f42b9172acce2c6969acb16d684342330739e431c3bad4be6f1c1ba26fb
      M31_OLD_PART_1_BYTES: "3492"
      M31_PART_1_SHA256: 02ef4a01ce6d53184c100e1a05279ded16c7225bc1b4f64c322c4a36f1a7f83e
      M31_PART_1_BYTES: "3320"
      M31_PART_2_PATH: .frp-bootstrap/m31/test.py.bz2.b64.part02
      M31_PART_2_SHA256: 61cd1639c0dff1b574872ab2ff065d717108fdd44d2b50509ba27971302059de
      M31_PART_2_BYTES: "3324"
      M31_BASE64_SHA256: 979b98dd577a5ee2e3d280b2e77b9e814fb2e723e3f6865f5a373aa9c62cd3e5
      M31_BASE64_BYTES: "6644"
      M31_COMPRESSED_SHA256: 5e418f30a075e324fd389d4b743b5bfb44e3209cbde183fbb362eed5efa27be6
      M31_COMPRESSED_BYTES: "4982"
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate the committed M31 producer and B1 boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          def exact(path: Path, expected_bytes: int, expected_digest: str) -> bool:
              if path.is_symlink() or not path.is_file():
                  return False
              raw = path.read_bytes()
              return (
                  len(raw) == expected_bytes
                  and hashlib.sha256(raw).hexdigest() == expected_digest
              )

          source = Path(os.environ["M31_SOURCE_PATH"])
          if not exact(
              source,
              int(os.environ["M31_SOURCE_BYTES"]),
              os.environ["M31_SOURCE_SHA256"],
          ):
              raise SystemExit("committed M31 producer boundary mismatch")

          test = Path(os.environ["M31_TEST_PATH"])
          part_1 = Path(os.environ["M31_PART_1_PATH"])
          part_2 = Path(os.environ["M31_PART_2_PATH"])
          if test.exists():
              if not exact(
                  test,
                  int(os.environ["M31_TEST_BYTES"]),
                  os.environ["M31_TEST_SHA256"],
              ):
                  raise SystemExit("existing M31 test source boundary mismatch")
              if part_1.exists() or part_2.exists():
                  raise SystemExit("assembled M31 test and stale payload coexist")
              Path("/tmp/m31-test-already-complete").write_text(
                  "PASS\n", encoding="ascii"
              )
          elif part_2.exists():
              if not exact(
                  part_1,
                  int(os.environ["M31_PART_1_BYTES"]),
                  os.environ["M31_PART_1_SHA256"],
              ) or not exact(
                  part_2,
                  int(os.environ["M31_PART_2_BYTES"]),
                  os.environ["M31_PART_2_SHA256"],
              ):
                  raise SystemExit("existing rebased M31 test payload mismatch")
              Path("/tmp/m31-test-payload-already-complete").write_text(
                  "PASS\n", encoding="ascii"
              )
          elif not exact(
              part_1,
              int(os.environ["M31_OLD_PART_1_BYTES"]),
              os.environ["M31_OLD_PART_1_SHA256"],
          ):
              raise SystemExit("committed M31B1 payload boundary mismatch")
          print("Committed M31 producer and B1 boundary: PASS")
          PY

      - name: Install the integrity-bound rebased two-part M31 test payload
        if: ${{ success() }}
        shell: bash
        env:
          M31_SEGMENT_01: 
          M31_SEGMENT_02: 
          M31_SEGMENT_03: yfRup1D97mt+q0h+7Pd6hbTqrk0nUD4PQ8JsNixHqWUuTQuo+HXNSVUyLpyuGEaEIFrUSSmlOg6cv10NTugQNE1DoALlxAumSuvEOEnCkgzh1ufjuZRhQsGS
          M31_SEGMENT_04: 
          M31_SEGMENT_05: 
          M31_SEGMENT_06: zjGEg0WNMV3LRypsamCMio7QVs+HY4h5N/HWAZ6aonn7NLhhpCURkGCiQ0ErExslrFYHI7J3U5pyeatRPTxO8JUIP8Xh/iY/z4Ebd1J2dlI/4u5IpwoSGH84c2A=
        run: |
          set -euo pipefail
          if [[ -f /tmp/m31-test-already-complete ]] || \
             [[ -f /tmp/m31-test-payload-already-complete ]]; then
            echo "M31 test payload is already complete."
            exit 0
          fi
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          specifications = (
              ("M31_SEGMENT_01", 1600, "a1ad781e0691162d1ce7f4a3d6910179394b99e6b5ac6d24265b89b6e341946e"),
              ("M31_SEGMENT_02", 1600, "703b2922211fae6a31f2e82c157466da9e0a9f756532b165bae725b2daea8a08"),
              ("M31_SEGMENT_03", 120, "8107ac95fb12203a3d039657eeb1d6adfb5d47c024711dd84dfa910a9cf81d8b"),
              ("M31_SEGMENT_04", 1600, "105af156aee49c94a758a4a747fd04e2f22f94dbd6a7505a9c7c02a56bcd2b2e"),
              ("M31_SEGMENT_05", 1600, "b0a71e8afd899af43455f9c252ac2c8b2e21853f37796cb907e859174a84df43"),
              ("M31_SEGMENT_06", 124, "9eb81bdbb4b1fdd0844f495ed87cf409d78810055a0b9fb13e5d8480721a0a2f"),
          )
          segments = []
          for name, expected_bytes, expected_digest in specifications:
              raw = os.environ[name].encode("ascii")
              if len(raw) != expected_bytes:
                  raise SystemExit(f"M31 payload segment byte mismatch: {name}")
              if hashlib.sha256(raw).hexdigest() != expected_digest:
                  raise SystemExit(f"M31 payload segment digest mismatch: {name}")
              segments.append(raw)

          part_1 = b"".join(segments[:3])
          part_2 = b"".join(segments[3:])
          destinations = (
              (
                  Path(os.environ["M31_PART_1_PATH"]),
                  part_1,
                  int(os.environ["M31_PART_1_BYTES"]),
                  os.environ["M31_PART_1_SHA256"],
              ),
              (
                  Path(os.environ["M31_PART_2_PATH"]),
                  part_2,
                  int(os.environ["M31_PART_2_BYTES"]),
                  os.environ["M31_PART_2_SHA256"],
              ),
          )
          for path, raw, expected_bytes, expected_digest in destinations:
              if path.exists() and (path.is_symlink() or not path.is_file()):
                  raise SystemExit(f"refusing invalid M31 payload path: {path}")
              if len(raw) != expected_bytes:
                  raise SystemExit(f"assembled M31 payload byte mismatch: {path}")
              if hashlib.sha256(raw).hexdigest() != expected_digest:
                  raise SystemExit(f"assembled M31 payload digest mismatch: {path}")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
          print("Rebased two-part M31 test payload installed: PASS")
          PY

      - name: Validate the complete rebased M31 test payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/m31-test-already-complete ]]; then
            echo "M31 test source is already assembled."
            exit 0
          fi
          python - <<'PY'
          import ast
          import base64
          import binascii
          import bz2
          import hashlib
          import os
          from pathlib import Path

          parts = (
              (
                  Path(os.environ["M31_PART_1_PATH"]),
                  int(os.environ["M31_PART_1_BYTES"]),
                  os.environ["M31_PART_1_SHA256"],
              ),
              (
                  Path(os.environ["M31_PART_2_PATH"]),
                  int(os.environ["M31_PART_2_BYTES"]),
                  os.environ["M31_PART_2_SHA256"],
              ),
          )
          encoded_parts = []
          for path, expected_bytes, expected_digest in parts:
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"required M31 test payload is missing: {path}")
              raw = path.read_bytes()
              if len(raw) != expected_bytes:
                  raise SystemExit(f"M31 test payload byte mismatch: {path}")
              if hashlib.sha256(raw).hexdigest() != expected_digest:
                  raise SystemExit(f"M31 test payload digest mismatch: {path}")
              encoded_parts.append(raw)

          encoded = b"".join(encoded_parts)
          if len(encoded) != int(os.environ["M31_BASE64_BYTES"]):
              raise SystemExit("combined M31 test Base64 byte mismatch")
          if hashlib.sha256(encoded).hexdigest() != os.environ[
              "M31_BASE64_SHA256"
          ]:
              raise SystemExit("combined M31 test Base64 digest mismatch")
          try:
              compressed = base64.b64decode(encoded, validate=True)
          except binascii.Error as exc:
              raise SystemExit("combined M31 test Base64 validation failed") from exc
          if len(compressed) != int(os.environ["M31_COMPRESSED_BYTES"]):
              raise SystemExit("M31 test compressed byte mismatch")
          if hashlib.sha256(compressed).hexdigest() != os.environ[
              "M31_COMPRESSED_SHA256"
          ]:
              raise SystemExit("M31 test compressed digest mismatch")
          try:
              source = bz2.decompress(compressed)
          except OSError as exc:
              raise SystemExit("M31 test bzip2 validation failed") from exc
          if len(source) != int(os.environ["M31_TEST_BYTES"]):
              raise SystemExit("M31 test source byte mismatch")
          if hashlib.sha256(source).hexdigest() != os.environ[
              "M31_TEST_SHA256"
          ]:
              raise SystemExit("M31 test source digest mismatch")
          text = source.decode("utf-8")
          if "-1/0/" + chr(43) + "1" in text:
              raise SystemExit("forbidden ternary notation in M31 tests")
          tree = ast.parse(text, filename=os.environ["M31_TEST_PATH"])
          test_methods = [
              node.name
              for item in tree.body
              if isinstance(item, ast.ClassDef)
              for node in item.body
              if isinstance(node, ast.FunctionDef)
              and node.name.startswith("test_")
          ]
          if len(test_methods) != 60 or len(set(test_methods)) != 60:
              raise SystemExit("M31 qualification test inventory mismatch")
          print("Complete rebased M31 test payload: PASS")
          PY

      - name: Commit and publish only the rebased M31 test payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$M31_PART_1_PATH" "$M31_PART_2_PATH"
          if git diff --cached --quiet; then
            echo "Rebased M31 test payload is already committed."
            exit 0
          fi
          expected="$(printf '%s\n' "$M31_PART_1_PATH" "$M31_PART_2_PATH")"
          test "$(git diff --cached --name-only)" = "$expected"
          git commit \
            -m "Rebase M31 test payload and add part 2" \
            -m "Replace the superseded B1 fragment and publish the complete integrity-bound two-part payload for 60 M31 qualification tests covering phase-organized computation, active neutral state 0, exact -1/0/1 execution evidence, separate thermal contours, and the read-only Observatory boundary."
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish M31B2 summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## FRP M31B2 Test Payload"
            echo
            echo "| Boundary | Qualified value |"
            echo "|---|---|"
            echo "| Producer source | exact 42092-byte M31 producer |"
            echo "| Superseded B1 part | exact 3492-byte historical fragment |"
            echo "| Rebased part 1 | 3320 bytes |"
            echo "| Rebased part 2 | 3324 bytes |"
            echo "| Combined Base64 | 6644 bytes |"
            echo "| Test source | 22370 bytes |"
            echo "| Qualification tests | 60 |"
            echo "| Balanced ternary kernel | -1/0/1 |"
            echo "| Active neutral state | 0 |"
            echo "| Observatory writeback | forbidden |"
            echo
            echo "M31 rebased two-part test payload: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
