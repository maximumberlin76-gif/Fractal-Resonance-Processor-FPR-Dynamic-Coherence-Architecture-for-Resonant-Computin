      M31_MANIFEST_PATH: artifacts/m31/manifests/m31-phase-interference-active-zero-thermal-evidence-manifest.json
      M31_MANIFEST_BYTES: "828"
      M31_MANIFEST_SHA256: 80f0841d0041cd22c2f76175b6139e601aede7b69823356ae1fefbce5f793e7c
      M31_QUALIFICATION_PATH: artifacts/m31/qualification/m31-phase-interference-active-zero-thermal-evidence-qualification.json
      M31_QUALIFICATION_BYTES: "1512"
      M31_QUALIFICATION_SHA256: 4c2446f954e01ec0aa37cc6c0fc70cf4a87ec565c450628e31b0efcac9160224
      M30_ARCHIVE_PATH: artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
      M30_ARCHIVE_BYTES: "10189989"
      M30_ARCHIVE_SHA256: 05ea33f6f3f505d315af930c2d51779f7189905308473f32a57375e477069caa
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ github.ref_name }}" = "main"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          echo "Manual main-branch boundary: PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Snapshot all protected histories
        shell: bash
        run: |
          set -euo pipefail
          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          tree_inventory artifacts > /tmp/m31d4-artifacts.before
          tree_inventory benchmarks > /tmp/m31d4-benchmarks.before
          tree_inventory schemas > /tmp/m31d4-schemas.before
          historical_inventory > /tmp/m31d4-history.before

          test "$(wc -l < /tmp/m31d4-artifacts.before)" -eq "$ARTIFACTS_FILES"
          test "$(sha256sum /tmp/m31d4-artifacts.before | cut -d' ' -f1)" = "$ARTIFACTS_INVENTORY_SHA256"
          test "$(wc -l < /tmp/m31d4-benchmarks.before)" -eq "$BENCHMARKS_FILES"
          test "$(sha256sum /tmp/m31d4-benchmarks.before | cut -d' ' -f1)" = "$BENCHMARKS_INVENTORY_SHA256"
          test "$(wc -l < /tmp/m31d4-schemas.before)" -eq "$SCHEMAS_FILES"
          test "$(sha256sum /tmp/m31d4-schemas.before | cut -d' ' -f1)" = "$SCHEMAS_INVENTORY_SHA256"
          test "$(wc -l < /tmp/m31d4-history.before)" -eq "$HISTORICAL_RECORDS"
          test "$(sha256sum /tmp/m31d4-history.before | cut -d' ' -f1)" = "$HISTORICAL_INVENTORY_SHA256"

          readme_sha="$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)"
          if test "$readme_sha" != "$ORIGINAL_README_SHA256" && test "$readme_sha" != "$TARGET_SHA256"; then
            echo "README boundary mismatch: $readme_sha" >&2
            exit 1
          fi
          echo "Protected histories snapshotted: PASS"

      - name: Verify exact M31 documentation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          exact = (
              (os.environ["REQUIREMENTS_PATH"], int(os.environ["REQUIREMENTS_BYTES"]), os.environ["REQUIREMENTS_SHA256"]),
              (os.environ["D1_INDEX_PATH"], int(os.environ["D1_INDEX_BYTES"]), os.environ["D1_INDEX_SHA256"]),
              (os.environ["D2_NOTES_PATH"], int(os.environ["D2_NOTES_BYTES"]), os.environ["D2_NOTES_SHA256"]),
              (os.environ["D3_REPORT_PATH"], int(os.environ["D3_REPORT_BYTES"]), os.environ["D3_REPORT_SHA256"]),
              (os.environ["M31_SOURCE_PATH"], int(os.environ["M31_SOURCE_BYTES"]), os.environ["M31_SOURCE_SHA256"]),
              (os.environ["M31_TEST_PATH"], int(os.environ["M31_TEST_BYTES"]), os.environ["M31_TEST_SHA256"]),
              (os.environ["M31_SCHEMA_PATH"], int(os.environ["M31_SCHEMA_BYTES"]), os.environ["M31_SCHEMA_SHA256"]),
              (os.environ["M31_EVIDENCE_PATH"], int(os.environ["M31_EVIDENCE_BYTES"]), os.environ["M31_EVIDENCE_SHA256"]),
              (os.environ["M31_MANIFEST_PATH"], int(os.environ["M31_MANIFEST_BYTES"]), os.environ["M31_MANIFEST_SHA256"]),
              (os.environ["M31_QUALIFICATION_PATH"], int(os.environ["M31_QUALIFICATION_BYTES"]), os.environ["M31_QUALIFICATION_SHA256"]),
              (os.environ["M30_ARCHIVE_PATH"], int(os.environ["M30_ARCHIVE_BYTES"]), os.environ["M30_ARCHIVE_SHA256"]),
          )
          for path_text, expected_bytes, expected_sha256 in exact:
              path = Path(path_text)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"required regular file is missing: {path}")
              raw = path.read_bytes()
              if (len(raw), hashlib.sha256(raw).hexdigest()) != (expected_bytes, expected_sha256):
                  raise SystemExit(f"M31 documentation-boundary mismatch: {path}")
          print("Exact M31 documentation boundary: PASS")
          PY

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$REQUIREMENTS_PATH"

      - name: Run all 60 focused M31 qualification tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_frp_m31_phase_interference_thermal_evidence -v 2>&1 | tee /tmp/m31d4-tests.log
          grep -F "Ran 60 tests" /tmp/m31d4-tests.log
          grep -Fx "OK" /tmp/m31d4-tests.log

      - name: Render additive v3.3.0 README record
        shell: bash
        run: |
          set -euo pipefail
          prefix_compact=/tmp/m31d4-readme-prefix.gz.b64
          prefix_gzip=/tmp/m31d4-readme-prefix.gz
          prefix=/tmp/m31d4-readme-prefix.md
          suffix_compact=/tmp/m31d4-readme-suffix.gz.b64
          suffix_gzip=/tmp/m31d4-readme-suffix.gz
          suffix=/tmp/m31d4-readme-suffix.md
          original=/tmp/m31d4-readme-original.md
