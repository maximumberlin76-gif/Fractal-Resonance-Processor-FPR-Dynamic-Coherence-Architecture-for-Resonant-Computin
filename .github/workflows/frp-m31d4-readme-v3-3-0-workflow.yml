name: FRP M31D4 README v3.3.0

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m31d4-readme-v3-3-0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-readme-record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_PATH: README.md
      ORIGINAL_README_BYTES: "118858"
      ORIGINAL_README_LINES: "4832"
      ORIGINAL_README_SHA256: ee2d3e3c4d8cff459ba669307777ac97b86e3843f5c7a3d521ad817a5e7b0d60
      TARGET_BYTES: "124523"
      TARGET_LINES: "4960"
      TARGET_SHA256: 9bdeaa319df33aa59d087919b197063d463a36e71ba58f4b02205640def516d8
      PREFIX_BYTES: "1245"
      PREFIX_LINES: "12"
      PREFIX_SHA256: 37aa77d869b4981d217643891eecac7379003cf0a56e1dd449d0410c66b81b0f
