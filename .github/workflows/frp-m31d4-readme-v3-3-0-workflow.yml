          if test "$current_sha" = "$ORIGINAL_README_SHA256"; then
            cp -- "$TARGET_PATH" "$original"
            test "$(wc -c < "$original")" -eq "$ORIGINAL_README_BYTES"
            test "$(wc -l < "$original")" -eq "$ORIGINAL_README_LINES"
            cat "$prefix" "$original" "$suffix" > "$rendered"
            test "$(wc -c < "$rendered")" -eq "$TARGET_BYTES"
            test "$(wc -l < "$rendered")" -eq "$TARGET_LINES"
            test "$(sha256sum "$rendered" | cut -d' ' -f1)" = "$TARGET_SHA256"
            install -m 0644 "$rendered" "$TARGET_PATH"
