          else
            test "$current_sha" = "$TARGET_SHA256"
            echo "Additive M31 README record already installed."
          fi

      - name: Qualify README and original-byte preservation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          raw = Path(os.environ["TARGET_PATH"]).read_bytes()
          prefix = Path("/tmp/m31d4-readme-prefix.md").read_bytes()
          suffix = Path("/tmp/m31d4-readme-suffix.md").read_bytes()
          if (len(raw), hashlib.sha256(raw).hexdigest()) != (
              int(os.environ["TARGET_BYTES"]), os.environ["TARGET_SHA256"]
          ):
              raise SystemExit("README identity mismatch")
          if raw.count(b"<!-- FRP-V3.3.0-M31-CURRENT-RELEASE:START -->") != 1:
              raise SystemExit("current-release marker count mismatch")
          if raw.count(b"<!-- FRP-V3.3.0-M31-RELEASE-RECORD:START -->") != 1:
              raise SystemExit("release-record marker count mismatch")
          if not raw.startswith(prefix) or not raw.endswith(suffix):
              raise SystemExit("README additive boundary mismatch")

          original = raw[len(prefix):len(raw) - len(suffix)]
          if (len(original), hashlib.sha256(original).hexdigest()) != (
              int(os.environ["ORIGINAL_README_BYTES"]), os.environ["ORIGINAL_README_SHA256"]
          ):
              raise SystemExit("original README bytes changed")

          text = raw.decode("utf-8")
          required = (
              "Current repository release:",
              "FRP v3.3.0 / M31 — PASS",
              "M31 — Phase-Interference, Active-Zero, and Thermal-Evidence Publication",
              "60 / 60 PASS",
              "13 / 13 PASS",
              "4 / 4 exact",
              "-1/0/1",
              "Classical bit addition as primary mechanism",
              "active-zero observations",
              "actual direct events",
              "15.6923076923",
              "93.63%",
              "These values are not physical temperature measurements.",
              "FRP published bytes → FRP-Trace-Observatory",
              "metric normalization, semantic reimplementation, FRP source mutation, and",
              "FRP v3.3.0 / M31 README RECORD — QUALIFIED",
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"README claims missing: {missing}")
          forbidden = "-1/0/" + chr(43) + "1"
          if forbidden in text:
              raise SystemExit("forbidden ternary notation in README")
          print("README M31 content and original-byte preservation: PASS")
          PY

      - name: Prove all protected histories are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          tree_inventory artifacts > /tmp/m31d4-artifacts.after
          tree_inventory benchmarks > /tmp/m31d4-benchmarks.after
          tree_inventory schemas > /tmp/m31d4-schemas.after
          historical_inventory > /tmp/m31d4-history.after
          cmp --silent /tmp/m31d4-artifacts.before /tmp/m31d4-artifacts.after
          cmp --silent /tmp/m31d4-benchmarks.before /tmp/m31d4-benchmarks.after
          cmp --silent /tmp/m31d4-schemas.before /tmp/m31d4-schemas.after
          cmp --silent /tmp/m31d4-history.before /tmp/m31d4-history.after
          echo "All evidence, benchmark, schema, and release histories: BYTE-IDENTICAL"

      - name: Verify only README changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          untracked="$(git ls-files --others --exclude-standard)"
          if test -n "$changed" && test "$changed" != "$TARGET_PATH"; then
            echo "Unexpected changed paths: $changed" >&2
            exit 1
          fi
          test -z "$untracked"
          echo "Single additive README boundary: PASS"

      - name: Commit and publish the README record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          staged="$(git diff --cached --name-only)"
          if test -z "$staged"; then
            test -z "$(git status --porcelain)"
            echo "FRP v3.3.0 M31 README record is already published."
            exit 0
          fi
          test "$staged" = "$TARGET_PATH"
          git commit -m "Add FRP v3.3.0 M31 README record"
          git push origin HEAD:main

      - name: Verify published state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
          test "$(wc -l < "$TARGET_PATH")" -eq "$TARGET_LINES"
          test "$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)" = "$TARGET_SHA256"
          {
            echo "## FRP M31D4 README v3.3.0"
            echo
            echo "- Updated file: README.md"
            echo "- Operation: additive header and release record"
            echo "- Original README bytes: preserved exactly"
            echo "- M31 focused tests: 60 / 60 PASS"
            echo "- Evidence and benchmark histories: byte-identical"
            echo "- Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
