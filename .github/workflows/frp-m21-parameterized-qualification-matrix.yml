name: FRP M21 Parameterized Qualification Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frp-m21-parameterized-qualification-matrix.yml"
      - "frp_m21_parameterized_qualification_matrix.py"
      - "schemas/m21/**"
      - "artifacts/m21/**"
      - "tests/test_frp_m21_parameterized_qualification_matrix.py"
      - "artifacts/m20/**"
      - "artifacts/m18/structured_output/**"
      - "artifacts/m18/m15_exports/qualification-closure-manifest.json"
      - "rtl/m16/frp_m16_pkg.sv"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/frp-m21-parameterized-qualification-matrix.yml"
      - "frp_m21_parameterized_qualification_matrix.py"
      - "schemas/m21/**"
      - "artifacts/m21/**"
      - "tests/test_frp_m21_parameterized_qualification_matrix.py"
      - "artifacts/m20/**"
      - "artifacts/m18/structured_output/**"
      - "artifacts/m18/m15_exports/qualification-closure-manifest.json"
      - "rtl/m16/frp_m16_pkg.sv"

permissions:
  contents: write

concurrency:
  group: frp-m21-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-m21:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      M21_ROOT: /tmp/frp_m21_creation
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

