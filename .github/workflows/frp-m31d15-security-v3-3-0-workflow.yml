name: FRP M31D15 Security v3.3.0

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m31d15-security-v3-3-0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_PATH: SECURITY.md
      SOURCE_BYTES: "6549"
      SOURCE_LINES: "203"
      SOURCE_SHA256: d6fed8be4b2af376a6eb8625f0eb7bd8f01ae19caf067693514ef5dcb34bbd15
      TARGET_BYTES: "11961"
      TARGET_LINES: "327"
      TARGET_SHA256: 65bd8aaf9da131cf79ecb617727bce16f7c5241a949491a0851b83a6fccd235b
      BLOCK_BYTES: "5412"
      BLOCK_SHA256: d9e4c8bd3b48ab7c20d18d5436b78b9cb81c25a2f62f5eda407eae6196f19d96
      INSTALL_BYTES: "51529"
      INSTALL_SHA256: df1dcd53d5f195cbc02bb3abbed61c08450ff9673816afcaec785a3f58642e96
      PROJECT_STRUCTURE_BYTES: "75854"
      PROJECT_STRUCTURE_SHA256: 17adf275c6af9996e7af9e2e36982893b9d0d60c297d6458d90854b01424c02d
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ github.ref_name }}" = "main"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          echo "Manual main-branch boundary: PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify source boundary and capture protected histories
        shell: bash
        run: |
          set -euo pipefail
          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }

          tree_inventory artifacts > /tmp/m31d15-artifacts.before
          tree_inventory benchmarks > /tmp/m31d15-benchmarks.before
          tree_inventory schemas > /tmp/m31d15-schemas.before
          historical_inventory > /tmp/m31d15-history.before

          while IFS= read -r path
          do
            test -f "$path"
            test ! -L "$path"
          done <<'REQUIRED_FILES'
          LICENSE
          README.md
          INSTALL.md
          USAGE.md
          REPRODUCIBILITY.md
          ROADMAP.md
          PROJECT_STRUCTURE.md
          MILESTONES.md
          NOTICE.md
          CHANGELOG.md
          CI.md
          CONTRIBUTING.md
          CODE_OF_CONDUCT.md
          FRP_VALIDATION_INDEX_v3_3_0.md
          RELEASE_NOTES_v3_3_0.md
          TEST_REPORT_v3_3_0.md
          requirements.txt
          frp_m31_phase_interference_thermal_evidence.py
          tests/test_frp_m31_phase_interference_thermal_evidence.py
          schemas/m31/frp.m31.phase_interference_active_zero_thermal_evidence.v1.schema.json
          artifacts/m31/evidence/m31-phase-interference-active-zero-thermal-evidence.json
          artifacts/m31/manifests/m31-phase-interference-active-zero-thermal-evidence-manifest.json
          artifacts/m31/qualification/m31-phase-interference-active-zero-thermal-evidence-qualification.json
          REQUIRED_FILES

          test "$(wc -c < INSTALL.md)" -eq "$INSTALL_BYTES"
          test "$(sha256sum INSTALL.md | cut -d' ' -f1)" = "$INSTALL_SHA256"
          test "$(wc -c < PROJECT_STRUCTURE.md)" -eq "$PROJECT_STRUCTURE_BYTES"
          test "$(sha256sum PROJECT_STRUCTURE.md | cut -d' ' -f1)" = "$PROJECT_STRUCTURE_SHA256"

          test -f "$TARGET_PATH"
          test ! -L "$TARGET_PATH"
          current_sha="$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)"
          if test "$current_sha" = "$SOURCE_SHA256"; then
            test "$(wc -c < "$TARGET_PATH")" -eq "$SOURCE_BYTES"
            test "$(wc -l < "$TARGET_PATH")" -eq "$SOURCE_LINES"
          elif test "$current_sha" = "$TARGET_SHA256"; then
            test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
            test "$(wc -l < "$TARGET_PATH")" -eq "$TARGET_LINES"
          else
            echo "SECURITY.md boundary mismatch: $current_sha" >&2
            exit 1
          fi
          echo "Source boundary and protected histories: PASS"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run all 60 focused M31 qualification tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_frp_m31_phase_interference_thermal_evidence -v 2>&1 | tee /tmp/m31d15-tests.log
          grep -F "Ran 60 tests" /tmp/m31d15-tests.log
          grep -Fx "OK" /tmp/m31d15-tests.log

      - name: Install complete SECURITY.md
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)"
          if test "$current_sha" = "$TARGET_SHA256"; then
            echo "Complete M31 SECURITY.md is already installed."
            exit 0
          fi
          test "$current_sha" = "$SOURCE_SHA256"

          block_base64() {
            cat <<'BLOCK_PAYLOAD'
          H4sIAAAAAAACA7VY3XLaSBa+5ym6KjebKgRxqMrFzBXBJMOUbVjA2d2ZmiKN1ECPJbWmu4XN
          Vi72IfYJ90n2O/0jCZvdmkllLmyE+vyf7/w0r16xSa21KC1bibTW0p7Ye1WXGdcn9p9//Zt9
