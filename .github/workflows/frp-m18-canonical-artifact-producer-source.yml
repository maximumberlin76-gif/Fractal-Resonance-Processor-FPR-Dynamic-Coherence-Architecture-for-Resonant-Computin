name: FRP M18 Canonical Artifact Producer Source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m18-canonical-artifact-producer-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-and-qualify-producer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET: frp_m18_canonical_artifacts.py
      WORKFLOW: .github/workflows/frp-m18-canonical-artifact-producer-source.yml
      TRANSPORT_COMMIT: c43e949d0217b13285ca63c00da010a00184faa6
      TRANSPORT_WORKFLOW_SHA256: 25c4a6a649bedabbe7a0ec06feb031a5a4aa0248e092d65b43977cecff2864b4
      TRANSPORT_WORKFLOW_BYTES: "33777"
      BUNDLE_SHA256: 8813dd002c73c3cecf295e03e1c698a822ad0be413d48d655ea3bdac37ddf51c
      BUNDLE_BYTES: "20000"
      ORIGINAL_RUNNER_SHA256: 2a3d0d60eed2583fc5c90733795e3fa293450b54c5fcfe6bba7c932a568fc60c
      QUALIFIED_RUNNER_SHA256: a6b26664e3b1bfb94196751e928863768d78e224281b0d954b59071e89080d87
      SOURCE_SHA256: 4562e0d6b5a0611ce7623d66b563aea7e90afb98e9f534a581a64d59e47c11b1
      SOURCE_BYTES: "89905"
      REGISTRY_SHA256: 6d2d0077b00c9f3da04429a8a690256fe7b4de585c7257804471a3d3d4992c0c
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/frp_m18_python_cache
      PYTHONUTF8: "1"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover, qualify, and commit producer
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REF}" = "refs/heads/main"
          test -f "${WORKFLOW}"
          test ! -e "${TARGET}"
          test "$(git rev-parse HEAD^)" = "${TRANSPORT_COMMIT}"
          git merge-base --is-ancestor "${TRANSPORT_COMMIT}" HEAD
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

          transport="$(mktemp /tmp/frp_m18_transport.XXXXXX.yml)"
          bundle="$(mktemp /tmp/frp_m18_bundle.XXXXXX.tar.xz)"
          stage="$(mktemp -d /tmp/frp_m18_stage.XXXXXX)"
          runner="${stage}/frp_m18_workflow_runner.sh"
          staged_source="${stage}/${TARGET}"
          trap 'rm -f -- "${transport}" "${bundle}" "${runner}" "${staged_source}"; rmdir -- "${stage}" 2>/dev/null || true' EXIT

          git show "${TRANSPORT_COMMIT}:${WORKFLOW}" > "${transport}"
          test "$(sha256sum "${transport}" | awk '{print $1}')" = "${TRANSPORT_WORKFLOW_SHA256}"
          test "$(wc -c < "${transport}")" -eq "${TRANSPORT_WORKFLOW_BYTES}"

          python - "${transport}" "${bundle}" <<'PY'
          import base64
          import sys
          from pathlib import Path

          source_path, bundle_path = map(Path, sys.argv[1:])
          text = source_path.read_text(encoding="utf-8")
          opening = "          base64 --decode > \"${bundle}\" <<'FRP_M18_BUNDLE'\n"
          closing = "          FRP_M18_BUNDLE\n"
          if text.count(opening) != 1 or text.count(closing) != 1:
              raise SystemExit("transport payload boundary mismatch")
          payload = text.split(opening, 1)[1].split(closing, 1)[0]
          encoded = "".join(line.strip() for line in payload.splitlines())
          bundle_path.write_bytes(base64.b64decode(encoded, validate=True))
          PY

          test "$(sha256sum "${bundle}" | awk '{print $1}')" = "${BUNDLE_SHA256}"
          test "$(wc -c < "${bundle}")" -eq "${BUNDLE_BYTES}"

          python - "${bundle}" "${stage}" <<'PY'
          import sys
          import tarfile
          from pathlib import Path

          bundle_path, stage = map(Path, sys.argv[1:])
          expected = {
              "frp_m18_canonical_artifacts.py": 0o644,
              "frp_m18_workflow_runner.sh": 0o700,
          }
          with tarfile.open(bundle_path, "r:xz") as archive:
              members = archive.getmembers()
              if [member.name for member in members] != list(expected):
                  raise SystemExit("bundle member set or order mismatch")
              for member in members:
                  if not member.isfile() or member.mode != expected[member.name]:
                      raise SystemExit("invalid bundle member")
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit("unreadable bundle member")
                  target = stage / member.name
                  target.write_bytes(source.read())
                  target.chmod(member.mode)
          PY

          test "$(sha256sum "${staged_source}" | awk '{print $1}')" = "${SOURCE_SHA256}"
          test "$(wc -c < "${staged_source}")" -eq "${SOURCE_BYTES}"
          test "$(sha256sum "${runner}" | awk '{print $1}')" = "${ORIGINAL_RUNNER_SHA256}"

          python - "${runner}" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          raw = path.read_bytes()
          original = (
              b'test ! -e "${TARGET}"\n'
              b'git diff --exit-code\n'
              b'test -z "$(git status --porcelain --untracked-files=all)"\n'
          )
          qualified = (
              b'test -f "${TARGET}"\n'
              b'git diff --exit-code\n'
              b'test "$(git status --porcelain --untracked-files=all)" = "?? ${TARGET}"\n'
          )
          if raw.count(original) != 1:
              raise SystemExit("runner qualification boundary mismatch")
          path.write_bytes(raw.replace(original, qualified, 1))
          PY

          test "$(sha256sum "${runner}" | awk '{print $1}')" = "${QUALIFIED_RUNNER_SHA256}"
          mv -- "${staged_source}" "${TARGET}"
          bash "${runner}"
