name: FRP M28 Hierarchical Scaling and Hotspot-Containment Closure

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m28-hierarchy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-m28-hierarchy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M28_PAYLOAD_ROOT: /tmp/frp_m28_hierarchy_creation
      M28_SOURCE_COMMIT: 23e464206f85cd9473101d9221027ee33d9dd094
      M28_OBSERVATORY_COMMIT: 566a4ff88baa57f844691b46937552253e095434
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python --version
          python -m pip show jsonschema

      - name: Validate the immutable M27 and preserved Observatory boundaries
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${M28_SOURCE_COMMIT}^{commit}"
          git cat-file -e "${M28_OBSERVATORY_COMMIT}^{commit}"
          git merge-base --is-ancestor "$M28_SOURCE_COMMIT" "$M28_OBSERVATORY_COMMIT"
          git merge-base --is-ancestor "$M28_OBSERVATORY_COMMIT" HEAD
          test "$(git rev-parse "$M28_SOURCE_COMMIT")" = "$M28_SOURCE_COMMIT"
          test "$(git rev-parse "$M28_OBSERVATORY_COMMIT")" = "$M28_OBSERVATORY_COMMIT"
          test "$(git show -s --format=%s "$M28_SOURCE_COMMIT")" = "Add M27 long-run stability and telemetry qualification"
          test "$(git show -s --format=%s "$M28_OBSERVATORY_COMMIT")" = "Add M28 Trace Observatory upstream interchange"

          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/frp-m28-hierarchical-scaling-hotspot-containment-closure-workflow.yml|\
              frp_m28_hierarchical_scaling_hotspot_containment.py|\
              schemas/m28/frp_m28_hierarchical_scaling_contract.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hierarchy_topology_manifest.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hierarchical_scaling_matrix.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hotspot_containment_evidence.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hierarchy_qualification.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hierarchy_schema_registry.json|\
              artifacts/m28/hierarchy/*|\
              tests/test_frp_m28_hierarchical_scaling_hotspot_containment.py)
                ;;
              *)
                echo "Unexpected change after the preserved M28 Observatory boundary: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$M28_OBSERVATORY_COMMIT"..HEAD)

          test -f .github/workflows/frp-m28-hierarchical-scaling-hotspot-containment-closure-workflow.yml
          test -f frp_m28_trace_observatory_upstream_interchange.py
          test -f artifacts/m28/contracts/m28-trace-observatory-upstream-contract.json
          test -f artifacts/m28/exports/m28-observatory-canonical-trace-bundle.json
          test -f artifacts/m28/manifests/m28-trace-observatory-interchange-qualification.json

