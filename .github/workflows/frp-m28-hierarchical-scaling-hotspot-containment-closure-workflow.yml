          0169 12 40310399f51a1b5ff13e9d4756e0c0bf157f075625d1bfc0cb3aa792cf449ce1 ChISV8FQQA==
          """
          expected_archive_sha256 = "df708d45ef34caa6e1c384e299d6c599dd2627b58aeec5afcb5f304ef3d8491d"
          expected_files = json.loads('{"frp_m28_hierarchical_scaling_hotspot_containment.py":{"bytes":51133,"raw_sha256":"beea882d99290b08a618c354201c8b65a578e1c6cbe53842c428c0bc02615da7"},"tests/test_frp_m28_hierarchical_scaling_hotspot_containment.py":{"bytes":14293,"raw_sha256":"6850ab7003ee55253708159d0c9cf12bbc313cc86b8d8eac215936a09bff77be"}}')
          payload_root = Path(os.environ["M28_PAYLOAD_ROOT"])
          staging = payload_root / "staging"
          base64_alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"

          def row_digest(value):
              return hashlib.sha256(value.encode("ascii")).hexdigest()

          def repair_row(value, expected_length, expected_digest, row_index):
              if len(value) == expected_length and row_digest(value) == expected_digest:
                  return value, False
              candidates = set()
              if len(value) == expected_length - 1:
                  for position in range(expected_length):
                      for character in base64_alphabet:
                          candidate = value[:position] + character + value[position:]
                          if row_digest(candidate) == expected_digest:
                              candidates.add(candidate)
              elif len(value) == expected_length + 1:
                  for position in range(len(value)):
                      candidate = value[:position] + value[position + 1:]
                      if row_digest(candidate) == expected_digest:
                          candidates.add(candidate)
              elif len(value) == expected_length:
                  for position, original in enumerate(value):
                      for character in base64_alphabet:
                          if character == original:
                              continue
                          candidate = value[:position] + character + value[position + 1:]
                          if row_digest(candidate) == expected_digest:
                              candidates.add(candidate)
              if len(candidates) != 1:
                  raise SystemExit(
                      "M28 hierarchy payload row cannot be repaired uniquely: "
                      f"row={row_index}, length={len(value)}, expected={expected_length}, "
                      f"candidates={len(candidates)}"
                  )
              return next(iter(candidates)), True

          parsed_rows = []
          repaired_rows = []
          for raw_line in payload_rows.splitlines():
              line = raw_line.strip()
              if not line:
                  continue
              parts = line.split(" ", 3)
              if len(parts) != 4:
                  raise SystemExit("M28 hierarchy payload row format mismatch")
              index_text, length_text, digest, encoded = parts
              index = int(index_text)
              expected_length = int(length_text)
              if index != len(parsed_rows):
                  raise SystemExit("M28 hierarchy payload row ordering mismatch")
              if len(digest) != 64 or any(character not in "0123456789abcdef" for character in digest):
                  raise SystemExit(f"M28 hierarchy payload row digest format mismatch: {index}")
              encoded, repaired = repair_row(encoded, expected_length, digest, index)
              parsed_rows.append(encoded)
              if repaired:
                  repaired_rows.append(index)

          compact = "".join(parsed_rows)
          try:
              compressed = base64.b64decode(compact, validate=True)
          except binascii.Error as exc:
              raise SystemExit(f"M28 hierarchy payload Base64 validation failed: {exc}") from exc
          observed_archive_sha256 = hashlib.sha256(compressed).hexdigest()
          if observed_archive_sha256 != expected_archive_sha256:
              raise SystemExit(
                  "M28 hierarchy payload digest mismatch: "
                  f"{observed_archive_sha256} != {expected_archive_sha256}"
              )
          try:
              archive_bytes = bz2.decompress(compressed)
          except OSError as exc:
              raise SystemExit(f"M28 hierarchy payload decompression failed: {exc}") from exc

          if payload_root.exists():
              shutil.rmtree(payload_root)
          staging.mkdir(parents=True)

          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:") as archive:
              members = archive.getmembers()
              observed_names = [member.name for member in members]
              if observed_names != list(expected_files):
                  raise SystemExit("M28 hierarchy payload member inventory mismatch")
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or any(part in ("", ".", "..") for part in member.name.split("/"))
                      or not member.isfile()
                      or member.issym()
                      or member.islnk()
                  ):
                      raise SystemExit(f"unsafe M28 hierarchy payload member: {member.name}")
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"missing M28 hierarchy payload member data: {member.name}")
                  raw = source.read()
                  record = expected_files[member.name]
                  if len(raw) != record["bytes"]:
                      raise SystemExit(f"M28 hierarchy payload byte count mismatch: {member.name}")
                  if hashlib.sha256(raw).hexdigest() != record["raw_sha256"]:
                      raise SystemExit(f"M28 hierarchy payload file digest mismatch: {member.name}")
                  destination = staging.joinpath(*path.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(raw)

          for relative, record in expected_files.items():
              source = staging.joinpath(*PurePosixPath(relative).parts)
              destination = Path(relative)
              if destination.exists() and destination.is_symlink():
                  raise SystemExit(f"refusing M28 hierarchy symlink destination: {relative}")
              destination.parent.mkdir(parents=True, exist_ok=True)
              os.replace(source, destination)
              raw = destination.read_bytes()
              if len(raw) != record["bytes"] or hashlib.sha256(raw).hexdigest() != record["raw_sha256"]:
                  raise SystemExit(f"installed M28 hierarchy source mismatch: {relative}")

          print(f"M28 hierarchy payload archive sha256: {observed_archive_sha256}")
          print(f"M28 hierarchy source files installed: {len(expected_files)}")
          print(f"M28 hierarchy payload rows repaired: {repaired_rows}")
          PY

      - name: Validate the extracted M28 hierarchy source and immutable vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            frp_m28_hierarchical_scaling_hotspot_containment.py \
            tests/test_frp_m28_hierarchical_scaling_hotspot_containment.py
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("frp_m28_hierarchical_scaling_hotspot_containment.py"),
              Path("tests/test_frp_m28_hierarchical_scaling_hotspot_containment.py"),
          ]
          forbidden = "-1/0/" + "+1"
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if forbidden in text:
                  raise SystemExit(f"forbidden ternary notation in {path}")
          print("M28 hierarchy extracted source and immutable vocabulary: PASS")
          PY

      - name: Generate two byte-identical complete M28 hierarchy sets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/m28_hierarchy_generation_a /tmp/m28_hierarchy_generation_b
          mkdir -p /tmp/m28_hierarchy_generation_a /tmp/m28_hierarchy_generation_b
          python frp_m28_hierarchical_scaling_hotspot_containment.py \
            --generate \
            --repository-root . \
            --output-root /tmp/m28_hierarchy_generation_a \
            --source-commit "$M28_SOURCE_COMMIT" \
            --output /tmp/m28_hierarchy_generation_a.json \
            2>&1 | tee /tmp/m28_hierarchy_generation_a.log
          python frp_m28_hierarchical_scaling_hotspot_containment.py \
            --generate \
            --repository-root . \
            --output-root /tmp/m28_hierarchy_generation_b \
            --source-commit "$M28_SOURCE_COMMIT" \
            --output /tmp/m28_hierarchy_generation_b.json \
            2>&1 | tee /tmp/m28_hierarchy_generation_b.log
          diff --recursive --brief /tmp/m28_hierarchy_generation_a /tmp/m28_hierarchy_generation_b
          cmp --silent /tmp/m28_hierarchy_generation_a.json /tmp/m28_hierarchy_generation_b.json
          test "$(find /tmp/m28_hierarchy_generation_a -type f | wc -l)" -eq 11
          find /tmp/m28_hierarchy_generation_a -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee /tmp/m28_hierarchy_deterministic_sha256.txt

      - name: Generate the complete canonical M28 hierarchy repository set
        shell: bash
        run: |
          set -euo pipefail
          python frp_m28_hierarchical_scaling_hotspot_containment.py \
            --generate \
            --repository-root . \
            --output-root . \
            --source-commit "$M28_SOURCE_COMMIT" \
            --output /tmp/m28_hierarchy_generation.json \
            2>&1 | tee /tmp/m28_hierarchy_generation.log

      - name: Run focused M28 hierarchy qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_frp_m28_hierarchical_scaling_hotspot_containment \
            2>&1 | tee /tmp/m28_hierarchy_focused_tests.log
          grep -F "Ran 38 tests" /tmp/m28_hierarchy_focused_tests.log
          python frp_m28_hierarchical_scaling_hotspot_containment.py \
            --verify \
            --repository-root . \
            --source-commit "$M28_SOURCE_COMMIT" \
            --output /tmp/m28_hierarchy_verification.json \
            2>&1 | tee /tmp/m28_hierarchy_verification.log
          python frp_m28_hierarchical_scaling_hotspot_containment.py \
            --self-test \
            --repository-root . \
            --source-commit "$M28_SOURCE_COMMIT" \
            --output /tmp/m28_hierarchy_self_test.json \
            2>&1 | tee /tmp/m28_hierarchy_self_test.log
          python - <<'PY'
          import json
          from pathlib import Path

          generation = json.loads(Path("/tmp/m28_hierarchy_generation.json").read_text())
          verification = json.loads(Path("/tmp/m28_hierarchy_verification.json").read_text())
          self_test = json.loads(Path("/tmp/m28_hierarchy_self_test.json").read_text())
          for name, result in (
              ("generation", generation),
              ("verification", verification),
              ("self-test", self_test),
          ):
              if result["status"] != "PASS":
                  raise SystemExit(f"M28 hierarchy {name} failed")
          expected = {
              "schema_count": 5,
              "artifact_count": 5,
              "generated_path_count": 11,
              "qualification_check_count": 29,
              "scaling_profile_count": 6,
              "hotspot_profile_count": 3,
          }
          for key, value in expected.items():
              if generation[key] != value or verification[key] != value:
                  raise SystemExit(f"M28 hierarchy result boundary mismatch: {key}")
          if self_test["check_count"] != 7:
              raise SystemExit("M28 hierarchy self-test count mismatch")
          print("M28 hierarchy focused qualification: PASS")
          PY

      - name: Run the complete repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee /tmp/m28_hierarchy_full_regression.log
          grep -F "Ran 404 tests" /tmp/m28_hierarchy_full_regression.log

      - name: Validate the closed M28 hierarchy repository boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path("frp_m28_hierarchical_scaling_hotspot_containment.py"),
              Path("tests/test_frp_m28_hierarchical_scaling_hotspot_containment.py"),
              Path("schemas/m28/frp_m28_hierarchical_scaling_contract.v3.0.0.schema.json"),
              Path("schemas/m28/frp_m28_hierarchy_topology_manifest.v3.0.0.schema.json"),
              Path("schemas/m28/frp_m28_hierarchical_scaling_matrix.v3.0.0.schema.json"),
              Path("schemas/m28/frp_m28_hotspot_containment_evidence.v3.0.0.schema.json"),
              Path("schemas/m28/frp_m28_hierarchy_qualification.v3.0.0.schema.json"),
              Path("schemas/m28/frp_m28_hierarchy_schema_registry.json"),
              Path("artifacts/m28/hierarchy/contracts/m28-hierarchical-scaling-contract.json"),
              Path("artifacts/m28/hierarchy/topology/m28-hierarchy-topology-manifest.json"),
              Path("artifacts/m28/hierarchy/scaling/m28-hierarchical-scaling-matrix.json"),
              Path("artifacts/m28/hierarchy/containment/m28-hotspot-containment-evidence.json"),
              Path("artifacts/m28/hierarchy/manifests/m28-hierarchy-qualification.json"),
          ]
          missing = [str(path) for path in required if not path.is_file() or path.is_symlink()]
          if missing:
              raise SystemExit(f"M28 hierarchy required file boundary failed: {missing}")

          contract = json.loads(required[8].read_text(encoding="utf-8"))
          topology = json.loads(required[9].read_text(encoding="utf-8"))
          scaling = json.loads(required[10].read_text(encoding="utf-8"))
          hotspot = json.loads(required[11].read_text(encoding="utf-8"))
          qualification = json.loads(required[12].read_text(encoding="utf-8"))
          registry = json.loads(required[7].read_text(encoding="utf-8"))

          core = contract["immutable_core"]
          if core["balanced_ternary_notation"] != "-1/0/1":
              raise SystemExit("M28 hierarchy immutable ternary notation mismatch")
          if core["semantic_values"] != [-1, 0, 1] or core["active_neutral_state"] != 0:
              raise SystemExit("M28 hierarchy immutable state boundary mismatch")
          if core["temporal_scheduler_modes"] != ["1/7", "7/1"]:
              raise SystemExit("M28 hierarchy temporal scheduler boundary mismatch")
          if core["service_scheduler_mode"] != "free":
              raise SystemExit("M28 hierarchy service scheduler boundary mismatch")
          provenance = contract["provenance_boundary"]
          if provenance["hierarchy_role"] != "primary_M28_realization":
              raise SystemExit("M28 primary hierarchy role mismatch")
          if provenance["observatory_interchange_role"] != "additional_publication_layer":
              raise SystemExit("M28 Observatory preservation role mismatch")
          if provenance["observatory_interchange_commit"] != "566a4ff88baa57f844691b46937552253e095434":
              raise SystemExit("M28 Observatory preservation commit mismatch")

          if [item["cells"] for item in topology["profiles"]] != [8, 16, 32]:
              raise SystemExit("M28 hierarchy topology profile boundary mismatch")
          observed_scaling = [
              [item["cells"], item["scheduler"]]
              for item in scaling["cell_profiles"]
          ]
          expected_scaling = [
              [8, "1/7"], [8, "7/1"],
              [16, "1/7"], [16, "7/1"],
              [32, "1/7"], [32, "7/1"],
          ]
          if observed_scaling != expected_scaling or scaling["profile_count"] != 6:
              raise SystemExit("M28 hierarchy scaling matrix boundary mismatch")
          if [item["scheduler"] for item in hotspot["profiles"]] != ["free", "1/7", "7/1"]:
              raise SystemExit("M28 hotspot scheduler boundary mismatch")
          if hotspot["profile_count"] != 3:
              raise SystemExit("M28 hotspot profile count mismatch")
          if qualification["check_count"] != 29 or qualification["failed_count"] != 0:
              raise SystemExit("M28 hierarchy qualification boundary mismatch")
          if registry["record_count"] != 5:
              raise SystemExit("M28 hierarchy schema registry boundary mismatch")
          if any(path.stat().st_size > 400000 for path in required[2:]):
              raise SystemExit("M28 hierarchy generated file exceeds the bounded file size")

          forbidden = "-1/0/" + "+1"
          for path in required:
              if forbidden in path.read_text(encoding="utf-8"):
                  raise SystemExit(f"forbidden ternary notation in {path}")
          print("M28 closed hierarchy repository boundary: PASS")
          PY

          while IFS= read -r status_path; do
            changed_path="${status_path:3}"
            case "$changed_path" in
              frp_m28_hierarchical_scaling_hotspot_containment.py|\
              schemas/m28/frp_m28_hierarchical_scaling_contract.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hierarchy_topology_manifest.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hierarchical_scaling_matrix.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hotspot_containment_evidence.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hierarchy_qualification.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hierarchy_schema_registry.json|\
              artifacts/m28/hierarchy/*|\
              tests/test_frp_m28_hierarchical_scaling_hotspot_containment.py)
                ;;
              *)
                echo "Unexpected working-tree change during M28 hierarchy closure: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git status --porcelain=v1)

      - name: Create the complete M28 hierarchy qualification commit and publish main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            frp_m28_hierarchical_scaling_hotspot_containment.py \
            tests/test_frp_m28_hierarchical_scaling_hotspot_containment.py \
            schemas/m28/frp_m28_hierarchical_scaling_contract.v3.0.0.schema.json \
            schemas/m28/frp_m28_hierarchy_topology_manifest.v3.0.0.schema.json \
            schemas/m28/frp_m28_hierarchical_scaling_matrix.v3.0.0.schema.json \
            schemas/m28/frp_m28_hotspot_containment_evidence.v3.0.0.schema.json \
            schemas/m28/frp_m28_hierarchy_qualification.v3.0.0.schema.json \
            schemas/m28/frp_m28_hierarchy_schema_registry.json \
            artifacts/m28/hierarchy/contracts/m28-hierarchical-scaling-contract.json \
            artifacts/m28/hierarchy/topology/m28-hierarchy-topology-manifest.json \
            artifacts/m28/hierarchy/scaling/m28-hierarchical-scaling-matrix.json \
            artifacts/m28/hierarchy/containment/m28-hotspot-containment-evidence.json \
            artifacts/m28/hierarchy/manifests/m28-hierarchy-qualification.json

          if git diff --cached --quiet; then
            echo "M28 hierarchy qualification is already committed; no commit is required."
            exit 0
          fi

          test "$(git diff --cached --name-only | wc -l)" -eq 13
          while IFS= read -r staged_path; do
            case "$staged_path" in
              frp_m28_hierarchical_scaling_hotspot_containment.py|\
              schemas/m28/frp_m28_hierarchical_scaling_contract.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hierarchy_topology_manifest.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hierarchical_scaling_matrix.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hotspot_containment_evidence.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hierarchy_qualification.v3.0.0.schema.json|\
              schemas/m28/frp_m28_hierarchy_schema_registry.json|\
              artifacts/m28/hierarchy/contracts/m28-hierarchical-scaling-contract.json|\
              artifacts/m28/hierarchy/topology/m28-hierarchy-topology-manifest.json|\
              artifacts/m28/hierarchy/scaling/m28-hierarchical-scaling-matrix.json|\
              artifacts/m28/hierarchy/containment/m28-hotspot-containment-evidence.json|\
              artifacts/m28/hierarchy/manifests/m28-hierarchy-qualification.json|\
              tests/test_frp_m28_hierarchical_scaling_hotspot_containment.py)
                ;;
              *)
                echo "Unexpected staged M28 hierarchy path: $staged_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          git commit \
            -m "Add M28 hierarchical scaling and hotspot-containment realization" \
            -m "Close the canonical M28 hierarchy boundary with deterministic dyadic topology, cluster-local scheduler and transition-capacity observations, scaling profiles for 8, 16, and 32 cells, and hotspot-containment evidence. Preserve the existing Trace Observatory interchange as an additional publication layer, the immutable -1/0/1 core, active neutral state 0, temporal scheduler modes 1/7 and 7/1, and the separate free service mode."
          git push origin HEAD:main

