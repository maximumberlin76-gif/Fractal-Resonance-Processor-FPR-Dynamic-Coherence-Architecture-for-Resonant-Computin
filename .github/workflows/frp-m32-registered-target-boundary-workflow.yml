name: FRP M32 Registered Target Core

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-m32-registered-target-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-registered-target-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BOUNDARY_MODULE_PATH: rtl/m32/frp_m32_registered_target_boundary.sv
      BOUNDARY_TESTBENCH_PATH: rtl/m32/frp_m32_registered_target_boundary_tb.sv
      REQUEST_PATH_MODULE_PATH: rtl/m32/frp_m32_registered_target_request_path.sv
      REQUEST_PATH_TESTBENCH_PATH: rtl/m32/frp_m32_registered_target_request_path_tb.sv
      CORE_MODULE_PATH: rtl/m32/frp_m32_core.sv
      CORE_TESTBENCH_PATH: rtl/m32/frp_m32_core_tb.sv
      MODE_7_1_TESTBENCH_PATH: rtl/m32/frp_m32_mode_7_1_tb.sv
      MODE_1_7_TESTBENCH_PATH: rtl/m32/frp_m32_mode_1_7_tb.sv
      TRACE_MONITOR_PATH: rtl/m32/frp_m32_trace_monitor.sv
      MODE_7_1_TRACE_TESTBENCH_PATH: rtl/m32/frp_m32_mode_7_1_trace_tb.sv
      MODE_1_7_TRACE_TESTBENCH_PATH: rtl/m32/frp_m32_mode_1_7_trace_tb.sv
      FORMAL_HARNESS_PATH: formal/m32/frp_m32_registered_target_boundary_formal.sv
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python for the formal toolchain
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ github.ref_name }}" = "main"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
          printf '%s\n' "Manual main-branch boundary: PASS"

      - name: Verify exact source identities
        shell: bash
        run: |
          set -euo pipefail

          identity_record="${RUNNER_TEMP}/m32-source-identities.sha256"
          : > "$identity_record"

          check_identity() {
            local path="$1"
            local expected_bytes="$2"
            local expected_digest="$3"
            local actual_bytes
            local actual_digest

            test -f "$path"
            test ! -L "$path"
            git ls-files --error-unmatch "$path" >/dev/null

            actual_bytes="$(wc -c < "$path")"
            actual_digest="$(sha256sum "$path" | cut -d' ' -f1)"

            test "$actual_bytes" -eq "$expected_bytes"
            test "$actual_digest" = "$expected_digest"
            printf '%s  %s\n' "$actual_digest" "$path" \
              >> "$identity_record"
          }

          while IFS='|' read -r path expected_bytes expected_digest; do
            check_identity "$path" "$expected_bytes" "$expected_digest"
          done <<'IDENTITIES'
          rtl/m31/frp_m31_pkg.sv|18531|762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94
          rtl/m31/frp_m31_fixed_point_pkg.sv|7278|6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24
          rtl/m31/frp_m31_scheduler.sv|10560|fc9de24b41736e5c5a9f9e464318c80adbfda9dc8cc4362c0c55bfed403bf97f
          rtl/m31/frp_m31_request_lanes.sv|18290|32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109
          rtl/m31/frp_m31_pending_routes.sv|17005|18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411
          rtl/m31/frp_m31_active_neutral.sv|25909|765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0
          rtl/m31/frp_m31_capacity_guard.sv|20787|d0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123
          rtl/m31/frp_m31_state_update.sv|18147|ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90
          rtl/m31/frp_m31_execution_core.sv|33724|e516a5cd378bd2ddecdadc5abb13ddef26c63fafe5bda65b47a6bd859ca66f92
          rtl/m31/frp_m31_phase_interference.sv|11245|e8ceb80feb0b30db5e28d70bc4d68d51506da4d596b46a73c0137465d1455fe0
          rtl/m31/frp_m31_phase_request_adapter.sv|2251|fa78bcfe965270cc74855908aa392989d857575a2097a126539aabb1aab8990d
          rtl/m31/frp_m31_thermal_proxy.sv|1883|34df4ebfc5dfad8e3e5e454e560404585de5c881e6f75abaae367d3bd9fb11bd
          rtl/m31/frp_m31_stability.sv|2203|69c06833e6dfbb28e25b74a5787dcd03756dddf0f66726de3ea47c1ad2931931
          rtl/m31/frp_m31_assertions.sv|24366|16a6abea57d2161a58ad5660c62f86cf057e65dbb1d9ae76e355e912a378077b
          rtl/m31/frp_m31_phase_thermal_assertions.sv|3783|fe7b06073e65fc64acf7232038911230db27fe3a5ce000d0e1d421e2f49b1b3b
          rtl/m31/frp_m31_sin_q30.mem|36864|adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d
          rtl/m32/frp_m32_registered_target_boundary.sv|3947|9626474b49d32b411e107d7ccc8ee5aa7f42728e9a6f70d634d16d3f2a414c5e
          rtl/m32/frp_m32_registered_target_boundary_tb.sv|6748|0824e781f276f325aa86bb9a6a136f1d4da910920b64d15fafe5d7d017e5288a
          rtl/m32/frp_m32_registered_target_request_path.sv|3244|02250069a68737f055a419cd67bf2d439b3f63b3f6a7a245f40e9bf29d1958eb
          rtl/m32/frp_m32_registered_target_request_path_tb.sv|12135|a615d9b3bd456f60b37715433862830a4f3f8170859a2b12415d4b4b071faea5
          rtl/m32/frp_m32_core.sv|10564|925342326b7ad555a1382e8ee3bc5754ed3012ba60e0eabf512113731e0ee6c9
          rtl/m32/frp_m32_core_tb.sv|19348|4a2ac2778192199d02700c324da7d0cfba4a2f83730ea148497099e1a640d800
          rtl/m32/frp_m32_mode_7_1_tb.sv|22207|7a6d610435bbd3f11441cb518bb64ab05b3748f5bb866092b1a734eab99c08f8
          rtl/m32/frp_m32_mode_1_7_tb.sv|22388|3dcd66dbd8edc6989294298adb14d4e3b314e0af62512b5a1398b789cb510b97
          rtl/m32/frp_m32_trace_monitor.sv|13827|556dd0759d91188b1947ae3abf61a0606cec238b67ff268f243eab370b01fc7c
          rtl/m32/frp_m32_mode_7_1_trace_tb.sv|13136|4d02db27a3ae080c7c2a029e27d1b2c66bdbd2ad35c64ad3e020792c0bb841ca
          rtl/m32/frp_m32_mode_1_7_trace_tb.sv|13136|bfb4b58f95f09e2fcbb81df3fae1c452a2e83111da7a9076dfaaefd2d76ab6cb
          formal/m32/frp_m32_registered_target_boundary_formal.sv|7698|b4880df9c8ca6a3f220a26d4937c14b63e3b97277cdff16ce50de725c7f840d2
          IDENTITIES

          test "$(wc -l < "$identity_record")" -eq 28
          sha256sum "$identity_record" \
            > "${RUNNER_TEMP}/m32-source-identities-manifest.sha256"

          grep -Fx '`include "frp_m31_pkg.sv"' \
            "$BOUNDARY_MODULE_PATH"
          grep -Fx '`include "frp_m32_registered_target_boundary.sv"' \
            "$BOUNDARY_TESTBENCH_PATH"
          grep -Fx '`include "frp_m32_registered_target_boundary.sv"' \
            "$REQUEST_PATH_MODULE_PATH"
          grep -Fx '`include "frp_m31_phase_request_adapter.sv"' \
            "$REQUEST_PATH_MODULE_PATH"
          grep -Fx '`include "frp_m32_registered_target_request_path.sv"' \
            "$REQUEST_PATH_TESTBENCH_PATH"
          grep -Fx '`include "frp_m31_execution_core.sv"' \
            "$CORE_MODULE_PATH"
          grep -Fx '`include "frp_m31_phase_interference.sv"' \
            "$CORE_MODULE_PATH"
          grep -Fx '`include "frp_m32_registered_target_request_path.sv"' \
            "$CORE_MODULE_PATH"
          grep -Fx '`include "frp_m31_thermal_proxy.sv"' \
            "$CORE_MODULE_PATH"
          grep -Fx '`include "frp_m31_stability.sv"' \
            "$CORE_MODULE_PATH"
          grep -Fx '`include "frp_m32_core.sv"' \
            "$CORE_TESTBENCH_PATH"
          grep -Fx '`include "frp_m31_phase_thermal_assertions.sv"' \
            "$CORE_TESTBENCH_PATH"
          grep -Fx '`include "frp_m32_core.sv"' \
            "$MODE_7_1_TESTBENCH_PATH"
          grep -Fx '`include "frp_m31_assertions.sv"' \
            "$MODE_7_1_TESTBENCH_PATH"
          grep -Fx '`include "frp_m32_core.sv"' \
            "$MODE_1_7_TESTBENCH_PATH"
          grep -Fx '`include "frp_m31_assertions.sv"' \
            "$MODE_1_7_TESTBENCH_PATH"
          grep -Fx '`include "frp_m31_pkg.sv"' \
            "$TRACE_MONITOR_PATH"
          grep -Fx '`include "frp_m32_mode_7_1_tb.sv"' \
            "$MODE_7_1_TRACE_TESTBENCH_PATH"
          grep -Fx '`include "frp_m32_trace_monitor.sv"' \
            "$MODE_7_1_TRACE_TESTBENCH_PATH"
          grep -Fx '`include "frp_m32_mode_1_7_tb.sv"' \
            "$MODE_1_7_TRACE_TESTBENCH_PATH"
          grep -Fx '`include "frp_m32_trace_monitor.sv"' \
            "$MODE_1_7_TRACE_TESTBENCH_PATH"

          grep -Fq 'execution_target_bank = registered_target_q;' \
            "$CORE_MODULE_PATH"
          grep -Fq '.target_q(execution_target_bank),' \
            "$CORE_MODULE_PATH"
          grep -Fq \
            'FRP_M32_INTEGRATED_REGISTERED_TARGET_CORE_TB: PASS' \
            "$CORE_TESTBENCH_PATH"
          grep -Fq \
            'FRP_M32_REGISTERED_TARGET_MODE_7_1_TB: PASS' \
            "$MODE_7_1_TESTBENCH_PATH"
          grep -Fq \
            'FRP_M32_REGISTERED_TARGET_MODE_1_7_TB: PASS' \
            "$MODE_1_7_TESTBENCH_PATH"
          grep -Fq 'module frp_m32_trace_monitor #(' \
            "$TRACE_MONITOR_PATH"
          grep -Fq 'M32_TRACE_SAMPLE source_tick=' \
            "$TRACE_MONITOR_PATH"
          grep -Fq 'M32_TRACE_BANK source_tick=' \
            "$TRACE_MONITOR_PATH"
          grep -Fq 'M32_TRACE_CELL source_tick=' \
            "$TRACE_MONITOR_PATH"
          grep -Fq 'M32_TRACE_REQUEST source_tick=' \
            "$TRACE_MONITOR_PATH"
          grep -Fq 'module frp_m32_mode_7_1_trace_tb;' \
            "$MODE_7_1_TRACE_TESTBENCH_PATH"
          grep -Fq 'FRP_M32_MODE_7_1_TRACE_TB: PASS samples=%0d' \
            "$MODE_7_1_TRACE_TESTBENCH_PATH"
          grep -Fq 'module frp_m32_mode_1_7_trace_tb;' \
            "$MODE_1_7_TRACE_TESTBENCH_PATH"
          grep -Fq 'FRP_M32_MODE_1_7_TRACE_TB: PASS samples=%0d' \
            "$MODE_1_7_TRACE_TESTBENCH_PATH"
          grep -Fq \
            'module frp_m32_registered_target_boundary_safety_formal;' \
            "$FORMAL_HARNESS_PATH"
          grep -Fq \
            'module frp_m32_registered_target_boundary_sequence_formal;' \
            "$FORMAL_HARNESS_PATH"

          for property_index in $(seq -w 1 14); do
            test "$(grep -Fc \
              "M32_P${property_index}" \
              "$FORMAL_HARNESS_PATH")" -ge 2
          done

          printf '%s\n' "Exact M31/M32 source identities: PASS"

      - name: Install Verilator and exact formal toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends verilator g++
          python -m pip install \
            --disable-pip-version-check \
            yowasp-yosys==0.68.0.0.post1208

          {
            verilator --version
            g++ --version | head -n 1
            python --version
            yowasp-yosys -V
          } 2>&1 | tee "${RUNNER_TEMP}/m32-toolchain.txt"

      - name: Lint registered-target core and trace contours
        shell: bash
        run: |
          set -euo pipefail

          lint_top() {
            local top_module="$1"
            local source_path="$2"

            verilator \
              --lint-only \
              --sv \
              --timing \
              --assert \
              -Wall \
              -Wno-fatal \
              --top-module "$top_module" \
              -Irtl/m31 \
              -Irtl/m32 \
              "$source_path"
          }

          lint_top \
            frp_m32_registered_target_boundary \
            "$BOUNDARY_MODULE_PATH"
          lint_top \
            frp_m32_registered_target_boundary_tb \
            "$BOUNDARY_TESTBENCH_PATH"
          lint_top \
            frp_m32_registered_target_request_path \
            "$REQUEST_PATH_MODULE_PATH"
          lint_top \
            frp_m32_registered_target_request_path_tb \
            "$REQUEST_PATH_TESTBENCH_PATH"
          lint_top \
            frp_m32_core \
            "$CORE_MODULE_PATH"
          lint_top \
            frp_m32_core_tb \
            "$CORE_TESTBENCH_PATH"
          lint_top \
            frp_m32_mode_7_1_tb \
            "$MODE_7_1_TESTBENCH_PATH"
          lint_top \
            frp_m32_mode_1_7_tb \
            "$MODE_1_7_TESTBENCH_PATH"
          lint_top \
            frp_m32_trace_monitor \
            "$TRACE_MONITOR_PATH"
          lint_top \
            frp_m32_mode_7_1_trace_tb \
            "$MODE_7_1_TRACE_TESTBENCH_PATH"
          lint_top \
            frp_m32_mode_1_7_trace_tb \
            "$MODE_1_7_TRACE_TESTBENCH_PATH"

          printf '%s\n' "FRP M32 Verilator lint: PASS"

      - name: Synthesize registered-target boundary profiles
        shell: bash
        run: |
          set -euo pipefail

          synthesize_profile() {
            local cells="$1"
            local replay
            local netlist_path
            local log_path
            local yosys_script

            for replay in 1 2; do
              netlist_path="${RUNNER_TEMP}/m32-boundary-synth-${cells}-run-${replay}.json"
              log_path="${RUNNER_TEMP}/m32-boundary-synth-${cells}-run-${replay}.log"
              yosys_script="read_verilog -sv -I rtl/m31 ${BOUNDARY_MODULE_PATH}; chparam -set CELLS ${cells} frp_m32_registered_target_boundary; synth -noabc -top frp_m32_registered_target_boundary; check; stat; write_json ${netlist_path}"

              yowasp-yosys -p "$yosys_script" 2>&1 \
                | tee "$log_path"

              test -s "$netlist_path"
              test "$(grep -Fc \
                'Found and reported 0 problems.' \
                "$log_path")" -ge 3
              test "$(grep -Fc \
                'End of script.' \
                "$log_path")" -eq 1
            done

            cmp \
              "${RUNNER_TEMP}/m32-boundary-synth-${cells}-run-1.json" \
              "${RUNNER_TEMP}/m32-boundary-synth-${cells}-run-2.json"
            sha256sum \
              "${RUNNER_TEMP}/m32-boundary-synth-${cells}-run-1.json" \
              > "${RUNNER_TEMP}/m32-boundary-synth-${cells}.sha256"
          }

          synthesize_profile 8
          synthesize_profile 16
          synthesize_profile 32

          printf '%s\n' "FRP M32 deterministic synthesis profiles: PASS"

      - name: Prove registered-target boundary properties
        shell: bash
        run: |
          set -euo pipefail

          prove_top() {
            local top_module="$1"
            local assertion_count="$2"
            local record_prefix="$3"
            local expected_imports
            local replay
            local log_path
            local record_path
            local yosys_script

            expected_imports="$((assertion_count * 4))"
            yosys_script="read_verilog -sv -formal -I rtl/m31 ${BOUNDARY_MODULE_PATH} ${FORMAL_HARNESS_PATH}; prep -top ${top_module}; flatten; chformal -lower; async2sync; opt_clean; check; sat -prove-asserts -set-def-formal -set-init-zero -seq 4 -timeout 300 -verify"

            for replay in 1 2; do
              log_path="${RUNNER_TEMP}/${record_prefix}-run-${replay}.log"
              record_path="${RUNNER_TEMP}/${record_prefix}-record-run-${replay}.txt"

              yowasp-yosys -p "$yosys_script" 2>&1 \
                | tee "$log_path"

              test "$(grep -Fc \
                'SAT proof finished - no model found: SUCCESS!' \
                "$log_path")" -eq 1
              test "$(grep -Fc \
                'Import proof for assert:' \
                "$log_path")" -eq "$expected_imports"

              {
                printf 'top=%s\n' "$top_module"
                printf 'depth=%s\n' "4"
                printf 'assertions=%s\n' "$assertion_count"
                grep -F 'Import proof for assert:' "$log_path"
                grep -F 'Solving problem with' "$log_path"
                grep -F \
                  'SAT proof finished - no model found: SUCCESS!' \
                  "$log_path"
              } > "$record_path"
            done

            cmp \
              "${RUNNER_TEMP}/${record_prefix}-record-run-1.txt" \
              "${RUNNER_TEMP}/${record_prefix}-record-run-2.txt"
            sha256sum \
              "${RUNNER_TEMP}/${record_prefix}-record-run-1.txt" \
              > "${RUNNER_TEMP}/${record_prefix}-record.sha256"
          }

          prove_top \
            frp_m32_registered_target_boundary_safety_formal \
            10 \
            m32-formal-safety
          prove_top \
            frp_m32_registered_target_boundary_sequence_formal \
            4 \
            m32-formal-sequence

          printf '%s\n' "FRP M32 registered-target bounded proofs: PASS"

      - name: Build and execute deterministic testbenches
        shell: bash
        run: |
          set -euo pipefail

          build_and_replay() {
            local top_module="$1"
            local source_path="$2"
            local pass_record="$3"
            local record_prefix="$4"
            local build_dir
            local executable

            build_dir="$(mktemp -d \
              "${RUNNER_TEMP}/${record_prefix}.XXXXXX")"

            verilator \
              --binary \
              --sv \
              --timing \
              --assert \
              -Wall \
              -Wno-fatal \
              -CFLAGS "-std=c++20" \
              --top-module "$top_module" \
              --Mdir "$build_dir" \
              -Irtl/m31 \
              -Irtl/m32 \
              "$source_path"

            executable="${build_dir}/V${top_module}"
            test -x "$executable"

            "$executable" 2>&1 \
              | tee "${RUNNER_TEMP}/${record_prefix}-run-1.log"
            "$executable" 2>&1 \
              | tee "${RUNNER_TEMP}/${record_prefix}-run-2.log"

            cmp \
              "${RUNNER_TEMP}/${record_prefix}-run-1.log" \
              "${RUNNER_TEMP}/${record_prefix}-run-2.log"
            test "$(grep -Fxc \
              "$pass_record" \
              "${RUNNER_TEMP}/${record_prefix}-run-1.log")" -eq 1

            sha256sum "${RUNNER_TEMP}/${record_prefix}-run-1.log" \
              > "${RUNNER_TEMP}/${record_prefix}-transcript.sha256"
          }

          build_and_replay \
            frp_m32_registered_target_boundary_tb \
            "$BOUNDARY_TESTBENCH_PATH" \
            "FRP_M32_REGISTERED_TARGET_BOUNDARY_TB: PASS" \
            m32-boundary

          build_and_replay \
            frp_m32_registered_target_request_path_tb \
            "$REQUEST_PATH_TESTBENCH_PATH" \
            "FRP_M32_REGISTERED_TARGET_REQUEST_PATH_TB: PASS" \
            m32-request-path

          build_and_replay \
            frp_m32_core_tb \
            "$CORE_TESTBENCH_PATH" \
            "FRP_M32_INTEGRATED_REGISTERED_TARGET_CORE_TB: PASS" \
            m32-core

          build_and_replay \
            frp_m32_mode_7_1_tb \
            "$MODE_7_1_TESTBENCH_PATH" \
            "FRP_M32_REGISTERED_TARGET_MODE_7_1_TB: PASS" \
            m32-mode-7-1

          build_and_replay \
            frp_m32_mode_1_7_tb \
            "$MODE_1_7_TESTBENCH_PATH" \
            "FRP_M32_REGISTERED_TARGET_MODE_1_7_TB: PASS" \
            m32-mode-1-7

          build_and_replay \
            frp_m32_mode_7_1_trace_tb \
            "$MODE_7_1_TRACE_TESTBENCH_PATH" \
            "FRP_M32_MODE_7_1_TRACE_TB: PASS samples=16" \
            m32-mode-7-1-full-trace

          build_and_replay \
            frp_m32_mode_1_7_trace_tb \
            "$MODE_1_7_TRACE_TESTBENCH_PATH" \
            "FRP_M32_MODE_1_7_TRACE_TB: PASS samples=17" \
            m32-mode-1-7-full-trace

          printf '%s\n' "FRP M32 deterministic replays: PASS"

      - name: Verify scheduler and full-trace records
        shell: bash
        run: |
          set -euo pipefail

          mode_7_1_log="${RUNNER_TEMP}/m32-mode-7-1-run-1.log"
          mode_1_7_log="${RUNNER_TEMP}/m32-mode-1-7-run-1.log"
          mode_7_1_trace="${RUNNER_TEMP}/m32-mode-7-1-trace.log"
          mode_1_7_trace="${RUNNER_TEMP}/m32-mode-1-7-trace.log"
          full_7_1_log="${RUNNER_TEMP}/m32-mode-7-1-full-trace-run-1.log"
          full_1_7_log="${RUNNER_TEMP}/m32-mode-1-7-full-trace-run-1.log"

          extract_full_trace() {
            local source_log="$1"
            local record_prefix="$2"
            local expected_samples="$3"
            local expected_banks="$4"
            local expected_cells="$5"
            local expected_requests="$6"
            local expected_total

            expected_total="$(($expected_samples + $expected_banks \
              + $expected_cells + $expected_requests))"

            grep '^M32_TRACE_' "$source_log" \
              > "${RUNNER_TEMP}/${record_prefix}-records.log"
            grep '^M32_TRACE_SAMPLE ' "$source_log" \
              > "${RUNNER_TEMP}/${record_prefix}-sample.log"
            grep '^M32_TRACE_BANK ' "$source_log" \
              > "${RUNNER_TEMP}/${record_prefix}-bank.log"
            grep '^M32_TRACE_CELL ' "$source_log" \
              > "${RUNNER_TEMP}/${record_prefix}-cell.log"
            grep '^M32_TRACE_REQUEST ' "$source_log" \
              > "${RUNNER_TEMP}/${record_prefix}-request.log"

            test "$(wc -l \
              < "${RUNNER_TEMP}/${record_prefix}-records.log")" \
              -eq "$expected_total"
            test "$(wc -l \
              < "${RUNNER_TEMP}/${record_prefix}-sample.log")" \
              -eq "$expected_samples"
            test "$(wc -l \
              < "${RUNNER_TEMP}/${record_prefix}-bank.log")" \
              -eq "$expected_banks"
            test "$(wc -l \
              < "${RUNNER_TEMP}/${record_prefix}-cell.log")" \
              -eq "$expected_cells"
            test "$(wc -l \
              < "${RUNNER_TEMP}/${record_prefix}-request.log")" \
              -eq "$expected_requests"
          }

          write_trace_identity() {
            local path="$1"
            local bytes
            local digest

            bytes="$(wc -c < "$path")"
            digest="$(sha256sum "$path" | cut -d' ' -f1)"
            printf '%s|%s|%s\n' \
              "$(basename "$path")" \
              "$bytes" \
              "$digest" \
              >> "${RUNNER_TEMP}/m32-full-trace-identities.txt"
          }

          grep '^M32_MODE_7_1_TRACE ' "$mode_7_1_log" \
            > "$mode_7_1_trace"
          grep '^M32_MODE_1_7_TRACE ' "$mode_1_7_log" \
            > "$mode_1_7_trace"

          test "$(wc -l < "$mode_7_1_trace")" -eq 16
          test "$(grep -Fc ' balance_tick=1 commit_tick=0 ' \
            "$mode_7_1_trace")" -eq 14
          test "$(grep -Fc ' balance_tick=0 commit_tick=1 ' \
            "$mode_7_1_trace")" -eq 2
          grep -Fq \
            'first_leg=1 second_leg=0 executed_state=0 active_zero=1' \
            "$mode_7_1_trace"
          grep -Fq \
            'first_leg=0 second_leg=1 executed_state=-1 active_zero=0' \
            "$mode_7_1_trace"

          test "$(wc -l < "$mode_1_7_trace")" -eq 17
          test "$(grep -Fc ' excite_tick=1 neutralize_tick=0 ' \
            "$mode_1_7_trace")" -eq 3
          test "$(grep -Fc ' excite_tick=0 neutralize_tick=1 ' \
            "$mode_1_7_trace")" -eq 14
          grep -Fq \
            'first_leg=1 second_leg=0 executed_state=0 active_zero=1' \
            "$mode_1_7_trace"
          grep -Fq \
            'first_leg=0 second_leg=1 executed_state=-1 active_zero=0' \
            "$mode_1_7_trace"

          sha256sum "$mode_7_1_trace" \
            > "${RUNNER_TEMP}/m32-mode-7-1-trace.sha256"
          sha256sum "$mode_1_7_trace" \
            > "${RUNNER_TEMP}/m32-mode-1-7-trace.sha256"

          extract_full_trace \
            "$full_7_1_log" \
            m32-mode-7-1-full-trace \
            16 \
            16 \
            128 \
            32
          extract_full_trace \
            "$full_1_7_log" \
            m32-mode-1-7-full-trace \
            17 \
            17 \
            136 \
            34

          full_7_1_sample="${RUNNER_TEMP}/m32-mode-7-1-full-trace-sample.log"
          full_7_1_cell="${RUNNER_TEMP}/m32-mode-7-1-full-trace-cell.log"
          full_1_7_sample="${RUNNER_TEMP}/m32-mode-1-7-full-trace-sample.log"
          full_1_7_cell="${RUNNER_TEMP}/m32-mode-1-7-full-trace-cell.log"

          test "$(grep -Fc ' balance_tick=1 commit_tick=0 ' \
            "$full_7_1_sample")" -eq 14
          test "$(grep -Fc ' balance_tick=0 commit_tick=1 ' \
            "$full_7_1_sample")" -eq 2
          test "$(grep -Fc ' excite_tick=1 neutralize_tick=0 ' \
            "$full_1_7_sample")" -eq 3
          test "$(grep -Fc ' excite_tick=0 neutralize_tick=1 ' \
            "$full_1_7_sample")" -eq 14

          test "$(grep -Fc ' invariant_all_valid=1 ' \
            "$full_7_1_sample")" -eq 16
          test "$(grep -Fc ' invariant_all_valid=1 ' \
            "$full_1_7_sample")" -eq 17
          test "$(grep -Fc \
            'actual_direct_events=0 reserved_state_events=0 queue_overflow_events=0' \
            "$full_7_1_sample")" -eq 16
          test "$(grep -Fc \
            'actual_direct_events=0 reserved_state_events=0 queue_overflow_events=0' \
            "$full_1_7_sample")" -eq 17

          test "$(grep -Fc ' pair_phase_order_q30=' \
            "$full_7_1_sample")" -eq 16
          test "$(grep -Fc ' coherence_capacity_q16=' \
            "$full_7_1_sample")" -eq 16
          test "$(grep -Fc ' pair_phase_order_q30=' \
            "$full_1_7_sample")" -eq 17
          test "$(grep -Fc ' coherence_capacity_q16=' \
            "$full_1_7_sample")" -eq 17

          test "$(grep -Fc ' phase_word=' "$full_7_1_cell")" -eq 128
          test "$(grep -Fc ' frequency_current_q16=' \
            "$full_7_1_cell")" -eq 128
          test "$(grep -Fc ' coupling_field_q16=' \
            "$full_7_1_cell")" -eq 128
          test "$(grep -Fc ' phase_projection_q30=' \
            "$full_7_1_cell")" -eq 128
          test "$(grep -Fc ' phase_word=' "$full_1_7_cell")" -eq 136
          test "$(grep -Fc ' frequency_current_q16=' \
            "$full_1_7_cell")" -eq 136
          test "$(grep -Fc ' coupling_field_q16=' \
            "$full_1_7_cell")" -eq 136
          test "$(grep -Fc ' phase_projection_q30=' \
            "$full_1_7_cell")" -eq 136

          grep -Eq \
            '^M32_TRACE_CELL .*source_tick=9 source_cell=0 .*retained_state_value=0 active_zero=1 pending_target_code=3 pending_target_value=-1 pending_active=1 .*first_route_leg=1 second_route_leg=0$' \
            "$full_7_1_cell"
          grep -Eq \
            '^M32_TRACE_CELL .*source_tick=15 source_cell=0 .*retained_state_value=-1 active_zero=0 pending_target_code=0 pending_target_value=0 pending_active=0 .*first_route_leg=0 second_route_leg=1$' \
            "$full_7_1_cell"
          grep -Eq \
            '^M32_TRACE_CELL .*source_tick=10 source_cell=0 .*retained_state_value=0 active_zero=1 pending_target_code=3 pending_target_value=-1 pending_active=1 .*first_route_leg=1 second_route_leg=0$' \
            "$full_1_7_cell"
          grep -Eq \
            '^M32_TRACE_CELL .*source_tick=16 source_cell=0 .*retained_state_value=-1 active_zero=0 pending_target_code=0 pending_target_value=0 pending_active=0 .*first_route_leg=0 second_route_leg=1$' \
            "$full_1_7_cell"

          sha256sum \
            "${RUNNER_TEMP}/m32-mode-7-1-full-trace-records.log" \
            > "${RUNNER_TEMP}/m32-mode-7-1-full-trace-records.sha256"
          sha256sum \
            "${RUNNER_TEMP}/m32-mode-1-7-full-trace-records.log" \
            > "${RUNNER_TEMP}/m32-mode-1-7-full-trace-records.sha256"

          : > "${RUNNER_TEMP}/m32-full-trace-identities.txt"
          for mode in 7-1 1-7; do
            for record_type in records sample bank cell request; do
              write_trace_identity \
                "${RUNNER_TEMP}/m32-mode-${mode}-full-trace-${record_type}.log"
            done
          done

          test "$(wc -l \
            < "${RUNNER_TEMP}/m32-full-trace-identities.txt")" -eq 10
          trace_identity_digest="$(sha256sum \
            "${RUNNER_TEMP}/m32-full-trace-identities.txt" \
            | cut -d' ' -f1)"
          printf '%s  %s\n' \
            "$trace_identity_digest" \
            "m32-full-trace-identities.txt" \
            > "${RUNNER_TEMP}/m32-full-trace-identities.sha256"

          printf '%s\n' "FRP M32 scheduler and full traces: PASS"

