          """
          expected_archive_sha256 = "485c18cc95636a4d105457195015ea094f4b31bc2f7e1a5bbceaef0606182d79"
          expected_files = {"frp_m29_system_integration_downstream_compatibility.py":{"bytes":80805,"raw_sha256":"a335d75a15db1d04c26d2c6b5260599c6f7b027bcc7637efb5470640f9b88ed9"},"tests/test_frp_m29_system_integration_downstream_compatibility.py":{"bytes":25274,"raw_sha256":"f0bfd4227ad1dca0c9fb0b11b6aa410e3874e890e992f89bf432aa5ed0f78c65"}}
          payload_root = Path(os.environ["M29_PAYLOAD_ROOT"])
          staging = payload_root / "staging"
          base64_alphabet = (
              "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="
          )

          def row_digest(value):
              return hashlib.sha256(value.encode("ascii")).hexdigest()

          def repair_row(value, expected_length, expected_digest, row_index):
              if len(value) == expected_length and row_digest(value) == expected_digest:
                  return value, False
              candidates = set()
              if len(value) == expected_length - 1:
                  for position in range(expected_length):
                      for character in base64_alphabet:
                          candidate = value[:position] + character + value[position:]
                          if row_digest(candidate) == expected_digest:
                              candidates.add(candidate)
              elif len(value) == expected_length + 1:
                  for position in range(len(value)):
                      candidate = value[:position] + value[position + 1:]
                      if row_digest(candidate) == expected_digest:
                          candidates.add(candidate)
              elif len(value) == expected_length:
                  for position, original in enumerate(value):
                      for character in base64_alphabet:
                          if character == original:
                              continue
                          candidate = value[:position] + character + value[position + 1:]
                          if row_digest(candidate) == expected_digest:
                              candidates.add(candidate)
              if len(candidates) != 1:
                  raise SystemExit(
                      "M29 payload row cannot be repaired uniquely: "
                      f"row={row_index}, length={len(value)}, "
                      f"expected={expected_length}, candidates={len(candidates)}"
                  )
              return next(iter(candidates)), True

          parsed_rows = []
          repaired_rows = []
          for raw_line in payload_rows.splitlines():
              line = raw_line.strip()
              if not line:
                  continue
              parts = line.split(" ", 3)
              if len(parts) != 4:
                  raise SystemExit("M29 payload row format mismatch")
              index_text, length_text, digest, encoded = parts
              index = int(index_text)
              expected_length = int(length_text)
              if index != len(parsed_rows):
                  raise SystemExit("M29 payload row ordering mismatch")
              if len(digest) != 64 or any(
                  character not in "0123456789abcdef" for character in digest
              ):
                  raise SystemExit(f"M29 payload row digest format mismatch: {index}")
              encoded, repaired = repair_row(
                  encoded, expected_length, digest, index
              )
              parsed_rows.append(encoded)
              if repaired:
                  repaired_rows.append(index)

          compact = "".join(parsed_rows)
          try:
              compressed = base64.b64decode(compact, validate=True)
          except binascii.Error as exc:
              raise SystemExit(
                  f"M29 payload Base64 validation failed: {exc}"
              ) from exc
          observed_archive_sha256 = hashlib.sha256(compressed).hexdigest()
          if observed_archive_sha256 != expected_archive_sha256:
              raise SystemExit(
                  "M29 payload digest mismatch: "
                  f"{observed_archive_sha256} != {expected_archive_sha256}"
              )
          try:
              archive_bytes = bz2.decompress(compressed)
          except OSError as exc:
              raise SystemExit(
                  f"M29 payload decompression failed: {exc}"
              ) from exc

          if payload_root.exists():
              shutil.rmtree(payload_root)
          staging.mkdir(parents=True)

          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:") as archive:
              members = archive.getmembers()
              observed_names = [member.name for member in members]
              if observed_names != list(expected_files):
                  raise SystemExit("M29 payload member inventory mismatch")
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or any(
                          part in ("", ".", "..")
                          for part in member.name.split("/")
                      )
                      or not member.isfile()
                      or member.issym()
                      or member.islnk()
                  ):
                      raise SystemExit(
                          f"unsafe M29 payload member: {member.name}"
                      )
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(
                          f"missing M29 payload member data: {member.name}"
                      )
                  raw = source.read()
                  record = expected_files[member.name]
                  if len(raw) != record["bytes"]:
                      raise SystemExit(
                          f"M29 payload byte count mismatch: {member.name}"
                      )
                  if hashlib.sha256(raw).hexdigest() != record["raw_sha256"]:
                      raise SystemExit(
                          f"M29 payload file digest mismatch: {member.name}"
                      )
                  destination = staging.joinpath(*path.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(raw)

          for relative, record in expected_files.items():
              source = staging.joinpath(*PurePosixPath(relative).parts)
              destination = Path(relative)
              if destination.exists() and destination.is_symlink():
                  raise SystemExit(
                      f"refusing M29 symlink destination: {relative}"
                  )
              destination.parent.mkdir(parents=True, exist_ok=True)
              os.replace(source, destination)
              raw = destination.read_bytes()
              if (
                  len(raw) != record["bytes"]
                  or hashlib.sha256(raw).hexdigest() != record["raw_sha256"]
              ):
                  raise SystemExit(
                      f"installed M29 source mismatch: {relative}"
                  )

          print(f"M29 payload archive sha256: {observed_archive_sha256}")
          print(f"M29 source files installed: {len(expected_files)}")
          print(f"M29 payload rows repaired: {repaired_rows}")
          PY

      - name: Validate the extracted M29 source and immutable vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            frp_m29_system_integration_downstream_compatibility.py \
            tests/test_frp_m29_system_integration_downstream_compatibility.py
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("frp_m29_system_integration_downstream_compatibility.py"),
              Path(
                  "tests/"
                  "test_frp_m29_system_integration_downstream_compatibility.py"
              ),
          ]
          forbidden = "-1/0/" + "+1"
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if forbidden in text:
                  raise SystemExit(f"forbidden ternary notation in {path}")
          print("M29 extracted source and immutable vocabulary: PASS")
          PY

      - name: Generate two byte-identical complete M29 closure sets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/m29_generation_a /tmp/m29_generation_b
          mkdir -p /tmp/m29_generation_a /tmp/m29_generation_b
          python frp_m29_system_integration_downstream_compatibility.py \
            --generate \
            --repository-root . \
            --output-root /tmp/m29_generation_a \
            --source-commit "$M29_SOURCE_COMMIT" \
            --output /tmp/m29_generation_a.json \
            2>&1 | tee /tmp/m29_generation_a.log
          python frp_m29_system_integration_downstream_compatibility.py \
            --generate \
            --repository-root . \
            --output-root /tmp/m29_generation_b \
            --source-commit "$M29_SOURCE_COMMIT" \
            --output /tmp/m29_generation_b.json \
            2>&1 | tee /tmp/m29_generation_b.log
          diff --recursive --brief /tmp/m29_generation_a /tmp/m29_generation_b
          cmp --silent /tmp/m29_generation_a.json /tmp/m29_generation_b.json
          test "$(find /tmp/m29_generation_a -type f | wc -l)" -eq 26
          find /tmp/m29_generation_a -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee /tmp/m29_deterministic_sha256.txt

      - name: Generate the complete canonical M29 repository set
        shell: bash
        run: |
          set -euo pipefail
          python frp_m29_system_integration_downstream_compatibility.py \
            --generate \
            --repository-root . \
            --output-root . \
            --source-commit "$M29_SOURCE_COMMIT" \
            --output /tmp/m29_generation.json \
            2>&1 | tee /tmp/m29_generation.log

      - name: Run focused M29 integration qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_frp_m29_system_integration_downstream_compatibility \
            2>&1 | tee /tmp/m29_focused_tests.log
          grep -F "Ran 59 tests" /tmp/m29_focused_tests.log
          python frp_m29_system_integration_downstream_compatibility.py \
            --verify \
            --repository-root . \
            --source-commit "$M29_SOURCE_COMMIT" \
            --output /tmp/m29_verification.json \
            2>&1 | tee /tmp/m29_verification.log
          python frp_m29_system_integration_downstream_compatibility.py \
            --self-test \
            --repository-root . \
            --source-commit "$M29_SOURCE_COMMIT" \
            --output /tmp/m29_self_test.json \
            2>&1 | tee /tmp/m29_self_test.log
          python - <<'PY'
          import json
          from pathlib import Path

          generation = json.loads(
              Path("/tmp/m29_generation.json").read_text(encoding="utf-8")
          )
          verification = json.loads(
              Path("/tmp/m29_verification.json").read_text(encoding="utf-8")
          )
          self_test = json.loads(
              Path("/tmp/m29_self_test.json").read_text(encoding="utf-8")
          )
          for name, result in (
              ("generation", generation),
              ("verification", verification),
              ("self-test", self_test),
          ):
              if result["status"] != "PASS":
                  raise SystemExit(f"M29 {name} failed")
          expected = {
              "generated_path_count": 26,
              "schema_definition_count": 13,
              "document_count": 13,
              "upstream_schema_count": 84,
              "upstream_artifact_count": 97,
              "qualification_check_count": 48,
          }
          for key, value in expected.items():
              if generation[key] != value or verification[key] != value:
                  raise SystemExit(f"M29 result boundary mismatch: {key}")
          if self_test["check_count"] != 6:
              raise SystemExit("M29 self-test count mismatch")
          print("M29 focused integration qualification: PASS")
          PY

