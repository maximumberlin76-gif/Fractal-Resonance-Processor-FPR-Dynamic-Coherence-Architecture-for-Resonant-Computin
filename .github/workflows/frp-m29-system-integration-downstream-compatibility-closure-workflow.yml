        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee /tmp/m29_full_regression.log
          grep -F "Ran 463 tests" /tmp/m29_full_regression.log

      - name: Validate the closed M29 repository boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          import frp_m29_system_integration_downstream_compatibility as m29

          required = [
              Path("frp_m29_system_integration_downstream_compatibility.py"),
              Path(
                  "tests/"
                  "test_frp_m29_system_integration_downstream_compatibility.py"
              ),
              *(Path(relative) for relative in m29.GENERATED_PATHS),
          ]
          if len(required) != 28 or len(required) != len(set(required)):
              raise SystemExit("M29 required path inventory mismatch")
          missing = [
              str(path)
              for path in required
              if not path.is_file() or path.is_symlink()
          ]
          if missing:
              raise SystemExit(f"M29 required file boundary failed: {missing}")

          contract = json.loads(
              Path(m29.CONTRACT_ARTIFACT).read_text(encoding="utf-8")
          )
          schemas = json.loads(
              Path(m29.SCHEMA_REGISTRY).read_text(encoding="utf-8")
          )
          artifacts = json.loads(
              Path(m29.ARTIFACT_REGISTRY).read_text(encoding="utf-8")
          )
          package = json.loads(
              Path(m29.DEMO_PACKAGE_ARTIFACT).read_text(encoding="utf-8")
          )
          vectors = json.loads(
              Path(m29.CONSUMPTION_VECTORS_ARTIFACT).read_text(
                  encoding="utf-8"
              )
          )
          qualification = json.loads(
              Path(m29.QUALIFICATION_ARTIFACT).read_text(encoding="utf-8")
          )

          core = contract["immutable_core"]
          if core["balanced_ternary_notation"] != "-1/0/1":
              raise SystemExit("M29 immutable ternary notation mismatch")
          if core["semantic_values"] != [-1, 0, 1]:
              raise SystemExit("M29 immutable ternary domain mismatch")
          if core["active_neutral_state"] != 0:
              raise SystemExit("M29 active neutral boundary mismatch")
          if core["temporal_scheduler_modes"] != ["1/7", "7/1"]:
              raise SystemExit("M29 temporal scheduler boundary mismatch")
          if core["service_scheduler_mode"] != "free":
              raise SystemExit("M29 service scheduler boundary mismatch")

          boundary = contract["integration_boundary"]
          if boundary["existing_scaffold_action"] != "preserve_existing_scaffold":
              raise SystemExit("M29 existing Observatory scaffold mismatch")
          if boundary["downstream_writeback"] != "forbidden":
              raise SystemExit("M29 Observatory writeback boundary mismatch")
          if boundary["downstream_semantic_reimplementation"] != "forbidden":
              raise SystemExit("M29 downstream semantic boundary mismatch")
          if boundary["upstream_dependency_on_downstream_code"] is not False:
              raise SystemExit("M29 reverse dependency boundary mismatch")
          if boundary["downstream_files_modified_by_m29"] is not False:
              raise SystemExit("M29 downstream modification boundary mismatch")

          if schemas["upstream_schema_count"] != 84:
              raise SystemExit("M29 upstream schema count mismatch")
          if schemas["source_registry_count"] != 12:
              raise SystemExit("M29 source registry count mismatch")
          if schemas["m29_schema_count"] != 13:
              raise SystemExit("M29 schema definition count mismatch")
          if schemas["record_count"] != 97:
              raise SystemExit("M29 supported schema count mismatch")
          if artifacts["record_count"] != 97:
              raise SystemExit("M29 upstream artifact count mismatch")
          if artifacts["json_artifact_count"] != 86:
              raise SystemExit("M29 JSON artifact count mismatch")
          if artifacts["byte_artifact_count"] != 11:
              raise SystemExit("M29 byte artifact count mismatch")
          if package["member_count"] != 4:
              raise SystemExit("M29 canonical package member count mismatch")
          if vectors["vector_count"] != 12:
              raise SystemExit("M29 consumption vector count mismatch")
          if vectors["accepted_count"] != 4 or vectors["rejected_count"] != 8:
              raise SystemExit("M29 consumption vector result count mismatch")
          if vectors["status"] != "PASS":
              raise SystemExit("M29 consumption vectors failed")
          if qualification["check_count"] != 48:
              raise SystemExit("M29 qualification check count mismatch")
          if qualification["failed_count"] != 0:
              raise SystemExit("M29 qualification failed")
          if qualification["status"] != "PASS":
              raise SystemExit("M29 qualification status mismatch")

          forbidden = "-1/0/" + "+1"
          for path in required:
              if forbidden in path.read_text(encoding="utf-8"):
                  raise SystemExit(f"forbidden ternary notation in {path}")
          if any(path.stat().st_size > 250000 for path in required):
              raise SystemExit("M29 generated file exceeds bounded file size")
          print("Closed M29 repository boundary: PASS")
          PY

          while IFS= read -r status_path; do
            changed_path="${status_path:3}"
            case "$changed_path" in
              frp_m29_system_integration_downstream_compatibility.py|\
              tests/test_frp_m29_system_integration_downstream_compatibility.py|\
              schemas/m29/*|\
              artifacts/m29/*)
                ;;
              *)
                echo "Unexpected working-tree change during M29 closure: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git status --porcelain=v1)

      - name: Create the complete M29 qualification commit and publish main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            frp_m29_system_integration_downstream_compatibility.py \
            tests/test_frp_m29_system_integration_downstream_compatibility.py \
            schemas/m29 \
            artifacts/m29

          if git diff --cached --quiet; then
            echo "M29 integration qualification is already committed; no commit is required."
            exit 0
          fi

          test "$(git diff --cached --name-only | wc -l)" -eq 28
          while IFS= read -r staged_path; do
            case "$staged_path" in
              frp_m29_system_integration_downstream_compatibility.py|\
              tests/test_frp_m29_system_integration_downstream_compatibility.py|\
              schemas/m29/*|\
              artifacts/m29/*)
                ;;
              *)
                echo "Unexpected staged M29 path: $staged_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          git commit \
            -m "Add M29 system integration and downstream compatibility closure" \
            -m "Close M29 with complete M18-M28 schema, registry, artifact, producer-command, and provenance inventories; byte-exact canonical downstream demo packaging; exact-version and unsupported-version behavior; release-independent compatibility records; and published-byte consumption vectors. Preserve the existing FRP Trace Observatory scaffold and its one-way read-only boundary without downstream code in FRP, while keeping the immutable -1/0/1 core, active neutral state 0, temporal schedulers 1/7 and 7/1, and separate free service mode."
          git push origin HEAD:main

      - name: Retain complete M29 integration qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frp-m29-integration-closure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/m29_generation_a.json
            /tmp/m29_generation_b.json
            /tmp/m29_generation_a.log
            /tmp/m29_generation_b.log
            /tmp/m29_deterministic_sha256.txt
            /tmp/m29_generation.json
            /tmp/m29_generation.log
            /tmp/m29_focused_tests.log
            /tmp/m29_verification.json
            /tmp/m29_verification.log
            /tmp/m29_self_test.json
            /tmp/m29_self_test.log
            /tmp/m29_full_regression.log
