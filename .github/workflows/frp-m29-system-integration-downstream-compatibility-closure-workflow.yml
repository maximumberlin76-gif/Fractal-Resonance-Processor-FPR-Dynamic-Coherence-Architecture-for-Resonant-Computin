name: FRP M29 System Integration and Downstream Compatibility Closure

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m29-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close-m29-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M29_PAYLOAD_ROOT: /tmp/frp_m29_integration_creation
      M29_SOURCE_COMMIT: a1c0bb2fa0a4731b9339e6cd996589e1bf226c04
      M29_OBSERVATORY_COMMIT: a9d71657c56221d0d9b72fb6e954e0028f096a9e
      M29_PRESERVED_OBSERVATORY_COMMIT: 566a4ff88baa57f844691b46937552253e095434
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python --version
          python -m pip show jsonschema

      - name: Validate the complete immutable M28 and Observatory boundaries
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${M29_SOURCE_COMMIT}^{commit}"
          git cat-file -e "${M29_PRESERVED_OBSERVATORY_COMMIT}^{commit}"
          git merge-base --is-ancestor "$M29_PRESERVED_OBSERVATORY_COMMIT" "$M29_SOURCE_COMMIT"
          git merge-base --is-ancestor "$M29_SOURCE_COMMIT" HEAD
          test "$(git rev-parse "$M29_SOURCE_COMMIT")" = "$M29_SOURCE_COMMIT"
          test "$(git show -s --format=%s "$M29_SOURCE_COMMIT")" = "Add M28 hierarchical scaling and hotspot-containment realization"
          test "$(git show -s --format=%s "$M29_PRESERVED_OBSERVATORY_COMMIT")" = "Add M28 Trace Observatory upstream interchange"

          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/frp-m29-system-integration-downstream-compatibility-closure-workflow.yml|\
              frp_m29_system_integration_downstream_compatibility.py|\
              tests/test_frp_m29_system_integration_downstream_compatibility.py|\
              schemas/m29/*|\
              artifacts/m29/*)
                ;;
              *)
                echo "Unexpected change after the complete M28 boundary: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$M29_SOURCE_COMMIT"..HEAD)

          test -f .github/workflows/frp-m29-system-integration-downstream-compatibility-closure-workflow.yml
          test -f frp_m28_hierarchical_scaling_hotspot_containment.py
          test -f frp_m28_trace_observatory_upstream_interchange.py
          test -f artifacts/m28/hierarchy/contracts/m28-hierarchical-scaling-contract.json
          test -f artifacts/m28/hierarchy/manifests/m28-hierarchy-qualification.json
          test -f artifacts/m28/contracts/m28-trace-observatory-upstream-contract.json
          test -f artifacts/m28/manifests/m28-trace-observatory-interchange-qualification.json

          python - <<'PY'
          import json
          from pathlib import Path

          hierarchy_contract = json.loads(
              Path(
                  "artifacts/m28/hierarchy/contracts/"
                  "m28-hierarchical-scaling-contract.json"
              ).read_text(encoding="utf-8")
          )
          hierarchy_qualification = json.loads(
              Path(
                  "artifacts/m28/hierarchy/manifests/"
                  "m28-hierarchy-qualification.json"
              ).read_text(encoding="utf-8")
          )
          observatory_contract = json.loads(
              Path(
                  "artifacts/m28/contracts/"
                  "m28-trace-observatory-upstream-contract.json"
              ).read_text(encoding="utf-8")
          )
          observatory_qualification = json.loads(
              Path(
                  "artifacts/m28/manifests/"
                  "m28-trace-observatory-interchange-qualification.json"
              ).read_text(encoding="utf-8")
          )

          for name, value in (
              ("hierarchy contract", hierarchy_contract),
              ("hierarchy qualification", hierarchy_qualification),
              ("Observatory contract", observatory_contract),
              ("Observatory qualification", observatory_qualification),
          ):
              if value["status"] != "PASS":
                  raise SystemExit(f"M28 {name} is not PASS")

          core = hierarchy_contract["immutable_core"]
          if core["balanced_ternary_notation"] != "-1/0/1":
              raise SystemExit("M28 ternary notation boundary mismatch")
          if core["semantic_values"] != [-1, 0, 1]:
              raise SystemExit("M28 ternary domain boundary mismatch")
          if core["active_neutral_state"] != 0:
              raise SystemExit("M28 active neutral boundary mismatch")
          if core["temporal_scheduler_modes"] != ["1/7", "7/1"]:
              raise SystemExit("M28 temporal scheduler boundary mismatch")
          if core["service_scheduler_mode"] != "free":
              raise SystemExit("M28 service scheduler boundary mismatch")
          provenance = hierarchy_contract["provenance_boundary"]
          if provenance["hierarchy_role"] != "primary_M28_realization":
              raise SystemExit("M28 primary hierarchy role mismatch")
          if provenance["observatory_interchange_commit"] != (
              "566a4ff88baa57f844691b46937552253e095434"
          ):
              raise SystemExit("M28 preserved Observatory commit mismatch")
          if provenance["observatory_interchange_role"] != (
              "additional_publication_layer"
          ):
              raise SystemExit("M28 preserved Observatory role mismatch")
          if hierarchy_qualification["check_count"] != 29:
              raise SystemExit("M28 hierarchy qualification count mismatch")
          if hierarchy_qualification["failed_count"] != 0:
              raise SystemExit("M28 hierarchy qualification failure")

          baseline = observatory_contract["consumer_scaffold_baseline"]
          if baseline["repository"] != "FRP-Trace-Observatory":
              raise SystemExit("Observatory repository boundary mismatch")
          if baseline["audited_commit"] != (
              "a9d71657c56221d0d9b72fb6e954e0028f096a9e"
          ):
              raise SystemExit("Observatory audited commit mismatch")
          if baseline["verified_test_count"] != 275:
              raise SystemExit("Observatory audited test count mismatch")
          modes = [item["mode"] for item in baseline["implemented_layers"]]
          if set(modes) != {
              "artifact_auditor",
              "trace_explorer",
              "ternary_transition_visualizer",
          }:
              raise SystemExit("Observatory existing scaffold mode mismatch")
          direction = observatory_contract["integration_direction"]
          if direction["direction"] != "upstream_to_downstream_only":
              raise SystemExit("Observatory integration direction mismatch")
          if direction["downstream_writeback"] != "forbidden":
              raise SystemExit("Observatory writeback boundary mismatch")
          if direction["downstream_source_mutation"] != "forbidden":
              raise SystemExit("Observatory source mutation boundary mismatch")
          if observatory_qualification["check_count"] != 30:
              raise SystemExit("Observatory qualification count mismatch")
          if observatory_qualification["failed_count"] != 0:
              raise SystemExit("Observatory qualification failure")
          print("Complete M28 and Observatory boundaries: PASS")
          PY

