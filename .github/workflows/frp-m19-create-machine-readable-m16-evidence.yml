name: FRP M19 Create Machine-Readable M16 Evidence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-m19:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M19_ROOT: /tmp/frp_m19_creation
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create, qualify, and commit M19
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import os
          import shutil
          import subprocess
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          WORKFLOW = (
              ".github/workflows/"
              "frp-m19-create-machine-readable-m16-evidence.yml"
          )
          PAYLOAD_COMMIT = (
              "a0f162d4601075d5cd6d83e0152292d7c76f4a7b"
          )
          PREVIOUS_WORKFLOW_SHA256 = (
              "90f830315b066f0c7d12315b0681348ee37649aa234d7b5afae33a11ce4698d6"
          )
          PAYLOAD_SHA256 = (
              "a4c462f83dead2f20d25ad82eb62d2da7547c2270a7ee4a9e29cc49f67ef7dc3"
          )

          previous = subprocess.run(
              ["git", "show", f"{PAYLOAD_COMMIT}:{WORKFLOW}"],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              check=False,
          )
          if previous.returncode != 0:
              raise SystemExit(
                  "cannot read the previous M19 workflow: "
                  + previous.stderr.decode("utf-8", "replace")
              )
          if hashlib.sha256(previous.stdout).hexdigest() != PREVIOUS_WORKFLOW_SHA256:
              raise SystemExit("previous M19 workflow integrity failure")

          source = previous.stdout.decode("utf-8")
          start_marker = '          encoded = """\n'
          end_marker = '          """\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("M19 payload marker boundary failure")
          encoded = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          raw = base64.b64decode("".join(encoded.split()), validate=True)
          if len(raw) != 23400 or hashlib.sha256(raw).hexdigest() != PAYLOAD_SHA256:
              raise SystemExit("M19 payload integrity failure")

          root = Path(os.environ["M19_ROOT"])
          if root != Path("/tmp/frp_m19_creation") or root.is_symlink():
              raise SystemExit("unsafe M19_ROOT")
          if root.exists():
              if not root.is_dir():
                  raise SystemExit("invalid M19_ROOT")
              shutil.rmtree(root)
          root.mkdir(mode=0o700)

          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:bz2") as archive:
              members = archive.getmembers()
              names = tuple(member.name for member in members)
              if (
                  len(names) != 14
                  or names != tuple(sorted(names))
                  or names[0] != "bootstrap.py"
                  or sum(name.startswith("source/") for name in names) != 13
              ):
                  raise SystemExit("M19 payload boundary failure")
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or any(part in ("", ".", "..") for part in path.parts)
                      or not member.isfile()
                      or member.issym()
                      or member.islnk()
                  ):
                      raise SystemExit(f"unsafe payload member: {member.name}")
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"unreadable payload member: {member.name}")
                  target = root.joinpath(*path.parts)
                  target.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  with target.open("xb") as output:
                      output.write(stream.read())
                  os.chmod(
                      target,
                      0o700 if member.name == "bootstrap.py" else 0o600,
                  )
          print("M19_PAYLOAD=14/14 PASS")

          sys.path.insert(0, str(root))
          import bootstrap as m19

          original_install_sources = m19.install_sources

          def install_sources() -> None:
              original_install_sources()
              generated_workflow = m19.REPOSITORY / m19.SOURCE_PATHS[0]
              if generated_workflow.is_symlink() or not generated_workflow.is_file():
                  raise SystemExit("M19 generated workflow boundary failure")
              generated_workflow.unlink()

              producer = m19.REPOSITORY / "frp_m19_m16_evidence.py"
              old = (
                  'WORKFLOW = ".github/workflows/'
                  'frp-m19-machine-readable-m16-evidence.yml"'
              )
              new = (
                  'WORKFLOW = ".github/workflows/'
                  'frp-m19-create-machine-readable-m16-evidence.yml"'
              )
              producer_source = producer.read_text(encoding="utf-8")
              if producer_source.count(old) != 1:
                  raise SystemExit("M19 workflow source patch boundary failure")
              producer.write_text(
                  producer_source.replace(old, new),
                  encoding="utf-8",
              )

          def stage_commit_push() -> None:
              paths = (*m19.SOURCE_PATHS[1:], *m19.ARTIFACT_PATHS)
              m19.run(["git", "add", "--", *paths])
              staged = m19.run(
                  ["git", "diff", "--cached", "--name-only"],
                  capture=True,
              ).splitlines()
              if len(staged) != len(paths) or set(staged) != set(paths):
                  raise SystemExit("staged M19 path set mismatch")
              m19.run(["git", "diff", "--exit-code"])
              porcelain = m19.run(
                  ["git", "status", "--porcelain", "--untracked-files=all"],
                  capture=True,
              ).splitlines()
              if len(porcelain) != 22:
                  raise SystemExit("staged M19 status count mismatch")

              m19.run(["git", "config", "user.name", "github-actions[bot]"])
              m19.run([
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com",
              ])
              title = "Add M19 machine-readable M16 execution evidence"
              body = (
                  "Add deterministic RTL and FPGA-preparation evidence monitors, "
                  "Draft 2020-12 schemas, canonical execution artifacts, "
                  "qualification manifests, and tests.\n\n"
                  "M19 qualification: 37/37 PASS\n"
                  "M19 self-test: 20/20 PASS\n"
                  "Repository regression: 114/114 PASS"
              )
              m19.run(["git", "commit", "-m", title, "-m", body])
              commit = m19.run(
                  ["git", "rev-parse", "HEAD"],
                  capture=True,
              ).strip()
              branch = os.environ.get("GITHUB_REF_NAME")
              if branch != "main":
                  raise SystemExit("unexpected target branch")
              m19.run(["git", "push", "origin", f"HEAD:{branch}"])
              print(f"M19_COMMIT={commit}")

          m19.install_sources = install_sources
          m19.stage_commit_push = stage_commit_push
          m19.main()
          PY
