          lICYj9NNd0kHXzbI932K9ayLbgOgqvW2CB9t7cB5hIH/8XckU4UJA54ibmA=
          """
          encoded_text = "".join(encoded.split())
          expected_size = 16859
          expected_sha256 = "e865eeb60f36c0d98b5aaef95d3325887465de3a8445bb90f57faf2501c53887"

          def decode_exact(value):
              try:
                  candidate = base64.b64decode(value, validate=True)
              except (ValueError, base64.binascii.Error):
                  return None
              if (
                  len(candidate) == expected_size
                  and hashlib.sha256(candidate).hexdigest() == expected_sha256
              ):
                  return candidate
              return None

          raw = decode_exact(encoded_text)
          if raw is None:
              alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="
              prime = 1_000_003
              expected_length = 22480
              expected_sum = 661974
              expected_weighted_sum = 159728
              if len(encoded_text) != expected_length:
                  raise SystemExit("M23 payload integrity failure")
              invalid = [index for index, char in enumerate(encoded_text) if char not in alphabet]
              if len(invalid) > 1:
                  raise SystemExit("M23 payload integrity failure")
              if invalid:
                  position = invalid[0]
                  known = [alphabet.index(char) for char in encoded_text if char in alphabet]
                  original = (expected_sum - sum(known)) % prime
                  weighted_known = sum(
                      (index + 1) * alphabet.index(char)
                      for index, char in enumerate(encoded_text)
                      if char in alphabet
                  ) % prime
                  if (
                      original >= len(alphabet)
                      or ((position + 1) * original + weighted_known) % prime
                      != expected_weighted_sum
                  ):
                      raise SystemExit("M23 payload integrity failure")
              else:
                  values = [alphabet.index(char) for char in encoded_text]
                  delta = (expected_sum - sum(values)) % prime
                  weighted_delta = (
                      expected_weighted_sum
                      - sum((index + 1) * value for index, value in enumerate(values))
                  ) % prime
                  if delta == 0:
                      raise SystemExit("M23 payload integrity failure")
                  encoded_position = weighted_delta * pow(delta, -1, prime) % prime
                  if not 1 <= encoded_position <= len(encoded_text):
                      raise SystemExit("M23 payload integrity failure")
                  position = encoded_position - 1
                  original = (values[position] + delta) % prime
                  if original >= len(alphabet):
                      raise SystemExit("M23 payload integrity failure")
              repaired = (
                  encoded_text[:position]
                  + alphabet[original]
                  + encoded_text[position + 1:]
              )
              raw = decode_exact(repaired)
              if raw is None:
                  raise SystemExit("M23 payload integrity failure")
              print(f"M23_PAYLOAD_SINGLE_SYMBOL_REPAIRED={position + 1}")

          expected_members = (
              'bootstrap.py',
              'source',
              'source/frp_m23_clock_reset_cdc_interface_hardening.py',
              'source/rtl',
              'source/rtl/m23',
              'source/rtl/m23/frp_m23_csr_cdc_bridge.sv',
              'source/rtl/m23/frp_m23_hardened_integration_boundary.sv',
              'source/rtl/m23/frp_m23_hardened_integration_boundary_tb.sv',
              'source/rtl/m23/frp_m23_interface_protocol_assertions.sv',
              'source/rtl/m23/frp_m23_reset_release_sync.sv',
              'source/schemas',
              'source/schemas/m23',
              'source/schemas/m23/frp_m23_clock_reset_cdc_interface_contract.v2.5.0.schema.json',
              'source/schemas/m23/frp_m23_clock_reset_cdc_interface_hardening_manifest.v2.5.0.schema.json',
              'source/schemas/m23/frp_m23_clock_reset_cdc_interface_hardening_qualification.v2.5.0.schema.json',
              'source/schemas/m23/frp_m23_hardening_sequence_records.v2.5.0.schema.json',
              'source/schemas/m23/frp_m23_interface_protocol_assertion_report.v2.5.0.schema.json',
              'source/schemas/m23/frp_m23_schema_registry.json',
              'source/tests',
              'source/tests/test_frp_m23_clock_reset_cdc_interface_hardening.py',
          )
          root = Path(os.environ["M23_ROOT"])
          if root != Path("/tmp/frp_m23_creation") or root.is_symlink():
              raise SystemExit("unsafe M23_ROOT")
          if root.exists():
              if not root.is_dir():
                  raise SystemExit("invalid M23_ROOT")
              shutil.rmtree(root)
          root.mkdir(mode=0o700)

          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:bz2") as archive:
              members_found = archive.getmembers()
              names = tuple(member.name for member in members_found)
              if names != expected_members:
                  raise SystemExit("M23 payload member boundary failure")
              for member in members_found:
                  path = PurePosixPath(member.name)
                  if (
                      "\\" in member.name
                      or path.is_absolute()
                      or any(part in ("", ".", "..") for part in member.name.split("/"))
                      or member.issym()
                      or member.islnk()
                  ):
                      raise SystemExit(f"unsafe M23 payload member: {member.name}")
                  target = root.joinpath(*path.parts)
                  if member.isdir():
                      target.mkdir(mode=0o700, parents=True, exist_ok=True)
                      os.chmod(target, 0o700)
                      continue
                  if not member.isfile():
                      raise SystemExit(f"unsupported M23 payload member: {member.name}")
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"unreadable M23 payload member: {member.name}")
                  target.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  with target.open("xb") as output:
                      output.write(stream.read())
                  os.chmod(target, 0o700 if member.name == "bootstrap.py" else 0o600)
          print("M23_PAYLOAD=20/20 PASS")
          PY

      - name: Create qualify commit and validate complete M23 package
        shell: bash
        run: |
          set -euo pipefail
          python "${M23_ROOT}/bootstrap.py"

      - name: Retain M23 qualification logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frp-m23-hardening-reports
          path: /tmp/frp_m23_evidence/*
          if-no-files-found: warn
          retention-days: 90
