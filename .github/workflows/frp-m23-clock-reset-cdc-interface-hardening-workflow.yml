name: FRP M23 Clock Reset CDC Interface Hardening

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frp-m23-clock-reset-cdc-interface-hardening-workflow.yml"
      - "frp_m23_clock_reset_cdc_interface_hardening.py"
      - "rtl/m23/**"
      - "schemas/m23/**"
      - "artifacts/m23/**"
      - "tests/test_frp_m23_clock_reset_cdc_interface_hardening.py"
      - "rtl/m22/**"
      - "artifacts/m22/**"
      - "ROADMAP.md"
      - "MILESTONES.md"

permissions:
  contents: write

concurrency:
  group: frp-m23-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden-m23:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M23_ROOT: /tmp/frp_m23_creation
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact Python and RTL dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          sudo apt-get update
          sudo apt-get install --yes verilator g++
          python --version
          verilator --version
          g++ --version | head -n 1

