name: FRP M31D1 Validation Index v3.3.0

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m31d1-validation-index-v3-3-0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-validation-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_PATH: FRP_VALIDATION_INDEX_v3_3_0.md
      TARGET_BYTES: "12438"
      TARGET_LINES: "268"
      TARGET_SHA256: d9cc92a9a51797d536875710933109a42f24120739c8e2960d82205dbb785d3b
      PAYLOAD_GZIP_BYTES: "4911"
      PAYLOAD_GZIP_SHA256: 06c87ed0931c7b971e14593ae562440bbdfdbb1985cbb9f3d7c5b52493dacb31
      PAYLOAD_BASE64_LENGTH: "6548"
      PAYLOAD_BASE64_SHA256: bf800ab6f350cf9f53bf60c781608bb794a433a8c60da7902457660fb804139d
      ARTIFACTS_FILES: "127"
      ARTIFACTS_INVENTORY_SHA256: 0d86a8c50c86ba0196f635903cb8cc8d635dd1399787625f7619ad4dd8121f2b
      BENCHMARKS_FILES: "19"
      BENCHMARKS_INVENTORY_SHA256: 54dc4ae9aa858ccd60f577367be909abf1266b76fcefe10c8223e1f22cc78670
      SCHEMAS_FILES: "125"
      SCHEMAS_INVENTORY_SHA256: 384cede6b31eea78b9e85804405d7d8bb3bec42e0ce8489d3f9ed20d36f213d9
      HISTORICAL_RECORDS: "48"
      HISTORICAL_INVENTORY_SHA256: 7903e5b9e7b404770a434fa22c9bd6ae76fb062136f6e0b7fa2233dc0b3127f5
      REQUIREMENTS_PATH: requirements.txt
      REQUIREMENTS_BYTES: "33"
      REQUIREMENTS_SHA256: 75b9bd6237473a063c852298fee983bdfcf550cb1cc828a237afaf726cccc3c7
      M31_SOURCE_PATH: frp_m31_phase_interference_thermal_evidence.py
      M31_SOURCE_BYTES: "42092"
      M31_SOURCE_SHA256: 1e4ccfd7b157cd2bac609c34dfec9da791653a31af7b29b75502c755807b9c62
      M31_TEST_PATH: tests/test_frp_m31_phase_interference_thermal_evidence.py
      M31_TEST_BYTES: "22370"
      M31_TEST_SHA256: f64214a9c785d8cf579e3a6a5afa6e364772d8972775cc010a3dba89d852c1ed
      M31_SCHEMA_PATH: schemas/m31/frp.m31.phase_interference_active_zero_thermal_evidence.v1.schema.json
      M31_SCHEMA_BYTES: "1468"
      M31_SCHEMA_SHA256: 53d79d45d70753ccd24c3dc4c97af6fee481f86a9d7cdca7ef78b486c76479f7
      M31_EVIDENCE_PATH: artifacts/m31/evidence/m31-phase-interference-active-zero-thermal-evidence.json
      M31_EVIDENCE_BYTES: "39993"
      M31_EVIDENCE_SHA256: bdaa676acbfb09d86d848070e8a2673c5ce6902657a0b13b2e4293383bec8b42
      M31_MANIFEST_PATH: artifacts/m31/manifests/m31-phase-interference-active-zero-thermal-evidence-manifest.json
      M31_MANIFEST_BYTES: "828"
      M31_MANIFEST_SHA256: 80f0841d0041cd22c2f76175b6139e601aede7b69823356ae1fefbce5f793e7c
      M31_QUALIFICATION_PATH: artifacts/m31/qualification/m31-phase-interference-active-zero-thermal-evidence-qualification.json
      M31_QUALIFICATION_BYTES: "1512"
      M31_QUALIFICATION_SHA256: 4c2446f954e01ec0aa37cc6c0fc70cf4a87ec565c450628e31b0efcac9160224
      M30_ARCHIVE_PATH: artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
      M30_ARCHIVE_BYTES: "10189989"
      M30_ARCHIVE_SHA256: 05ea33f6f3f505d315af930c2d51779f7189905308473f32a57375e477069caa
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ github.ref_name }}" = "main"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          echo "Manual main-branch boundary: PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Snapshot all protected histories
        shell: bash
        run: |
          set -euo pipefail

          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }

          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' ! -name "$TARGET_PATH" -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }

          tree_inventory artifacts > /tmp/m31d1-artifacts.before
          tree_inventory benchmarks > /tmp/m31d1-benchmarks.before
          tree_inventory schemas > /tmp/m31d1-schemas.before
          historical_inventory > /tmp/m31d1-history.before

          if test ! -e "$TARGET_PATH"; then
            test "$(wc -l < /tmp/m31d1-artifacts.before)" -eq "$ARTIFACTS_FILES"
            test "$(sha256sum /tmp/m31d1-artifacts.before | cut -d' ' -f1)" = "$ARTIFACTS_INVENTORY_SHA256"
            test "$(wc -l < /tmp/m31d1-benchmarks.before)" -eq "$BENCHMARKS_FILES"
            test "$(sha256sum /tmp/m31d1-benchmarks.before | cut -d' ' -f1)" = "$BENCHMARKS_INVENTORY_SHA256"
            test "$(wc -l < /tmp/m31d1-schemas.before)" -eq "$SCHEMAS_FILES"
            test "$(sha256sum /tmp/m31d1-schemas.before | cut -d' ' -f1)" = "$SCHEMAS_INVENTORY_SHA256"
            test "$(wc -l < /tmp/m31d1-history.before)" -eq "$HISTORICAL_RECORDS"
            test "$(sha256sum /tmp/m31d1-history.before | cut -d' ' -f1)" = "$HISTORICAL_INVENTORY_SHA256"
          else
            test -f "$TARGET_PATH"
            test ! -L "$TARGET_PATH"
            test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
            test "$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)" = "$TARGET_SHA256"
          fi

          echo "Protected evidence and benchmark histories snapshotted: PASS"

      - name: Verify exact M30 and M31 functional boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          exact = (
              (os.environ["REQUIREMENTS_PATH"], int(os.environ["REQUIREMENTS_BYTES"]), os.environ["REQUIREMENTS_SHA256"]),
              (os.environ["M31_SOURCE_PATH"], int(os.environ["M31_SOURCE_BYTES"]), os.environ["M31_SOURCE_SHA256"]),
              (os.environ["M31_TEST_PATH"], int(os.environ["M31_TEST_BYTES"]), os.environ["M31_TEST_SHA256"]),
              (os.environ["M31_SCHEMA_PATH"], int(os.environ["M31_SCHEMA_BYTES"]), os.environ["M31_SCHEMA_SHA256"]),
              (os.environ["M31_EVIDENCE_PATH"], int(os.environ["M31_EVIDENCE_BYTES"]), os.environ["M31_EVIDENCE_SHA256"]),
              (os.environ["M31_MANIFEST_PATH"], int(os.environ["M31_MANIFEST_BYTES"]), os.environ["M31_MANIFEST_SHA256"]),
              (os.environ["M31_QUALIFICATION_PATH"], int(os.environ["M31_QUALIFICATION_BYTES"]), os.environ["M31_QUALIFICATION_SHA256"]),
              (os.environ["M30_ARCHIVE_PATH"], int(os.environ["M30_ARCHIVE_BYTES"]), os.environ["M30_ARCHIVE_SHA256"]),
          )

          for path_text, expected_bytes, expected_sha256 in exact:
              path = Path(path_text)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"required regular file is missing: {path}")
              raw = path.read_bytes()
              observed = len(raw), hashlib.sha256(raw).hexdigest()
              expected = expected_bytes, expected_sha256
              if observed != expected:
                  raise SystemExit(f"functional-boundary mismatch: {path}")

          workflows = {
              ".github/workflows/frp-m31a1-phase-interference-thermal-evidence-source-part-1-workflow.yml": (14081, "e24f8de99c1a93c454f3180e133a20c6d495f11c221bd7c3c59930ada844ba27"),
              ".github/workflows/frp-m31a2-phase-interference-thermal-evidence-source-part-2-workflow.yml": (16053, "7dd5e6702e02427354db80ab1cc11dc98e67d40e69c3745174ec7cba2a962e6d"),
              ".github/workflows/frp-m31a3-phase-interference-thermal-evidence-source-assembly-workflow.yml": (15191, "4f9c95b6411a5c7ae47a46df2c980feca91039d71f46ee3e014355cfd58a7649"),
              ".github/workflows/frp-m31b1-phase-interference-thermal-evidence-test-part-1-workflow.yml": (13304, "387270d58a29889bfcca1c41c6f460d958858092ae60748de0e9005dc65a1dfd"),
              ".github/workflows/frp-m31b2-phase-interference-thermal-evidence-test-part-2-workflow.yml": (19735, "b8ad399a8aef858aa18028e7519a7d336f10f5984ca84808852c9e21ec4af85a"),
              ".github/workflows/frp-m31b3-phase-interference-thermal-evidence-test-assembly-workflow.yml": (12763, "04c21e9d003ab27f1285e0cbe65cc7f10ff91509c945ad215273e5aff7afc597"),
              ".github/workflows/frp-m31c-phase-interference-thermal-evidence-publication-workflow.yml": (25808, "16bd797c84a966852a1e9859ac2610b9082b998bae82f9dbe94975d9e6baf250"),
              ".github/workflows/frp-m31-complete.yml": (11762, "eed979a2b7e795b73facd628d49bf76993ed1fc7e37a8e0dd613d92fae4e751b"),
          }
          for path_text, expected in workflows.items():
              path = Path(path_text)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"M31 workflow is missing: {path}")
              raw = path.read_bytes()
              observed = len(raw), hashlib.sha256(raw).hexdigest()
              if observed != expected:
                  raise SystemExit(f"M31 workflow identity mismatch: {path}")

          print("Exact M30 and M31 functional boundary: PASS")
          PY

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$REQUIREMENTS_PATH"

      - name: Run all 60 M31 qualification tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_frp_m31_phase_interference_thermal_evidence -v 2>&1 | tee /tmp/m31d1-tests.log
          grep -F "Ran 60 tests" /tmp/m31d1-tests.log
          grep -Fx "OK" /tmp/m31d1-tests.log

