          test "$(wc -c < "$compact")" -eq "$PAYLOAD_BASE64_LENGTH"
          test "$(sha256sum "$compact" | cut -d' ' -f1)" = "$PAYLOAD_BASE64_SHA256"
          base64 --decode "$compact" > "$payload"
          test "$(wc -c < "$payload")" -eq "$PAYLOAD_GZIP_BYTES"
          test "$(sha256sum "$payload" | cut -d' ' -f1)" = "$PAYLOAD_GZIP_SHA256"
          gzip --decompress --stdout "$payload" > "$rendered"
          test "$(wc -c < "$rendered")" -eq "$TARGET_BYTES"
          test "$(wc -l < "$rendered")" -eq "$TARGET_LINES"
          test "$(sha256sum "$rendered" | cut -d' ' -f1)" = "$TARGET_SHA256"
          install -m 0644 "$rendered" "$TARGET_PATH"
          echo "Additive v3.3.0 validation index installed: PASS"

      - name: Qualify validation-index content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          target = Path(os.environ["TARGET_PATH"])
          raw = target.read_bytes()
          if len(raw) != int(os.environ["TARGET_BYTES"]):
              raise SystemExit("validation-index byte mismatch")
          if hashlib.sha256(raw).hexdigest() != os.environ["TARGET_SHA256"]:
              raise SystemExit("validation-index digest mismatch")
          if not raw.endswith(bytes([10])) or raw.endswith(bytes([10, 10])):
              raise SystemExit("validation-index newline mismatch")
          text = raw.decode("utf-8")

          evidence = json.loads(Path(os.environ["M31_EVIDENCE_PATH"]).read_text(encoding="utf-8"))
          qualification = json.loads(Path(os.environ["M31_QUALIFICATION_PATH"]).read_text(encoding="utf-8"))
          if evidence["milestone"] != "M31" or evidence["status"] != "PASS":
              raise SystemExit("M31 evidence identity mismatch")
          if len(evidence["provenance"]) != 12:
              raise SystemExit("M31 provenance count mismatch")
          if qualification["status"] != "PASS":
              raise SystemExit("M31 qualification status mismatch")
          if len(qualification["checks"]) != 13 or not all(qualification["checks"].values()):
              raise SystemExit("M31 qualification checks mismatch")

          required = (
              "FRP v3.3.0",
              "M31 — Phase-Interference, Active-Zero, and Thermal-Evidence Publication",
              "60 / 60 PASS",
              "No existing evidence, benchmark, schema, workflow",
              "0d86a8c50c86ba0196f635903cb8cc8d635dd1399787625f7619ad4dd8121f2b",
              "54dc4ae9aa858ccd60f577367be909abf1266b76fcefe10c8223e1f22cc78670",
              "384cede6b31eea78b9e85804405d7d8bb3bec42e0ce8489d3f9ed20d36f213d9",
              "7903e5b9e7b404770a434fa22c9bd6ae76fb062136f6e0b7fa2233dc0b3127f5",
              "actual direct events | `0`",
              "direct opposite-polarity transitions | `0`",
              "physical temperature measurement | `false`",
              "downstream metric normalization",
              "downstream semantic reimplementation",
              "downstream FRP source mutation",
              "downstream writeback",
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"validation-index claims missing: {missing}")

          forbidden = "-1/0/" + chr(43) + "1"
          if forbidden in text:
              raise SystemExit("forbidden ternary notation in validation index")

          for item in evidence["provenance"]:
              if f"`{item['path']}`" not in text:
                  raise SystemExit(f"provenance path missing: {item['path']}")
              if f"`{item['raw_sha256']}`" not in text:
                  raise SystemExit(f"provenance digest missing: {item['path']}")

          print("FRP v3.3.0 validation-index content: PASS")
          PY

      - name: Prove all prior histories are byte-identical
        shell: bash
        run: |
          set -euo pipefail

          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }

          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' ! -name "$TARGET_PATH" -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }

          tree_inventory artifacts > /tmp/m31d1-artifacts.after
          tree_inventory benchmarks > /tmp/m31d1-benchmarks.after
          tree_inventory schemas > /tmp/m31d1-schemas.after
          historical_inventory > /tmp/m31d1-history.after

          cmp --silent /tmp/m31d1-artifacts.before /tmp/m31d1-artifacts.after
          cmp --silent /tmp/m31d1-benchmarks.before /tmp/m31d1-benchmarks.after
          cmp --silent /tmp/m31d1-schemas.before /tmp/m31d1-schemas.after
          cmp --silent /tmp/m31d1-history.before /tmp/m31d1-history.after
          echo "All prior evidence, benchmark, schema, and release histories: BYTE-IDENTICAL"

      - name: Verify only the new validation index changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          untracked="$(git ls-files --others --exclude-standard)"
          if test -n "$changed" && test "$changed" != "$TARGET_PATH"; then
            echo "Unexpected changed paths: $changed" >&2
            exit 1
          fi
          if test -n "$untracked" && test "$untracked" != "$TARGET_PATH"; then
            echo "Unexpected untracked paths: $untracked" >&2
            exit 1
          fi
          echo "Single additive file boundary: PASS"

      - name: Commit and publish the validation index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          staged="$(git diff --cached --name-only)"
          if test -z "$staged"; then
            test -z "$(git status --porcelain)"
            echo "FRP v3.3.0 validation index is already published."
            exit 0
          fi
          test "$staged" = "$TARGET_PATH"
          git commit -m "Add FRP v3.3.0 M31 validation index"
          git push origin HEAD:main

      - name: Verify published state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
          test "$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)" = "$TARGET_SHA256"
          echo "FRP M31D1 validation index v3.3.0: PASS"
          {
            echo "## FRP M31D1 Validation Index v3.3.0"
            echo
            echo "- New file: FRP_VALIDATION_INDEX_v3_3_0.md"
            echo "- M31 tests: 60 / 60 PASS"
            echo "- Existing histories: byte-identical"
            echo "- Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
