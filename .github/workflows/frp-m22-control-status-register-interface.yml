name: FRP M22 Control Status Register Interface

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frp-m22-control-status-register-interface.yml"
      - "frp_m22_control_status_register_interface.py"
      - "rtl/m22/**"
      - "schemas/m22/**"
      - "artifacts/m22/**"
      - "tests/test_frp_m22_control_status_register_interface.py"
      - "rtl/m16/**"
      - "artifacts/m21/**"
      - "ROADMAP.md"
      - "MILESTONES.md"

permissions:
  contents: write

concurrency:
  group: frp-m22-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-m22:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M22_ROOT: /tmp/frp_m22_creation
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact Python and RTL dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          sudo apt-get update
          sudo apt-get install --yes verilator g++
          python --version
          verilator --version
          g++ --version | head -n 1

