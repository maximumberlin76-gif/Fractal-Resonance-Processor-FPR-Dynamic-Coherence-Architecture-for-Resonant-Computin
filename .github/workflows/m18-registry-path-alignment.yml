name: M18 One-Time Registry Path Alignment

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m18-one-time-registry-path-alignment
  cancel-in-progress: false

jobs:
  align-registry-paths:
    name: Align M18 registry paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Align paths and recompute registry digest
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          from jsonschema import Draft202012Validator


          REGISTRY_PATH = Path("schemas/m18/frp_m18_schema_registry.json")
          REGISTRY_SCHEMA_PATH = Path(
              "schemas/m18/"
              "frp.m18.formal_schema_registry.v2.0.0.schema.json"
          )
          MANIFEST_SCHEMA_PATH = Path(
              "schemas/m18/"
              "frp.m18.canonical_artifact_manifest.v2.0.0.schema.json"
          )
          OLD_DIGEST = (
              "3dcc740bfe264190f00375de65f8d5aeb917e94d2b91012faff9fb7dff441d18"
          )
          EXPECTED_DIGEST = (
              "6d2d0077b00c9f3da04429a8a690256fe7b4de585c7257804471a3d3d4992c0c"
          )
          REPLACEMENTS = {
              (
                  "artifacts/m18/structured_output/"
                  "structured-output-trace-free.json"
              ): "artifacts/m18/structured_output/trace-free.json",
              (
                  "artifacts/m18/structured_output/"
                  "structured-output-trace-7-1.json"
              ): "artifacts/m18/structured_output/trace-7-1.json",
              (
                  "artifacts/m18/structured_output/"
                  "structured-output-trace-1-7.json"
              ): "artifacts/m18/structured_output/trace-1-7.json",
              (
                  "artifacts/m18/structured_output/self-test.json"
              ): "artifacts/m18/structured_output/self-test-default.json",
          }


          def reject_duplicate_keys(
              pairs: list[tuple[str, object]],
          ) -> dict[str, object]:
              result: dict[str, object] = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result


          def load_json(path: Path) -> dict[str, object]:
              value = json.loads(
                  path.read_bytes().decode("utf-8"),
                  object_pairs_hook=reject_duplicate_keys,
              )
              if not isinstance(value, dict):
                  raise ValueError(f"{path} root must be an object")
              return value


          registry = load_json(REGISTRY_PATH)
          if registry.get("registry_content_sha256") != OLD_DIGEST:
              raise ValueError("unexpected starting registry digest")

          records = registry.get("records")
          if not isinstance(records, list) or len(records) != 24:
              raise ValueError("registry must contain exactly 24 records")

          structured_records = [
              record
              for record in records
              if isinstance(record, dict)
              and record.get("schema_identifier")
              == "frp.structured_output.v1.7.0"
          ]
          if len(structured_records) != 1:
              raise ValueError(
                  "structured-output registry record is not unique"
              )

          record = structured_records[0]
          paths = record.get("canonical_artifact_paths")
          if not isinstance(paths, list) or not all(
              isinstance(path, str) for path in paths
          ):
              raise ValueError(
                  "canonical_artifact_paths must be a string array"
              )
          if not set(REPLACEMENTS).issubset(paths):
              raise ValueError(
                  "expected legacy structured-output paths are absent"
              )

          aligned_paths = [
              REPLACEMENTS.get(path, path)
              for path in paths
          ]
          if len(aligned_paths) != 11 or len(set(aligned_paths)) != 11:
              raise ValueError(
                  "aligned structured-output path set is not exact"
              )
          record["canonical_artifact_paths"] = aligned_paths

          manifest_schema = load_json(MANIFEST_SCHEMA_PATH)
          prefix_items = (
              manifest_schema["$defs"]["artifactRecords"]["prefixItems"]
          )
          manifest_paths = {
              item["properties"]["repository_path"]["const"]
              for item in prefix_items
          }
          if not set(aligned_paths).issubset(manifest_paths):
              raise ValueError(
                  "aligned paths do not match the formal manifest schema"
              )

          digest_view = dict(registry)
          digest_view.pop("registry_content_sha256", None)
          compact = json.dumps(
              digest_view,
              ensure_ascii=False,
              allow_nan=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          digest = hashlib.sha256(compact).hexdigest()
          if digest != EXPECTED_DIGEST:
              raise ValueError(
                  f"unexpected aligned registry digest: {digest}"
              )
          registry["registry_content_sha256"] = digest

          registry_schema = load_json(REGISTRY_SCHEMA_PATH)
          Draft202012Validator.check_schema(registry_schema)
          Draft202012Validator(registry_schema).validate(registry)

          serialized = (
              json.dumps(
                  registry,
                  ensure_ascii=False,
                  allow_nan=False,
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          ).encode("utf-8")
          temporary_path = REGISTRY_PATH.with_suffix(".json.tmp")
          temporary_path.write_bytes(serialized)
          os.replace(temporary_path, REGISTRY_PATH)
          print(f"Aligned registry digest: {digest}")
          PY

      - name: Verify resulting file
        shell: bash
        run: |
          python -m json.tool schemas/m18/frp_m18_schema_registry.json >/dev/null
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M schemas/m18/frp_m18_schema_registry.json$')"

      - name: Remove one-time workflow
        run: rm .github/workflows/m18-registry-path-alignment.yml

      - name: Commit aligned registry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/m18/frp_m18_schema_registry.json
          git add .github/workflows/m18-registry-path-alignment.yml
          git commit -m "Align M18 structured artifact paths" -m "Match the formal manifest schema, recompute the deterministic registry digest, and remove the completed one-time workflow."
          git push origin HEAD:main
