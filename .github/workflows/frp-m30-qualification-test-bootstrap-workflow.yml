name: FRP M30 Qualification Test Bootstrap Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m30-qualification-test-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-m30-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      M30_SOURCE_COMMIT: ff3dd434da5dcbd9e8fa62444f658ed4c495b540
      M30_SOURCE_PATH: frp_m30_reproducibility_qualification_archival_closure.py
      M30_SOURCE_SHA256: 764b82eace9d90b79d7955a80c571e9e4d22de395d2e5b6ee4d38e910af0c870
      M30_TEST_PATH: tests/test_frp_m30_reproducibility_qualification_archival_closure.py
      M30_TEST_SHA256: 170baba6ff3e498c13f75307f434b63e2e27ec8f3a7ef88ce029d20ef847a587
      M30_TEST_BZ2_SHA256: 954c88aa42ca60a750a2c7d43b6a68fe42cb9a99aea9788cc7bb403baf907d12
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate the committed M30 producer and M29 ancestry
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${M30_SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$M30_SOURCE_COMMIT" HEAD
          test "$(git show -s --format=%s "$M30_SOURCE_COMMIT")" = \
            "Add M29 system integration and downstream compatibility closure"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          source = Path(os.environ["M30_SOURCE_PATH"])
          if not source.is_file() or source.is_symlink():
              raise SystemExit("M30 producer source is missing")
          raw = source.read_bytes()
          if hashlib.sha256(raw).hexdigest() != os.environ["M30_SOURCE_SHA256"]:
              raise SystemExit("M30 producer source digest mismatch")
          compile(raw, str(source), "exec")
          forbidden = "-1/0/" + "+1"
          if forbidden in raw.decode("utf-8"):
              raise SystemExit("forbidden ternary notation in M30 producer")
          print("Committed M30 producer source: PASS")
          PY

      - name: Restore and validate the complete M30 qualification test
        shell: bash
        run: |
          set -euo pipefail
          install -d /tmp/frp_m30_test_bootstrap
