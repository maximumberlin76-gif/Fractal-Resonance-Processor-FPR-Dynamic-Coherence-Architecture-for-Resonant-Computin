          import bz2
          import hashlib
          import os
          from pathlib import Path

          compressed_path = Path("/tmp/frp_m30_test_bootstrap/test.py.bz2")
          compressed = compressed_path.read_bytes()
          if hashlib.sha256(compressed).hexdigest() != os.environ["M30_TEST_BZ2_SHA256"]:
              raise SystemExit("M30 test compressed digest mismatch")
          try:
              raw = bz2.decompress(compressed)
          except OSError as exc:
              raise SystemExit("M30 test bzip2 validation failed") from exc
          if hashlib.sha256(raw).hexdigest() != os.environ["M30_TEST_SHA256"]:
              raise SystemExit("M30 test source digest mismatch")
          destination = Path(os.environ["M30_TEST_PATH"])
          if destination.exists() and destination.is_symlink():
              raise SystemExit("refusing M30 test symlink destination")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(raw)
          if destination.stat().st_size != 16022:
              raise SystemExit("M30 test byte count mismatch")
          compile(raw, str(destination), "exec")
          text = raw.decode("utf-8")
          forbidden = "-1/0/" + "+1"
          if forbidden in text:
              raise SystemExit("forbidden ternary notation in M30 test")
          required = (
              'self.assertEqual(m30.CORE["balanced_ternary_notation"], "-1/0/1")',
              'self.assertEqual(m30.CORE["temporal_scheduler_modes"], ["1/7", "7/1"])',
              'self.assertEqual(m30.CORE["service_scheduler_mode"], "free")',
              '"FRP-Trace-Observatory"',
              'self.assertEqual(value["record_count"], 40)',
              'self.assertEqual(self.summary["generated_path_count"], 38)',
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f"M30 test boundary missing: {missing}")
          print("M30 qualification test restored: PASS")
          PY

      - name: Commit and publish only the M30 qualification test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$M30_TEST_PATH"
          if git diff --cached --quiet; then
            echo "M30 qualification test is already committed; no commit is required."
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "$M30_TEST_PATH"
          git commit \
            -m "Add M30 reproducibility qualification test" \
            -m "Add the integrity-verified M30 qualification test for deterministic generation, complete regression, archival verification, the immutable -1/0/1 core, active neutral state 0, schedulers 1/7 and 7/1, separate free service mode, and the FRP Trace Observatory one-way read-only boundary."
          git push origin HEAD:main
