          marker = "# Contributing — Fractal Resonance Processor (FRP)\n\n".encode("utf-8")
          if not source.startswith(marker) or source.count(marker) != 1:
              raise SystemExit("CONTRIBUTING.md insertion boundary mismatch")
          rendered = marker + block + source[len(marker):]
          expected = (int(os.environ["TARGET_BYTES"]), os.environ["TARGET_SHA256"])
          if (len(rendered), hashlib.sha256(rendered).hexdigest()) != expected:
              raise SystemExit("rendered CONTRIBUTING.md identity mismatch")
          if rendered.count(b"\n") != int(os.environ["TARGET_LINES"]):
              raise SystemExit("rendered CONTRIBUTING.md line-count mismatch")
          Path("/tmp/CONTRIBUTING.md").write_bytes(rendered)
          PY

