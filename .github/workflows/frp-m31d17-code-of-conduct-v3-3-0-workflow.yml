      - name: Qualify conduct controls and preservation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path

          raw = Path(os.environ["TARGET_PATH"]).read_bytes()
          expected = (int(os.environ["TARGET_BYTES"]), os.environ["TARGET_SHA256"])
          if (len(raw), hashlib.sha256(raw).hexdigest()) != expected:
              raise SystemExit("CODE_OF_CONDUCT.md target identity mismatch")

          marker = b"# Code of Conduct\n\n"
          block_end = len(marker) + int(os.environ["BLOCK_BYTES"])
          current = raw[len(marker):block_end]
          reconstructed = raw[:len(marker)] + raw[block_end:]
          source_expected = (int(os.environ["SOURCE_BYTES"]), os.environ["SOURCE_SHA256"])
          if (len(reconstructed), hashlib.sha256(reconstructed).hexdigest()) != source_expected:
              raise SystemExit("historical CODE_OF_CONDUCT.md bytes were not preserved")

          text = raw.decode("utf-8")
          required = (
              "## Current Conduct Boundary — FRP v3.3.0 / M31",
              "-1/0/1",
              "60 / 60 PASS",
              "## Technical Discussion Standard",
              "## Evidence and Provenance Conduct",
              "## SystemVerilog Review Conduct",
              "## GitHub Actions Conduct",
              "The interchange is one-way and read-only",
              "## Security, Privacy, and Restricted Material",
              "## Preserved Code-of-Conduct Record Through M16",
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f"CODE_OF_CONDUCT.md records missing: {missing}")
          if "-1/0/" + chr(43) + "1" in text:
              raise SystemExit("forbidden ternary notation present")

          links = re.findall(r"\]\(([^)]+)\)", current.decode("utf-8"))
          if len(links) != 30 or len(set(links)) != 30:
              raise SystemExit("conduct link registry count mismatch")
          missing_links = []
          for value in sorted(set(links)):
              target = Path(value.rstrip("/"))
              valid = target.is_dir() if value.endswith("/") else target.is_file()
              if not valid:
                  missing_links.append(value)
          if missing_links:
              raise SystemExit(f"CODE_OF_CONDUCT.md link targets missing: {missing_links}")

          changed = subprocess.check_output(["git", "diff", "--name-only"]).decode().splitlines()
          if changed not in ([os.environ["TARGET_PATH"]], []):
              raise SystemExit(f"unexpected worktree changes: {changed}")
          print("CODE_OF_CONDUCT.md M31 controls and historical preservation: PASS")
          PY

          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          tree_inventory artifacts > /tmp/m31d17-artifacts.after
          tree_inventory benchmarks > /tmp/m31d17-benchmarks.after
          tree_inventory schemas > /tmp/m31d17-schemas.after
          historical_inventory > /tmp/m31d17-history.after
          cmp --silent /tmp/m31d17-artifacts.before /tmp/m31d17-artifacts.after
          cmp --silent /tmp/m31d17-benchmarks.before /tmp/m31d17-benchmarks.after
          cmp --silent /tmp/m31d17-schemas.before /tmp/m31d17-schemas.after
          cmp --silent /tmp/m31d17-history.before /tmp/m31d17-history.after
          echo "Evidence, benchmark, schema, and release histories: BYTE-IDENTICAL"

      - name: Commit and publish CODE_OF_CONDUCT.md
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          if git diff --cached --quiet; then
            test -z "$(git status --porcelain)"
            echo "Complete M31 CODE_OF_CONDUCT.md is already published."
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "$TARGET_PATH"
          git commit -m "Align CODE_OF_CONDUCT.md with FRP v3.3.0 M31"
          git push origin HEAD:main

      - name: Verify published state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
          test "$(wc -l < "$TARGET_PATH")" -eq "$TARGET_LINES"
          test "$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)" = "$TARGET_SHA256"
          {
            echo "## FRP M31D17 Code of Conduct v3.3.0"
