          block = Path("/tmp/m31d17-code-of-conduct-current.md").read_bytes()
          marker = b"# Code of Conduct\n\n"
          if not source.startswith(marker) or source.count(marker) != 1:
              raise SystemExit("CODE_OF_CONDUCT.md insertion boundary mismatch")
          rendered = marker + block + source[len(marker):]
          expected = (int(os.environ["TARGET_BYTES"]), os.environ["TARGET_SHA256"])
          if (len(rendered), hashlib.sha256(rendered).hexdigest()) != expected:
              raise SystemExit("rendered CODE_OF_CONDUCT.md identity mismatch")
          if rendered.count(b"\n") != int(os.environ["TARGET_LINES"]):
              raise SystemExit("rendered CODE_OF_CONDUCT.md line-count mismatch")
          Path("/tmp/CODE_OF_CONDUCT.md").write_bytes(rendered)
          PY

