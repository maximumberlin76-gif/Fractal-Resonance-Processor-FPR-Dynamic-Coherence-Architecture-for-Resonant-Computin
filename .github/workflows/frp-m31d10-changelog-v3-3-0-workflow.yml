            echo "- Release chronology: M0 through M31"
            echo "- Added release entries: M17 through M29 and M31"
            echo "- Existing changelog history: byte-identical"
            echo "- M31 focused tests: 60 / 60 PASS"
            echo "- Evidence and benchmark histories: byte-identical"
