      - name: Qualify CHANGELOG.md content and preserved history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          path = Path(os.environ["TARGET_PATH"])
          raw = path.read_bytes()
          expected = (int(os.environ["TARGET_BYTES"]), os.environ["TARGET_SHA256"])
          observed = (len(raw), hashlib.sha256(raw).hexdigest())
          if observed != expected:
              raise SystemExit("CHANGELOG.md target identity mismatch")
          if raw.count(b"\n") != int(os.environ["TARGET_LINES"]):
              raise SystemExit("CHANGELOG.md line-count mismatch")

          m31 = b"## [v3.3.0] \xe2\x80\x94 M31 Phase-Interference, Active-Zero, and Thermal-Evidence Publication\n"
          m30 = b"## [v3.2.0] \xe2\x80\x94 M30 Reproducibility, Qualification, and Archival Release Closure\n"
          m29 = b"## [v3.1.0] \xe2\x80\x94 M29 System Integration and Downstream Compatibility Closure\n"
          m16 = b"## [v1.8.0] \xe2\x80\x94 M16 RTL Core Realization and Execution Semantics Package\n"
          positions = tuple(raw.index(marker) for marker in (m31, m30, m29, m16))
          if positions != tuple(sorted(positions)):
              raise SystemExit("CHANGELOG.md release order mismatch")
          reconstructed_source = raw[:positions[0]] + raw[positions[1]:positions[2]] + raw[positions[3]:]
          source_identity = (
              len(reconstructed_source),
              hashlib.sha256(reconstructed_source).hexdigest(),
          )
          expected_source = (
              int(os.environ["SOURCE_BYTES"]),
              os.environ["SOURCE_SHA256"],
          )
          if source_identity != expected_source:
              raise SystemExit("historical CHANGELOG.md bytes were not preserved")

          text = raw.decode("utf-8")
          headings = (
              "## [v3.3.0] — M31 Phase-Interference, Active-Zero, and Thermal-Evidence Publication",
              "## [v3.2.0] — M30 Reproducibility, Qualification, and Archival Release Closure",
              "## [v3.1.0] — M29 System Integration and Downstream Compatibility Closure",
              "## [v3.0.0] — M28 Hierarchical Scaling, Hotspot Containment, and Observatory Interchange",
              "## [v2.9.0] — M27 Long-Run Stability and Telemetry Qualification",
              "## [v2.8.0] — M26 Declared-Target Implementation Evidence",
              "## [v2.7.0] — M25 Fault, Negative-Path, and Recovery Qualification",
              "## [v2.6.0] — M24 Formal and Bounded Verification Closure",
              "## [v2.5.0] — M23 Clock, Reset, CDC, and Interface Hardening",
              "## [v2.4.0] — M22 Control, Status, and Register Interface Realization",
              "## [v2.3.0] — M21 Parameterized Qualification Matrix",
              "## [v2.2.0] — M20 Cross-Layer Deterministic Correlation",
              "## [v2.1.0] — M19 Machine-Readable M16 Execution and Qualification Evidence",
              "## [v2.0.0] — M18 Formal Schema and Canonical Artifact Publication",
              "## [v1.9.0] — M17 Published Artifact Integration Contract",
              "## [v1.8.0] — M16 RTL Core Realization and Execution Semantics Package",
          )
          offsets = []
          for heading in headings:
              if text.count(heading) != 1:
                  raise SystemExit(f"CHANGELOG.md heading count mismatch: {heading}")
              offsets.append(text.index(heading))
          if offsets != sorted(offsets):
              raise SystemExit("CHANGELOG.md milestone sequence mismatch")

          required = (
              "60 / 60 PASS",
              "13 / 13 PASS",
              "4 / 4 exact",
              "55 / 55 PASS",
              "-1/0/1",
              "-1 → 0 → 1",
              "1 → 0 → -1",
              "FRP published bytes → FRP-Trace-Observatory",
              "187 / 187 PASS",
              "37 / 37 PASS",
              "39 / 39 PASS",
              "48 / 48 PASS",
              "60 / 60 PASS",
              "72 / 72 PASS",
              "76 / 76 PASS",
              "105 / 105 PASS",
              "70 / 70 PASS",
              "69 / 69 PASS",
              "59 / 59 PASS",
              "docs/m17_published_artifact_integration_qualification.md",
              "artifacts/m29/manifests/m29-system-integration-qualification.json",
              "artifacts/m31/",
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f"CHANGELOG.md required records missing: {missing}")
          forbidden = ("-1/0/" + chr(43) + "1",)
          present = [value for value in forbidden if value in text]
          if present:
              raise SystemExit(f"CHANGELOG.md forbidden notation present: {present}")
          print("CHANGELOG.md M0-M31 continuity and historical-byte preservation: PASS")
          PY

      - name: Prove protected histories are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          tree_inventory artifacts > /tmp/m31d10-artifacts.after
          tree_inventory benchmarks > /tmp/m31d10-benchmarks.after
          tree_inventory schemas > /tmp/m31d10-schemas.after
          historical_inventory > /tmp/m31d10-history.after
          cmp --silent /tmp/m31d10-artifacts.before /tmp/m31d10-artifacts.after
          cmp --silent /tmp/m31d10-benchmarks.before /tmp/m31d10-benchmarks.after
          cmp --silent /tmp/m31d10-schemas.before /tmp/m31d10-schemas.after
          cmp --silent /tmp/m31d10-history.before /tmp/m31d10-history.after
          echo "Evidence, benchmark, schema, and release histories: BYTE-IDENTICAL"

      - name: Verify only CHANGELOG.md changed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          target = os.environ["TARGET_PATH"]
          tracked = {
              item for item in subprocess.check_output(
                  ["git", "diff", "--name-only", "-z"]
              ).decode().split("\0") if item
          }
          untracked = {
              item for item in subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard", "-z"]
              ).decode().split("\0") if item
          }
          unexpected = (tracked | untracked) - {target}
          if unexpected:
              raise SystemExit(f"unexpected worktree changes: {sorted(unexpected)}")
          print("CHANGELOG.md-only update boundary: PASS")
          PY

      - name: Commit and publish complete CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          staged="$(git diff --cached --name-only)"
          if test -z "$staged"; then
            test -z "$(git status --porcelain)"
            echo "Complete M31 CHANGELOG.md is already published."
            exit 0
          fi
          test "$staged" = "$TARGET_PATH"
          git commit -m "Complete CHANGELOG.md through FRP v3.3.0 M31"
          git push origin HEAD:main

