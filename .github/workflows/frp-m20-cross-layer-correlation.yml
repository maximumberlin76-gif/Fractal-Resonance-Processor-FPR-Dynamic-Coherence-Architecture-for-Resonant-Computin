name: FRP M20 Cross-Layer Deterministic Correlation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frp-m20-cross-layer-correlation.yml"
      - "frp_m20_cross_layer_correlation.py"
      - "schemas/m20/**"
      - "artifacts/m20/**"
      - "tests/test_frp_m20_cross_layer_correlation.py"
      - "artifacts/m19/**"
      - "artifacts/m18/m15_exports/**"
      - "artifacts/m18/m15_vectors/**"
      - "artifacts/m18/structured_output/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/frp-m20-cross-layer-correlation.yml"
      - "frp_m20_cross_layer_correlation.py"
      - "schemas/m20/**"
      - "artifacts/m20/**"
      - "tests/test_frp_m20_cross_layer_correlation.py"
      - "artifacts/m19/**"
      - "artifacts/m18/m15_exports/**"
      - "artifacts/m18/m15_vectors/**"
      - "artifacts/m18/structured_output/**"

permissions:
  contents: write

concurrency:
  group: frp-m20-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correlate-m20:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      M20_ROOT: /tmp/frp_m20_creation
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

