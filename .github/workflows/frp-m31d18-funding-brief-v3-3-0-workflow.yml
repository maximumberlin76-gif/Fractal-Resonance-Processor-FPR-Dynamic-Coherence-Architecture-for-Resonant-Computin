name: FRP M31D18 Funding Brief v3.3.0

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m31d18-funding-brief-v3-3-0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-funding-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_PATH: funding_brief.md
      SOURCE_BYTES: "68524"
      SOURCE_LINES: "2495"
      SOURCE_SHA256: 06629d69d67f989c685d399dd46140a5e1d9268a505b43cb34f8578435ddcc88
      TARGET_BYTES: "81846"
      TARGET_LINES: "2720"
      TARGET_SHA256: 06b32eb46c62ae49798a09e568e5fa3f43cd143a03f6680d6421697b4d72f1fe
      BLOCK_BYTES: "13322"
      BLOCK_SHA256: a966b6cda55e39d5ad1a51a268aa7c7438ba13a56a1253ef91aedf4e058f2715
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ github.ref_name }}" = "main"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          echo "Manual main-branch boundary: PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify control boundaries and capture protected histories
        shell: bash
        run: |
          set -euo pipefail
          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          check_identity() {
            path="$1"
            bytes="$2"
            digest="$3"
            test -f "$path"
            test ! -L "$path"
            test "$(wc -c < "$path")" -eq "$bytes"
            test "$(sha256sum "$path" | cut -d' ' -f1)" = "$digest"
          }

          tree_inventory artifacts > /tmp/m31d18-artifacts.before
          tree_inventory benchmarks > /tmp/m31d18-benchmarks.before
          tree_inventory schemas > /tmp/m31d18-schemas.before
          historical_inventory > /tmp/m31d18-history.before

          while IFS='|' read -r path bytes digest
          do
            check_identity "$path" "$bytes" "$digest"
          done <<'CONTROL_IDENTITIES'
          README.md|10430|9fb5ccd3db24705f0f2c80723dd9b1f2c344e5b53c447927532ab29c2b34ca41
          USAGE.md|66358|d1f5868a07c6322feb1ba8d36d6aff9972976848f26d63be6494d4ae722473c1
          REPRODUCIBILITY.md|84646|e6b9fba117314e593cdb47e984ada655402d8d25b7510df2471eb505c19512db
          MILESTONES.md|65183|d897a00d07be90efe13135a62be07dc367b10a0653f95348e2f3ef9f62a6d451
          NOTICE.md|4814|d5e3bbdfebb1a77fc2ba54d7e2ac12802eeac5bd4f2537b22eef6d10c8e4aac1
          CHANGELOG.md|137894|b243bf728871f498c413ef43c4eb243c2fd6512bed80f452381b9846c9356fab
          CI.md|137571|87d891c84c1c1118c0204ef7fbd31b5d63ff8da3dc916b30af0ad05fcda7dafc
          ROADMAP.md|53373|611570be05d0e3a0d514c08c3f2e163a0b37e40edc2898ad524e795112fb5e7a
          PROJECT_STRUCTURE.md|75854|17adf275c6af9996e7af9e2e36982893b9d0d60c297d6458d90854b01424c02d
          INSTALL.md|51529|df1dcd53d5f195cbc02bb3abbed61c08450ff9673816afcaec785a3f58642e96
          SECURITY.md|11961|65bd8aaf9da131cf79ecb617727bce16f7c5241a949491a0851b83a6fccd235b
          CONTRIBUTING.md|81983|e18fa5d7a89f8c01253649126d005d09c3a15cce5298336573f8f46514d4e001
          CODE_OF_CONDUCT.md|14161|266980d8336f2bc537f098e05786aa10a071c0821a7066a8f5bca695e436132f
          CONTROL_IDENTITIES

          while IFS= read -r path
          do
            test -f "$path"
            test ! -L "$path"
          done <<'REQUIRED_FILES'
          LICENSE
          FRP_VALIDATION_INDEX_v3_3_0.md
          RELEASE_NOTES_v3_3_0.md
          TEST_REPORT_v3_3_0.md
          requirements.txt
          frp_m31_phase_interference_thermal_evidence.py
          tests/test_frp_m31_phase_interference_thermal_evidence.py
          schemas/m31/frp.m31.phase_interference_active_zero_thermal_evidence.v1.schema.json
          artifacts/m31/evidence/m31-phase-interference-active-zero-thermal-evidence.json
          artifacts/m31/manifests/m31-phase-interference-active-zero-thermal-evidence-manifest.json
          artifacts/m31/qualification/m31-phase-interference-active-zero-thermal-evidence-qualification.json
          .github/workflows/frp-m31-complete.yml
          REQUIRED_FILES

          test -f "$TARGET_PATH"
          test ! -L "$TARGET_PATH"
          current_sha="$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)"
          if test "$current_sha" = "$SOURCE_SHA256"; then
            test "$(wc -c < "$TARGET_PATH")" -eq "$SOURCE_BYTES"
            test "$(wc -l < "$TARGET_PATH")" -eq "$SOURCE_LINES"
          elif test "$current_sha" = "$TARGET_SHA256"; then
            test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
            test "$(wc -l < "$TARGET_PATH")" -eq "$TARGET_LINES"
          else
            echo "funding_brief.md boundary mismatch: $current_sha" >&2
            exit 1
          fi
          echo "Control boundaries and protected histories: PASS"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run all 60 focused M31 qualification tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_frp_m31_phase_interference_thermal_evidence -v 2>&1 | tee /tmp/m31d18-tests.log
          grep -F "Ran 60 tests" /tmp/m31d18-tests.log
          grep -Fx "OK" /tmp/m31d18-tests.log

      - name: Install complete funding_brief.md
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)"
          if test "$current_sha" = "$TARGET_SHA256"; then
