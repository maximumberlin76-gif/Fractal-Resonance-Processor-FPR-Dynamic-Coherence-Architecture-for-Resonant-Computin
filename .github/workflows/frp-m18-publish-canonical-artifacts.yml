name: FRP M18 Publish Canonical Artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m18-publish-canonical-artifacts-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  EXPECTED_PRODUCER_SHA256: 4562e0d6b5a0611ce7623d66b563aea7e90afb98e9f534a581a64d59e47c11b1
  EXPECTED_REGISTRY_RAW_SHA256: 35dbce174597da749d95cc8cdbc41f1b67a3d042296ae84e61915ee09c5fdea6
  EXPECTED_REGISTRY_CONTENT_SHA256: 6d2d0077b00c9f3da04429a8a690256fe7b4de585c7257804471a3d3d4992c0c
  EXPECTED_ARTIFACT_SET_SHA256: c190ffeee11ac44a5f89efa85e54fc656cac23f0f66f625cf303419b967a9f83
  M18_EVIDENCE_DIR: /tmp/frp_m18_publish_evidence
  M18_GENERATION_A: /tmp/frp_m18_publish_generation_a
  M18_GENERATION_B: /tmp/frp_m18_publish_generation_b
  M18_PYCACHE_DIR: /tmp/frp_m18_publish_pycache
  WORKFLOW_PATH: .github/workflows/frp-m18-publish-canonical-artifacts.yml
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/frp_m18_publish_pycache
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  LC_ALL: C.UTF-8
  TZ: UTC

jobs:
  publish-canonical-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare isolated publication directories
        run: |
          set -euo pipefail

          for path in \
            "$M18_EVIDENCE_DIR" \
            "$M18_GENERATION_A" \
            "$M18_GENERATION_B" \
            "$M18_PYCACHE_DIR"; do
            case "$path" in
              /tmp/frp_m18_publish_*) ;;
              *)
                echo "Unsafe temporary path: $path" >&2
                exit 1
                ;;
            esac
            test "$path" != "/tmp"
            test "$path" != "/"
            test ! -e "$path"
            test ! -L "$path"
            mkdir -m 700 "$path"
          done

      - name: Install exact runtime dependencies
        run: |
          set -euo pipefail

          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          python - <<'PY'
          import importlib.metadata
          import sys

          from jsonschema import Draft202012Validator

          if sys.version_info[:2] != (3, 12):
              raise SystemExit("Python 3.12 is required")
          if importlib.metadata.version("jsonschema") != "4.25.1":
              raise SystemExit("jsonschema==4.25.1 is required")
          if Draft202012Validator.META_SCHEMA.get("$id") != (
              "https://json-schema.org/draft/2020-12/schema"
          ):
              raise SystemExit("Draft202012Validator is unavailable")
          PY

      - name: Verify source and registry boundary
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test -f "$WORKFLOW_PATH"
          test ! -L "$WORKFLOW_PATH"
          test ! -e artifacts/m18

          producer_sha256=$(sha256sum frp_m18_canonical_artifacts.py | awk '{print $1}')
          registry_raw_sha256=$(sha256sum schemas/m18/frp_m18_schema_registry.json | awk '{print $1}')
          test "$producer_sha256" = "$EXPECTED_PRODUCER_SHA256"
          test "$registry_raw_sha256" = "$EXPECTED_REGISTRY_RAW_SHA256"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          registry_path = Path("schemas/m18/frp_m18_schema_registry.json")

          def reject_constant(value):
              raise ValueError(f"non-finite JSON constant: {value}")

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          registry = json.loads(
              registry_path.read_text(encoding="utf-8"),
              object_pairs_hook=unique_object,
              parse_constant=reject_constant,
          )
          digest_source = dict(registry)
          declared = digest_source.pop("registry_content_sha256", None)
          compact = json.dumps(
              digest_source,
              allow_nan=False,
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          ).encode("utf-8")
          observed = hashlib.sha256(compact).hexdigest()
          expected = os.environ["EXPECTED_REGISTRY_CONTENT_SHA256"]
          if declared != expected or observed != expected:
              raise SystemExit("M18 registry content digest mismatch")

          expected_paths = {
              "artifacts/m18/structured_output/trace-free.json",
              "artifacts/m18/structured_output/trace-7-1.json",
              "artifacts/m18/structured_output/trace-1-7.json",
              "artifacts/m18/structured_output/self-test-default.json",
          }
          registered_paths = {
              path
              for record in registry["records"]
              for path in record["canonical_artifact_paths"]
          }
          if not expected_paths.issubset(registered_paths):
              raise SystemExit("corrected structured-output paths are not registered")
          PY

      - name: Compile publication sources
        run: |
          set -euo pipefail

          python -m py_compile \
            frp_prototype_v1_7_0.py \
            frp_m18_canonical_artifacts.py

      - name: Run independent self-test pair
        run: |
          set -euo pipefail

          python frp_m18_canonical_artifacts.py \
            --self-test \
            --output json \
            > "$M18_EVIDENCE_DIR/self-test-a.json"

          python frp_m18_canonical_artifacts.py \
            --self-test \
            --output json \
            > "$M18_EVIDENCE_DIR/self-test-b.json"

          cmp -s \
            "$M18_EVIDENCE_DIR/self-test-a.json" \
            "$M18_EVIDENCE_DIR/self-test-b.json"

      - name: Generate independent publication pair
        run: |
          set -euo pipefail

          python frp_m18_canonical_artifacts.py \
            --generate \
            --repository-root "$GITHUB_WORKSPACE" \
            --output-root "$M18_GENERATION_A" \
            --output json \
            > "$M18_EVIDENCE_DIR/generation-a.json"

          python frp_m18_canonical_artifacts.py \
            --generate \
            --repository-root "$GITHUB_WORKSPACE" \
            --output-root "$M18_GENERATION_B" \
            --output json \
            > "$M18_EVIDENCE_DIR/generation-b.json"

      - name: Validate independent publication pair
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath

          repository = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          generation_a = Path(os.environ["M18_GENERATION_A"]).resolve()
          generation_b = Path(os.environ["M18_GENERATION_B"]).resolve()
          evidence = Path(os.environ["M18_EVIDENCE_DIR"]).resolve()

          expected_paths = (
              "artifacts/m18/benchmark_matrix/benchmark-matrix.json",
              "artifacts/m18/m15_exports/balanced-ternary-hardware-encoding-map.json",
              "artifacts/m18/m15_exports/cycle-exact-reference-trace.json",
              "artifacts/m18/m15_exports/fixed-point-interface-profile.json",
              "artifacts/m18/m15_exports/qualification-closure-manifest.json",
              "artifacts/m18/m15_exports/quantized-reference-shadow-model.json",
              "artifacts/m18/m15_exports/reference-rtl-equivalence-report.json",
              "artifacts/m18/m15_exports/rtl-assertion-correlation-harness.json",
              "artifacts/m18/m15_exports/rtl-comparison-vector-package.json",
              "artifacts/m18/m15_exports/synthesizable-rtl-reference-core.json",
              "artifacts/m18/m15_exports/systemverilog-testbench-interface-map.json",
              "artifacts/m18/m15_vectors/frp_m15_cell_trace.vec",
              "artifacts/m18/m15_vectors/frp_m15_full_correlation_vectors.vec",
              "artifacts/m18/m15_vectors/frp_m15_kernel_vectors.vec",
              "artifacts/m18/m15_vectors/frp_m15_pending_routes.trace",
              "artifacts/m18/m15_vectors/frp_m15_reference_preload.json",
              "artifacts/m18/m15_vectors/frp_m15_scheduler_1_7_vectors.vec",
              "artifacts/m18/m15_vectors/frp_m15_scheduler_7_1_vectors.vec",
              "artifacts/m18/m15_vectors/frp_m15_scheduler_free_vectors.vec",
              "artifacts/m18/m15_vectors/frp_m15_sha256_manifest.json",
              "artifacts/m18/m15_vectors/frp_m15_trig_lut_q30.vec",
              "artifacts/m18/manifests/canonical-artifact-manifest.json",
              "artifacts/m18/manifests/canonical-artifact-qualification.json",
              "artifacts/m18/manifests/canonical-artifact-self-test.json",
              "artifacts/m18/structured_output/scaling-16.json",
              "artifacts/m18/structured_output/scaling-32.json",
              "artifacts/m18/structured_output/scaling-8.json",
              "artifacts/m18/structured_output/self-test-1-7.json",
              "artifacts/m18/structured_output/self-test-7-1.json",
              "artifacts/m18/structured_output/self-test-default.json",
              "artifacts/m18/structured_output/self-test-free.json",
              "artifacts/m18/structured_output/structured-output.json",
              "artifacts/m18/structured_output/trace-1-7.json",
              "artifacts/m18/structured_output/trace-7-1.json",
              "artifacts/m18/structured_output/trace-free.json",
              "artifacts/m18/tabular/benchmark-matrix.csv",
          )

          def reject_constant(value):
              raise ValueError(f"non-finite JSON constant: {value}")

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def load_json(path):
              return json.loads(
                  path.read_text(encoding="utf-8"),
                  object_pairs_hook=unique_object,
                  parse_constant=reject_constant,
              )

          def inventory(root):
              paths = []
              for current, directories, filenames in os.walk(root, followlinks=False):
                  current_path = Path(current)
                  for name in directories:
                      candidate = current_path / name
                      if candidate.is_symlink():
                          raise SystemExit(f"symbolic-link directory: {candidate}")
                  for name in filenames:
                      candidate = current_path / name
                      if candidate.is_symlink() or not candidate.is_file():
                          raise SystemExit(f"non-regular generated file: {candidate}")
                      paths.append(candidate.relative_to(root).as_posix())
              return tuple(sorted(paths))

          def safe_source(relative_path):
              relative = PurePosixPath(relative_path)
              if relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit(f"unsafe manifest path: {relative_path}")
              generated = generation_a.joinpath(*relative.parts)
              source = generated if generated.is_file() else repository.joinpath(*relative.parts)
              if source.is_symlink() or not source.is_file():
                  raise SystemExit(f"missing manifest source: {relative_path}")
              resolved = source.resolve(strict=True)
              allowed_root = generation_a if generated.is_file() else repository
              if resolved != allowed_root and allowed_root not in resolved.parents:
                  raise SystemExit(f"manifest source escapes its root: {relative_path}")
              return source

          if len(expected_paths) != 36 or len(set(expected_paths)) != 36:
              raise SystemExit("expected publication path set is invalid")
          if tuple(sorted(expected_paths)) != expected_paths:
              raise SystemExit("expected publication paths are not ordered")

          for response_name in ("generation-a.json", "generation-b.json"):
              response = load_json(evidence / response_name)
              if response.get("overall_status") != "PASS":
                  raise SystemExit(f"{response_name}: generation did not pass")
              if response.get("generated_file_count") != 36:
                  raise SystemExit(f"{response_name}: generated count mismatch")
              if tuple(response.get("paths", ())) != expected_paths:
                  raise SystemExit(f"{response_name}: generated path set mismatch")

          self_test_a = evidence / "self-test-a.json"
          self_test_b = evidence / "self-test-b.json"
          if self_test_a.read_bytes() != self_test_b.read_bytes():
              raise SystemExit("independent self-test outputs differ")
          self_test = load_json(self_test_a)
          if (
              self_test.get("overall_status") != "PASS"
              or self_test.get("case_count") != 34
              or self_test.get("passed_count") != 34
              or self_test.get("failed_count") != 0
          ):
              raise SystemExit("M18 self-test counters mismatch")

          paths_a = inventory(generation_a)
          paths_b = inventory(generation_b)
          if paths_a != expected_paths or paths_b != expected_paths:
              raise SystemExit("independent generated tree path set mismatch")

          for relative_path in expected_paths:
              raw_a = (generation_a / relative_path).read_bytes()
              raw_b = (generation_b / relative_path).read_bytes()
              if len(raw_a) != len(raw_b) or raw_a != raw_b:
                  raise SystemExit(f"independent generation mismatch: {relative_path}")
              if not raw_a.endswith(b"\n") or b"\r" in raw_a:
                  raise SystemExit(f"generated line-ending mismatch: {relative_path}")

          manifest_path = generation_a / (
              "artifacts/m18/manifests/canonical-artifact-manifest.json"
          )
          qualification_path = generation_a / (
              "artifacts/m18/manifests/canonical-artifact-qualification.json"
          )
          published_self_test_path = generation_a / (
              "artifacts/m18/manifests/canonical-artifact-self-test.json"
          )
          manifest = load_json(manifest_path)
          qualification = load_json(qualification_path)
          published_self_test = load_json(published_self_test_path)

          if manifest.get("artifact_set_sha256") != os.environ["EXPECTED_ARTIFACT_SET_SHA256"]:
              raise SystemExit("artifact-set digest mismatch")
          records = manifest.get("artifacts")
          if not isinstance(records, list) or manifest.get("artifact_count") != 64:
              raise SystemExit("manifest record count mismatch")
          record_paths = [record.get("repository_path") for record in records]
          if record_paths != sorted(record_paths) or len(set(record_paths)) != 64:
              raise SystemExit("manifest path order or uniqueness mismatch")
          excluded = {
              "artifacts/m18/manifests/canonical-artifact-manifest.json",
              "artifacts/m18/manifests/canonical-artifact-qualification.json",
              "artifacts/m18/manifests/canonical-artifact-self-test.json",
          }
          if excluded.intersection(record_paths):
              raise SystemExit("manifest contains an excluded record")

          for record in records:
              relative_path = record["repository_path"]
              raw = safe_source(relative_path).read_bytes()
              if record.get("byte_length") != len(raw):
                  raise SystemExit(f"manifest byte length mismatch: {relative_path}")
              if record.get("sha256") != hashlib.sha256(raw).hexdigest():
                  raise SystemExit(f"manifest SHA-256 mismatch: {relative_path}")

          if (
              qualification.get("overall_status") != "PASS"
              or qualification.get("check_count") != 187
              or qualification.get("passed_count") != 187
              or qualification.get("failed_count") != 0
              or qualification.get("warning_count") != 0
              or qualification.get("not_evaluated_count") != 0
          ):
              raise SystemExit("qualification counters mismatch")
          checks = qualification.get("checks")
          if not isinstance(checks, list) or len(checks) != 187:
              raise SystemExit("qualification check vector mismatch")
          if any(check.get("outcome") != "PASS" for check in checks):
              raise SystemExit("qualification contains a non-PASS check")

          if (
              published_self_test.get("overall_status") != "PASS"
              or published_self_test.get("case_count") != 34
              or published_self_test.get("passed_count") != 34
              or published_self_test.get("failed_count") != 0
          ):
              raise SystemExit("published self-test counters mismatch")
          if published_self_test_path.read_bytes() != self_test_a.read_bytes():
              raise SystemExit("published and independent self-test bytes differ")
          PY

      - name: Publish canonical artifacts atomically
        run: |
          set -euo pipefail

          python frp_m18_canonical_artifacts.py \
            --generate \
            --repository-root "$GITHUB_WORKSPACE" \
            --output-root "$GITHUB_WORKSPACE" \
            --replace \
            --output json \
            > "$M18_EVIDENCE_DIR/publication.json"

      - name: Verify committed publication candidate
        run: |
          set -euo pipefail

          python frp_m18_canonical_artifacts.py \
            --verify \
            --repository-root "$GITHUB_WORKSPACE" \
            --output text \
            | tee "$M18_EVIDENCE_DIR/verify.txt"

          python frp_m18_canonical_artifacts.py \
            --qualify \
            --repository-root "$GITHUB_WORKSPACE" \
            --output json \
            > "$M18_EVIDENCE_DIR/qualification-a.json"

          python frp_m18_canonical_artifacts.py \
            --qualify \
            --repository-root "$GITHUB_WORKSPACE" \
            --output json \
            > "$M18_EVIDENCE_DIR/qualification-b.json"

          cmp -s \
            "$M18_EVIDENCE_DIR/qualification-a.json" \
            "$M18_EVIDENCE_DIR/qualification-b.json"
          cmp -s \
            "$M18_EVIDENCE_DIR/qualification-a.json" \
            artifacts/m18/manifests/canonical-artifact-qualification.json

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repository = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          generation_a = Path(os.environ["M18_GENERATION_A"]).resolve()
          evidence = Path(os.environ["M18_EVIDENCE_DIR"]).resolve()
          response = json.loads((evidence / "generation-a.json").read_text(encoding="utf-8"))
          expected_paths = tuple(response["paths"])

          committed_paths = tuple(
              sorted(
                  path.relative_to(repository).as_posix()
                  for path in (repository / "artifacts/m18").rglob("*")
                  if path.is_file()
              )
          )
          if committed_paths != expected_paths:
              raise SystemExit("committed publication path set mismatch")

          for relative_path in expected_paths:
              committed = repository / relative_path
              generated = generation_a / relative_path
              if committed.is_symlink() or not committed.is_file():
                  raise SystemExit(f"invalid committed artifact: {relative_path}")
              if committed.read_bytes() != generated.read_bytes():
                  raise SystemExit(f"committed artifact differs: {relative_path}")

          status = subprocess.run(
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              cwd=repository,
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          observed_untracked = {
              line[3:] for line in status if line.startswith("?? ")
          }
          if len(status) != 36 or observed_untracked != set(expected_paths):
              raise SystemExit("publication wrote outside the registered artifact set")
          PY

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: frp-m18-canonical-artifact-publication-evidence
          path: |
            ${{ env.M18_EVIDENCE_DIR }}
            ${{ env.M18_GENERATION_A }}/artifacts/m18
          if-no-files-found: error
          retention-days: 30

      - name: Delete workflow, commit exact targets, and push
        run: |
          set -euo pipefail

          test -f "$WORKFLOW_PATH"
          test ! -L "$WORKFLOW_PATH"
          unlink -- "$WORKFLOW_PATH"

          git add --all -- artifacts/m18 "$WORKFLOW_PATH"
          git diff --cached --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repository = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          evidence = Path(os.environ["M18_EVIDENCE_DIR"]).resolve()
          workflow_path = os.environ["WORKFLOW_PATH"]
          response = json.loads((evidence / "generation-a.json").read_text(encoding="utf-8"))
          expected = {path: "A" for path in response["paths"]}
          expected[workflow_path] = "D"

          output = subprocess.run(
              ["git", "diff", "--cached", "--name-status", "--no-renames"],
              cwd=repository,
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          observed = {}
          for line in output:
              status, path = line.split("\t", 1)
              if path in observed:
                  raise SystemExit(f"duplicate staged path: {path}")
              observed[path] = status
          if observed != expected:
              raise SystemExit("staged commit target set mismatch")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Publish M18 canonical artifacts" \
            -m "Generate and qualify the deterministic M18 canonical artifact set."

          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repository = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          evidence = Path(os.environ["M18_EVIDENCE_DIR"]).resolve()
          workflow_path = os.environ["WORKFLOW_PATH"]
          response = json.loads((evidence / "generation-a.json").read_text(encoding="utf-8"))
          expected = {path: "A" for path in response["paths"]}
          expected[workflow_path] = "D"

          output = subprocess.run(
              [
                  "git",
                  "diff-tree",
                  "--no-commit-id",
                  "--name-status",
                  "--no-renames",
                  "-r",
                  "HEAD",
              ],
              cwd=repository,
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          observed = {}
          for line in output:
              status, path = line.split("\t", 1)
              if path in observed:
                  raise SystemExit(f"duplicate committed path: {path}")
              observed[path] = status
          if observed != expected:
              raise SystemExit("committed target set mismatch")
          PY

          git push origin HEAD:main
