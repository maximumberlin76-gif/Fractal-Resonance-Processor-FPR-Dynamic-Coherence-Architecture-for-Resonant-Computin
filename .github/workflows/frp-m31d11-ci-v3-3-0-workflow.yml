      M30_QUALIFICATION_PATH: artifacts/m30/manifests/m30-reproducibility-qualification.json
      M30_QUALIFICATION_BYTES: "6317"
      M30_QUALIFICATION_SHA256: 4d3902fe999995f4f67aaa9fb3cfc1ac1e8de177ea0d66819fbb80aeefafa0c4
      M30_ARCHIVE_PATH: artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
      M30_ARCHIVE_BYTES: "10189989"
      M30_ARCHIVE_SHA256: 05ea33f6f3f505d315af930c2d51779f7189905308473f32a57375e477069caa
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ github.ref_name }}" = "main"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          echo "Manual main-branch boundary: PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify current documentation and protected histories
        shell: bash
        run: |
          set -euo pipefail
          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          verify_inventory() {
            inventory_path="$1"
            expected_files="$2"
            expected_sha="$3"
            output_path="$4"
            tree_inventory "$inventory_path" > "$output_path"
            test "$(wc -l < "$output_path")" -eq "$expected_files"
            test "$(sha256sum "$output_path" | cut -d' ' -f1)" = "$expected_sha"
          }
          verify_file() {
            path="$1"
            expected_bytes="$2"
            expected_sha="$3"
            test ! -L "$path"
            test -f "$path"
            test "$(wc -c < "$path")" -eq "$expected_bytes"
            test "$(sha256sum "$path" | cut -d' ' -f1)" = "$expected_sha"
          }

          verify_inventory artifacts "$ARTIFACTS_FILES" "$ARTIFACTS_INVENTORY_SHA256" /tmp/m31d11-artifacts.before
          verify_inventory benchmarks "$BENCHMARKS_FILES" "$BENCHMARKS_INVENTORY_SHA256" /tmp/m31d11-benchmarks.before
          verify_inventory schemas "$SCHEMAS_FILES" "$SCHEMAS_INVENTORY_SHA256" /tmp/m31d11-schemas.before
          historical_inventory > /tmp/m31d11-history.before
          test "$(wc -l < /tmp/m31d11-history.before)" -eq "$HISTORICAL_RECORDS"
          test "$(sha256sum /tmp/m31d11-history.before | cut -d' ' -f1)" = "$HISTORICAL_INVENTORY_SHA256"

          verify_file "$LICENSE_PATH" "$LICENSE_BYTES" "$LICENSE_SHA256"
          verify_file "$README_PATH" "$README_BYTES" "$README_SHA256"
          verify_file "$USAGE_PATH" "$USAGE_BYTES" "$USAGE_SHA256"
          verify_file "$REPRODUCIBILITY_PATH" "$REPRODUCIBILITY_BYTES" "$REPRODUCIBILITY_SHA256"
          verify_file "$MILESTONES_PATH" "$MILESTONES_BYTES" "$MILESTONES_SHA256"
          verify_file "$NOTICE_PATH" "$NOTICE_BYTES" "$NOTICE_SHA256"
          verify_file "$CHANGELOG_PATH" "$CHANGELOG_BYTES" "$CHANGELOG_SHA256"
          verify_file "$D1_INDEX_PATH" "$D1_INDEX_BYTES" "$D1_INDEX_SHA256"
          verify_file "$D2_NOTES_PATH" "$D2_NOTES_BYTES" "$D2_NOTES_SHA256"
          verify_file "$D3_REPORT_PATH" "$D3_REPORT_BYTES" "$D3_REPORT_SHA256"

          test ! -L "$TARGET_PATH"
          test -f "$TARGET_PATH"
          target_sha="$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)"
          if test "$target_sha" = "$SOURCE_SHA256"; then
            test "$(wc -c < "$TARGET_PATH")" -eq "$SOURCE_BYTES"
            test "$(wc -l < "$TARGET_PATH")" -eq "$SOURCE_LINES"
          elif test "$target_sha" = "$TARGET_SHA256"; then
            test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
            test "$(wc -l < "$TARGET_PATH")" -eq "$TARGET_LINES"
          else
            echo "CI.md boundary mismatch: $target_sha" >&2
            exit 1
          fi
          echo "Current documentation and protected histories: PASS"

      - name: Verify exact M30 and M31 publication boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          prefixes = (
              "REQUIREMENTS",
              "M31_SOURCE",
              "M31_TEST",
              "M31_SCHEMA",
              "M31_EVIDENCE",
              "M31_MANIFEST",
              "M31_QUALIFICATION",
              "M30_QUALIFICATION",
              "M30_ARCHIVE",
          )
          for prefix in prefixes:
              path = Path(os.environ[prefix + "_PATH"])
              expected = (
                  int(os.environ[prefix + "_BYTES"]),
                  os.environ[prefix + "_SHA256"],
              )
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"required regular file is missing: {path}")
              raw = path.read_bytes()
              observed = (len(raw), hashlib.sha256(raw).hexdigest())
              if observed != expected:
                  raise SystemExit(f"publication-boundary mismatch: {path}")
          print("Exact M30 and M31 publication boundary: PASS")
          PY

      - name: Verify M17-M31 workflow registry
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r workflow
          do
            test -f "$workflow"
            test ! -L "$workflow"
          done <<'WORKFLOWS'
          .github/workflows/frp-m17-published-artifact-integration.yml
          .github/workflows/frp-m18-formal-schema-canonical-artifacts.yml
          .github/workflows/frp-m19-create-machine-readable-m16-evidence.yml
          .github/workflows/frp-m20-cross-layer-correlation.yml
          .github/workflows/frp-m21-parameterized-qualification-matrix.yml
          .github/workflows/frp-m22-control-status-register-interface.yml
          .github/workflows/frp-m23-clock-reset-cdc-interface-hardening-workflow.yml
          .github/workflows/frp-m24-formal-bounded-verification-closure-workflow.yml
          .github/workflows/frp-m25-fault-negative-path-recovery-qualification-workflow.yml
          .github/workflows/frp-m26-declared-target-implementation-evidence-workflow.yml
          .github/workflows/frp-m27-long-run-stability-telemetry-qualification-workflow.yml
          .github/workflows/frp-m28-hierarchical-scaling-hotspot-containment-closure-workflow.yml
          .github/workflows/frp-m28-trace-observatory-upstream-interchange-workflow.yml
          .github/workflows/frp-m29-system-integration-downstream-compatibility-closure-workflow.yml
          .github/workflows/frp-m30-reproducibility-qualification-archival-release-closure-workflow.yml
          .github/workflows/frp-m31a1-phase-interference-thermal-evidence-source-part-1-workflow.yml
          .github/workflows/frp-m31a2-phase-interference-thermal-evidence-source-part-2-workflow.yml
          .github/workflows/frp-m31a3-phase-interference-thermal-evidence-source-assembly-workflow.yml
          .github/workflows/frp-m31b1-phase-interference-thermal-evidence-test-part-1-workflow.yml
          .github/workflows/frp-m31b2-phase-interference-thermal-evidence-test-part-2-workflow.yml
          .github/workflows/frp-m31b3-phase-interference-thermal-evidence-test-assembly-workflow.yml
          .github/workflows/frp-m31c-phase-interference-thermal-evidence-publication-workflow.yml
          .github/workflows/frp-m31-complete.yml
          .github/workflows/frp-m31d11-ci-v3-3-0-workflow.yml
          WORKFLOWS
          echo "M17-M31 workflow registry: PASS"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$REQUIREMENTS_PATH"

      - name: Run all 60 focused M31 qualification tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_frp_m31_phase_interference_thermal_evidence -v 2>&1 | tee /tmp/m31d11-tests.log
          grep -F "Ran 60 tests" /tmp/m31d11-tests.log
          grep -Fx "OK" /tmp/m31d11-tests.log

      - name: Install complete CI.md
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)"
          if test "$current_sha" = "$TARGET_SHA256"; then
            echo "Complete M31 CI.md is already installed."
            exit 0
          fi
          test "$current_sha" = "$SOURCE_SHA256"

          compact=/tmp/m31d11-ci.gz.b64
