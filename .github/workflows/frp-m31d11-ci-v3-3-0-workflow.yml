      - name: Qualify CI.md content and preserved history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          raw = Path(os.environ["TARGET_PATH"]).read_bytes()
          expected = (int(os.environ["TARGET_BYTES"]), os.environ["TARGET_SHA256"])
          observed = (len(raw), hashlib.sha256(raw).hexdigest())
          if observed != expected:
              raise SystemExit("CI.md target identity mismatch")
          if raw.count(b"\n") != int(os.environ["TARGET_LINES"]):
              raise SystemExit("CI.md line-count mismatch")

          marker = "# CI — Fractal Resonance Processor (FRP)\n\n".encode()
          block_end = len(marker) + int(os.environ["BLOCK_BYTES"])
          block = raw[len(marker):block_end]
          block_identity = (len(block), hashlib.sha256(block).hexdigest())
          expected_block = (int(os.environ["BLOCK_BYTES"]), os.environ["BLOCK_SHA256"])
          if block_identity != expected_block:
              raise SystemExit("current CI register identity mismatch")
          reconstructed_source = raw[:len(marker)] + raw[block_end:]
          source_identity = (
              len(reconstructed_source),
              hashlib.sha256(reconstructed_source).hexdigest(),
          )
          expected_source = (
              int(os.environ["SOURCE_BYTES"]),
              os.environ["SOURCE_SHA256"],
          )
          if source_identity != expected_source:
              raise SystemExit("historical CI.md bytes were not preserved")

          text = raw.decode("utf-8")
          required = (
              "## Current FRP v3.3.0 / M31 CI Register",
              "FRP v3.3.0",
              "M31 — Phase-Interference, Active-Zero, and Thermal-Evidence Publication",
              "60 / 60 PASS",
              "13 / 13 PASS",
              "4 / 4 exact",
              "55 / 55 PASS",
              "-1/0/1",
              "-1 → 0 → 1",
              "1 → 0 → -1",
              "M17-M31 Qualification Chain",
              "187 / 187 PASS",
              "37 / 37 PASS",
              "39 / 39 PASS",
              "48 / 48 PASS",
              "72 / 72 PASS",
              "76 / 76 PASS",
              "105 / 105 PASS",
              "70 / 70 PASS",
              "69 / 69 PASS",
              "59 / 59 PASS",
              ".github/workflows/frp-m31-complete.yml",
              "FRP_VALIDATION_INDEX_v3_3_0.md",
              "RELEASE_NOTES_v3_3_0.md",
              "TEST_REPORT_v3_3_0.md",
              "FRP published bytes → FRP-Trace-Observatory",
              "## Preserved CI History Through M30",
              "## 46. M30 Reproducibility Qualification and Archival Closure",
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f"CI.md required records missing: {missing}")
          forbidden = ("-1/0/" + chr(43) + "1",)
          present = [value for value in forbidden if value in text]
          if present:
              raise SystemExit(f"CI.md forbidden notation present: {present}")
          print("CI.md M0-M31 continuity and historical-byte preservation: PASS")
          PY

      - name: Prove protected histories are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          tree_inventory artifacts > /tmp/m31d11-artifacts.after
          tree_inventory benchmarks > /tmp/m31d11-benchmarks.after
          tree_inventory schemas > /tmp/m31d11-schemas.after
          historical_inventory > /tmp/m31d11-history.after
          cmp --silent /tmp/m31d11-artifacts.before /tmp/m31d11-artifacts.after
          cmp --silent /tmp/m31d11-benchmarks.before /tmp/m31d11-benchmarks.after
          cmp --silent /tmp/m31d11-schemas.before /tmp/m31d11-schemas.after
          cmp --silent /tmp/m31d11-history.before /tmp/m31d11-history.after
          echo "Evidence, benchmark, schema, and release histories: BYTE-IDENTICAL"

      - name: Verify only CI.md changed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          target = os.environ["TARGET_PATH"]
          tracked = {
              item for item in subprocess.check_output(
                  ["git", "diff", "--name-only", "-z"]
              ).decode().split("\0") if item
          }
          untracked = {
              item for item in subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard", "-z"]
              ).decode().split("\0") if item
          }
          unexpected = (tracked | untracked) - {target}
          if unexpected:
              raise SystemExit(f"unexpected worktree changes: {sorted(unexpected)}")
          print("CI.md-only update boundary: PASS")
          PY

      - name: Commit and publish complete CI.md
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          staged="$(git diff --cached --name-only)"
          if test -z "$staged"; then
            test -z "$(git status --porcelain)"
            echo "Complete M31 CI.md is already published."
            exit 0
          fi
          test "$staged" = "$TARGET_PATH"
          git commit -m "Align CI.md with FRP v3.3.0 M31"
          git push origin HEAD:main

