          0155 96 9375a71310cad3bd87d17fa651e68be5f81c931548741fbfad5da2ab69f84bae AoZt3Om53k5qHgMUOpY+9FSEAPsh6S/YlktBcRPm7t/57j/jyHSOBuePXY+rLRNrKOHoFfbw/FPBHV1bfp0p/T/p+yiL/ogq
          0156 36 57a8a5cf82ee0ef31a7294a84b364b2ed7e3d1fb35b3ec36a1f90734458a73fc 7fthT+vNYHpWDp4eFIf/i7kinChINCTJ3wA=
          """
          expected_archive_sha256 = "f82ef614b28e1a32e64565c706438a6973821909ed58980cd39530395f99984b"
          expected_files = json.loads('{"frp_m28_trace_observatory_upstream_interchange.py":{"bytes":53856,"raw_sha256":"1c0662120fb734e48fb5ff7f88f4ff223f9ae6ed5f8cb38eef0dd90224ef12ab"},"tests/test_frp_m28_trace_observatory_upstream_interchange.py":{"bytes":15069,"raw_sha256":"400bb2d1231884f690e3ee363c0c2667a9ca55479c21ca0254bd66a27103f3af"}}')
          payload_root = Path(os.environ["M28_PAYLOAD_ROOT"])
          staging = payload_root / "staging"
          base64_alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"

          def row_digest(value):
              return hashlib.sha256(value.encode("ascii")).hexdigest()

          def repair_row(value, expected_length, expected_digest, row_index):
              if len(value) == expected_length and row_digest(value) == expected_digest:
                  return value, False
              candidates = set()
              if len(value) == expected_length - 1:
                  for position in range(expected_length):
                      for character in base64_alphabet:
                          candidate = value[:position] + character + value[position:]
                          if row_digest(candidate) == expected_digest:
                              candidates.add(candidate)
              elif len(value) == expected_length + 1:
                  for position in range(len(value)):
                      candidate = value[:position] + value[position + 1:]
                      if row_digest(candidate) == expected_digest:
                              candidates.add(candidate)
              elif len(value) == expected_length:
                  for position, original in enumerate(value):
                      for character in base64_alphabet:
                          if character == original:
                              continue
                          candidate = value[:position] + character + value[position + 1:]
                          if row_digest(candidate) == expected_digest:
                              candidates.add(candidate)
              if len(candidates) != 1:
                  raise SystemExit(
                      "M28 payload row cannot be repaired uniquely: "
                      f"row={row_index}, length={len(value)}, expected={expected_length}, "
                      f"candidates={len(candidates)}"
                  )
              return next(iter(candidates)), True

          parsed_rows = []
          repaired_rows = []
          for raw_line in payload_rows.splitlines():
              line = raw_line.strip()
              if not line:
                  continue
              parts = line.split(" ", 3)
              if len(parts) != 4:
                  raise SystemExit("M28 payload row format mismatch")
              index_text, length_text, digest, encoded = parts
              index = int(index_text)
              expected_length = int(length_text)
              if index != len(parsed_rows):
                  raise SystemExit("M28 payload row ordering mismatch")
              if len(digest) != 64 or any(character not in "0123456789abcdef" for character in digest):
                  raise SystemExit(f"M28 payload row digest format mismatch: {index}")
              encoded, repaired = repair_row(encoded, expected_length, digest, index)
              parsed_rows.append(encoded)
              if repaired:
                  repaired_rows.append(index)

          compact = "".join(parsed_rows)
          try:
              compressed = base64.b64decode(compact, validate=True)
          except binascii.Error as exc:
              raise SystemExit(f"M28 payload Base64 validation failed: {exc}") from exc
          observed_archive_sha256 = hashlib.sha256(compressed).hexdigest()
          if observed_archive_sha256 != expected_archive_sha256:
              raise SystemExit(
                  "M28 payload digest mismatch: "
                  f"{observed_archive_sha256} != {expected_archive_sha256}"
              )
          try:
              archive_bytes = bz2.decompress(compressed)
          except OSError as exc:
              raise SystemExit(f"M28 payload decompression failed: {exc}") from exc

          if payload_root.exists():
              shutil.rmtree(payload_root)
          staging.mkdir(parents=True)

          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:") as archive:
              members = archive.getmembers()
              observed_names = [member.name for member in members]
              if observed_names != list(expected_files):
                  raise SystemExit("M28 payload member inventory mismatch")
              for member in members:
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or any(part in ("", ".", "..") for part in member.name.split("/"))
                      or not member.isfile()
                      or member.issym()
                      or member.islnk()
                  ):
                      raise SystemExit(f"unsafe M28 payload member: {member.name}")
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"missing M28 payload member data: {member.name}")
                  raw = source.read()
                  record = expected_files[member.name]
                  if len(raw) != record["bytes"]:
                      raise SystemExit(f"M28 payload byte count mismatch: {member.name}")
                  if hashlib.sha256(raw).hexdigest() != record["raw_sha256"]:
                      raise SystemExit(f"M28 payload file digest mismatch: {member.name}")
                  destination = staging.joinpath(*path.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(raw)

          for relative, record in expected_files.items():
              source = staging.joinpath(*PurePosixPath(relative).parts)
              destination = Path(relative)
              if destination.exists() and destination.is_symlink():
                  raise SystemExit(f"refusing M28 symlink destination: {relative}")
              destination.parent.mkdir(parents=True, exist_ok=True)
              os.replace(source, destination)
              raw = destination.read_bytes()
              if len(raw) != record["bytes"] or hashlib.sha256(raw).hexdigest() != record["raw_sha256"]:
                  raise SystemExit(f"installed M28 source mismatch: {relative}")

          print(f"M28 payload archive sha256: {observed_archive_sha256}")
          print(f"M28 source files installed: {len(expected_files)}")
          print(f"M28 payload rows repaired: {repaired_rows}")
          PY

      - name: Validate the extracted M28 source and immutable vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile frp_m28_trace_observatory_upstream_interchange.py
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("frp_m28_trace_observatory_upstream_interchange.py"),
              Path("tests/test_frp_m28_trace_observatory_upstream_interchange.py"),
          ]
          forbidden = "-1/0/" + "+1"
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if forbidden in text:
                  raise SystemExit(f"forbidden ternary notation in {path}")
          print("M28 extracted source and immutable vocabulary: PASS")
          PY

      - name: Generate two byte-identical complete M28 sets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/m28_generation_a /tmp/m28_generation_b
          mkdir -p /tmp/m28_generation_a /tmp/m28_generation_b
          python frp_m28_trace_observatory_upstream_interchange.py \
            --generate \
            --repository-root . \
            --output-root /tmp/m28_generation_a \
            --source-commit "$M28_SOURCE_COMMIT" \
            --output /tmp/m28_generation_a.json \
            2>&1 | tee /tmp/m28_generation_a.log
          python frp_m28_trace_observatory_upstream_interchange.py \
            --generate \
            --repository-root . \
            --output-root /tmp/m28_generation_b \
            --source-commit "$M28_SOURCE_COMMIT" \
            --output /tmp/m28_generation_b.json \
            2>&1 | tee /tmp/m28_generation_b.log
          diff --recursive --brief /tmp/m28_generation_a /tmp/m28_generation_b
          cmp --silent /tmp/m28_generation_a.json /tmp/m28_generation_b.json
          find /tmp/m28_generation_a -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee /tmp/m28_deterministic_sha256.txt

      - name: Generate the complete canonical M28 repository set
        shell: bash
        run: |
          set -euo pipefail
          python frp_m28_trace_observatory_upstream_interchange.py \
            --generate \
            --repository-root . \
            --output-root . \
            --source-commit "$M28_SOURCE_COMMIT" \
            --output /tmp/m28_generation.json \
            2>&1 | tee /tmp/m28_generation.log

      - name: Run focused M28 qualification tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_frp_m28_trace_observatory_upstream_interchange \
            2>&1 | tee /tmp/m28_focused_tests.log
          python frp_m28_trace_observatory_upstream_interchange.py \
            --verify \
            --repository-root . \
            --source-commit "$M28_SOURCE_COMMIT" \
            --output /tmp/m28_verification.json \
            2>&1 | tee /tmp/m28_verification.log
          python frp_m28_trace_observatory_upstream_interchange.py \
            --self-test \
            --repository-root . \
            --source-commit "$M28_SOURCE_COMMIT" \
            --output /tmp/m28_self_test.json \
            2>&1 | tee /tmp/m28_self_test.log

      - name: Run the complete repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee /tmp/m28_full_regression.log

      - name: Validate the closed M28 repository boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path("frp_m28_trace_observatory_upstream_interchange.py"),
              Path("tests/test_frp_m28_trace_observatory_upstream_interchange.py"),
              Path("artifacts/m28/contracts/m28-trace-observatory-upstream-contract.json"),
              Path("artifacts/m28/exports/m28-observatory-canonical-trace-bundle.json"),
              Path("artifacts/m28/fixtures/m28-observatory-fixture-manifest.json"),
              Path("artifacts/m28/registry/m28-observatory-compatibility-registry.json"),
              Path("artifacts/m28/manifests/m28-trace-observatory-interchange-qualification.json"),
          ]
          required.extend(sorted(Path("schemas/m28").glob("*")))
          missing = [str(path) for path in required if not path.is_file() or path.is_symlink()]
          if missing:
              raise SystemExit(f"M28 required file boundary failed: {missing}")

          contract = json.loads(required[2].read_text(encoding="utf-8"))
          trace = json.loads(required[3].read_text(encoding="utf-8"))
          qualification = json.loads(required[6].read_text(encoding="utf-8"))
          core = contract["immutable_core"]
          if core["balanced_ternary_notation"] != "-1/0/1":
              raise SystemExit("M28 immutable ternary notation mismatch")
          if core["temporal_scheduler_modes"] != ["1/7", "7/1"]:
              raise SystemExit("M28 scheduler mode boundary mismatch")
          if contract["consumer_scaffold_baseline"]["repository"] != "FRP-Trace-Observatory":
              raise SystemExit("M28 Observatory repository boundary mismatch")
          if contract["consumer_scaffold_baseline"]["implementation_action"] != "extend_existing_scaffold":
              raise SystemExit("M28 existing scaffold boundary mismatch")
          if trace["record_count"] != 196 or trace["dataset_count"] != 3:
              raise SystemExit("M28 trace bundle boundary mismatch")
          if qualification["check_count"] != 30 or qualification["failed_count"] != 0:
              raise SystemExit("M28 qualification boundary mismatch")
          if required[3].stat().st_size > 600000:
              raise SystemExit("M28 canonical trace bundle exceeds the bounded file size")
          print("M28 closed repository boundary: PASS")
          PY

          while IFS= read -r status_path; do
            changed_path="${status_path:3}"
            case "$changed_path" in
              frp_m28_trace_observatory_upstream_interchange.py|\
              schemas/m28/*|\
              artifacts/m28/*|\
              tests/test_frp_m28_trace_observatory_upstream_interchange.py)
                ;;
              *)
                echo "Unexpected working-tree change during M28: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git status --porcelain=v1)

      - name: Create the complete M28 qualification commit and publish main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            frp_m28_trace_observatory_upstream_interchange.py \
            schemas/m28 \
            artifacts/m28 \
            tests/test_frp_m28_trace_observatory_upstream_interchange.py

          while IFS= read -r staged_path; do
            case "$staged_path" in
              frp_m28_trace_observatory_upstream_interchange.py|\
              schemas/m28/*|\
              artifacts/m28/*|\
              tests/test_frp_m28_trace_observatory_upstream_interchange.py)
                ;;
              *)
                echo "Unexpected staged M28 path: $staged_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          if git diff --cached --quiet; then
            echo "M28 canonical qualification is already committed; no commit is required."
            exit 0
          fi

          git commit \
            -m "Add M28 Trace Observatory upstream interchange" \
            -m "Publish a deterministic one-way FRP upstream interchange for the existing FRP Trace Observatory scaffold. Preserve exact source order, raw SHA-256 provenance, the immutable -1/0/1 core, active neutral state 0, and 1/7 and 7/1 temporal scheduling across Artifact Auditor, Trace Explorer, and Ternary Transition Visualizer inputs."
          git push origin HEAD:main

      - name: Retain complete M28 qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frp-m28-trace-observatory-upstream-interchange-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/m28_generation_a.json
            /tmp/m28_generation_b.json
            /tmp/m28_generation_a.log
            /tmp/m28_generation_b.log
            /tmp/m28_deterministic_sha256.txt
            /tmp/m28_generation.json
            /tmp/m28_generation.log
            /tmp/m28_focused_tests.log
            /tmp/m28_verification.json
            /tmp/m28_verification.log
            /tmp/m28_self_test.json
            /tmp/m28_self_test.log
            /tmp/m28_full_regression.log
