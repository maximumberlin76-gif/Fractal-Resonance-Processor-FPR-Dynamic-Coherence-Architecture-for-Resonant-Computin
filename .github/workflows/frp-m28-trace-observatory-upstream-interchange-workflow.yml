name: FRP M28 Trace Observatory Upstream Interchange

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m28-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-m28:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M28_PAYLOAD_ROOT: /tmp/frp_m28_creation
      M28_SOURCE_COMMIT: 23e464206f85cd9473101d9221027ee33d9dd094
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python --version
          python -m pip show jsonschema

      - name: Validate the immutable M27 to M28 source boundary
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${M28_SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$M28_SOURCE_COMMIT" HEAD
          test "$(git show -s --format=%s "$M28_SOURCE_COMMIT")" = "Add M27 long-run stability and telemetry qualification"
          test "$(git rev-parse "$M28_SOURCE_COMMIT")" = "$M28_SOURCE_COMMIT"

          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/frp-m28-trace-observatory-upstream-interchange-workflow.yml|\
              frp_m28_trace_observatory_upstream_interchange.py|\
              schemas/m28/*|\
              artifacts/m28/*|\
              tests/test_frp_m28_trace_observatory_upstream_interchange.py)
                ;;
              *)
                echo "Unexpected change after the exact M27 boundary: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$M28_SOURCE_COMMIT"..HEAD)

          test -f .github/workflows/frp-m28-trace-observatory-upstream-interchange-workflow.yml

