          xywAAA==
          BLOCK_PAYLOAD
          }

          block_base64 | tr -d '[:space:]' | base64 --decode | gzip --decompress --stdout > /tmp/m31d13-project-structure-current.md
          test "$(wc -c < /tmp/m31d13-project-structure-current.md)" -eq "$BLOCK_BYTES"
          test "$(sha256sum /tmp/m31d13-project-structure-current.md | cut -d' ' -f1)" = "$BLOCK_SHA256"

          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          source = Path(os.environ["TARGET_PATH"]).read_bytes()
          block = Path("/tmp/m31d13-project-structure-current.md").read_bytes()
          marker = "# Repository Structure — Fractal Resonance Processor (FRP)\n\n".encode()
          if not source.startswith(marker) or source.count(marker) != 1:
              raise SystemExit("PROJECT_STRUCTURE.md insertion boundary mismatch")
          rendered = marker + block + source[len(marker):]
          expected = (int(os.environ["TARGET_BYTES"]), os.environ["TARGET_SHA256"])
          if (len(rendered), hashlib.sha256(rendered).hexdigest()) != expected:
              raise SystemExit("rendered PROJECT_STRUCTURE.md identity mismatch")
          if rendered.count(b"\n") != int(os.environ["TARGET_LINES"]):
              raise SystemExit("rendered PROJECT_STRUCTURE.md line-count mismatch")
          Path("/tmp/PROJECT_STRUCTURE.md").write_bytes(rendered)
          PY

          install -m 0644 /tmp/PROJECT_STRUCTURE.md "$TARGET_PATH"
          echo "Complete M31 PROJECT_STRUCTURE.md installed: PASS"

      - name: Qualify structure, links, and preservation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path

          raw = Path(os.environ["TARGET_PATH"]).read_bytes()
          expected = (int(os.environ["TARGET_BYTES"]), os.environ["TARGET_SHA256"])
          if (len(raw), hashlib.sha256(raw).hexdigest()) != expected:
              raise SystemExit("PROJECT_STRUCTURE.md target identity mismatch")

          marker = "# Repository Structure — Fractal Resonance Processor (FRP)\n\n".encode()
          block_end = len(marker) + int(os.environ["BLOCK_BYTES"])
          current = raw[len(marker):block_end]
          reconstructed = raw[:len(marker)] + raw[block_end:]
          source_expected = (int(os.environ["SOURCE_BYTES"]), os.environ["SOURCE_SHA256"])
          if (len(reconstructed), hashlib.sha256(reconstructed).hexdigest()) != source_expected:
              raise SystemExit("historical PROJECT_STRUCTURE.md bytes were not preserved")

          text = raw.decode("utf-8")
          required = (
              "## Current Repository Structure — FRP v3.3.0 / M31",
              "FRP v3.3.0 / M31 — PASS",
              "-1/0/1",
              "## Current Root Control Files",
              "## Current Directory Map",
              "## M17–M31 Source and Qualification Registry",
              "## Current M31 Canonical Publication Boundary",
              "60 / 60 PASS",
              "one-way, read-only interchange",
              "## Preserved Repository Structure History Through M30",
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f"PROJECT_STRUCTURE.md records missing: {missing}")
          if "-1/0/" + chr(43) + "1" in text:
              raise SystemExit("forbidden ternary notation present")

          links = re.findall(r"\]\(([^)]+)\)", current.decode("utf-8"))
          if len(links) != 88 or len(set(links)) != 85:
              raise SystemExit("project-structure link registry count mismatch")
          missing_links = []
          for value in sorted(set(links)):
              target = Path(value.rstrip("/"))
              valid = target.is_dir() if value.endswith("/") else target.is_file()
              if not valid:
                  missing_links.append(value)
          if missing_links:
              raise SystemExit(f"PROJECT_STRUCTURE.md link targets missing: {missing_links}")

          changed = subprocess.check_output(["git", "diff", "--name-only"]).decode().splitlines()
          if changed not in ([os.environ["TARGET_PATH"]], []):
              raise SystemExit(f"unexpected worktree changes: {changed}")
          print("PROJECT_STRUCTURE.md M31 structure and historical preservation: PASS")
          PY

          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          tree_inventory artifacts > /tmp/m31d13-artifacts.after
          tree_inventory benchmarks > /tmp/m31d13-benchmarks.after
          tree_inventory schemas > /tmp/m31d13-schemas.after
          historical_inventory > /tmp/m31d13-history.after
          cmp --silent /tmp/m31d13-artifacts.before /tmp/m31d13-artifacts.after
          cmp --silent /tmp/m31d13-benchmarks.before /tmp/m31d13-benchmarks.after
          cmp --silent /tmp/m31d13-schemas.before /tmp/m31d13-schemas.after
          cmp --silent /tmp/m31d13-history.before /tmp/m31d13-history.after
          echo "Evidence, benchmark, schema, and release histories: BYTE-IDENTICAL"

      - name: Commit and publish PROJECT_STRUCTURE.md
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          if git diff --cached --quiet; then
            test -z "$(git status --porcelain)"
            echo "Complete M31 PROJECT_STRUCTURE.md is already published."
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "$TARGET_PATH"
          git commit -m "Align PROJECT_STRUCTURE.md with FRP v3.3.0 M31"
          git push origin HEAD:main

      - name: Verify published state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
          test "$(wc -l < "$TARGET_PATH")" -eq "$TARGET_LINES"
          test "$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)" = "$TARGET_SHA256"
          {
            echo "## FRP M31D13 Project Structure v3.3.0"
            echo
            echo "- Updated file: PROJECT_STRUCTURE.md"
            echo "- Current repository map: M17 through M31"
            echo "- Existing structure history: byte-identical"
            echo "- M31 focused tests: 60 / 60 PASS"
            echo "- Protected histories: byte-identical"
            echo "- Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
