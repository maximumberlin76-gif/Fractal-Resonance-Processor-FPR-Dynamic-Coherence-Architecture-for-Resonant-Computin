name: FRP M31D13 Project Structure v3.3.0

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m31d13-project-structure-v3-3-0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-project-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_PATH: PROJECT_STRUCTURE.md
      SOURCE_BYTES: "64391"
      SOURCE_LINES: "2269"
      SOURCE_SHA256: dab46be1d1e1db3c6ebe03b2ee629b677c328021d599e604a682c527cd2bc4b1
      TARGET_BYTES: "75854"
      TARGET_LINES: "2388"
      TARGET_SHA256: 17adf275c6af9996e7af9e2e36982893b9d0d60c297d6458d90854b01424c02d
      BLOCK_BYTES: "11463"
      BLOCK_SHA256: 9c8331c78b9380080f3d5858a8dca170828be80d63ac467d918611033da7f018
      ROADMAP_BYTES: "53373"
      ROADMAP_SHA256: 611570be05d0e3a0d514c08c3f2e163a0b37e40edc2898ad524e795112fb5e7a
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ github.ref_name }}" = "main"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          echo "Manual main-branch boundary: PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify source boundary and capture protected histories
        shell: bash
        run: |
          set -euo pipefail
          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }

          tree_inventory artifacts > /tmp/m31d13-artifacts.before
          tree_inventory benchmarks > /tmp/m31d13-benchmarks.before
          tree_inventory schemas > /tmp/m31d13-schemas.before
          historical_inventory > /tmp/m31d13-history.before

          while IFS= read -r path
          do
            test -f "$path"
            test ! -L "$path"
          done <<'REQUIRED_FILES'
          LICENSE
          README.md
          USAGE.md
          INSTALL.md
          REPRODUCIBILITY.md
          ROADMAP.md
          MILESTONES.md
          NOTICE.md
          CHANGELOG.md
          CI.md
          CONTRIBUTING.md
          SECURITY.md
          CODE_OF_CONDUCT.md
          FRP_VALIDATION_INDEX_v3_3_0.md
          RELEASE_NOTES_v3_3_0.md
          TEST_REPORT_v3_3_0.md
          requirements.txt
          frp_m31_phase_interference_thermal_evidence.py
          tests/test_frp_m31_phase_interference_thermal_evidence.py
          schemas/m31/frp.m31.phase_interference_active_zero_thermal_evidence.v1.schema.json
          artifacts/m31/evidence/m31-phase-interference-active-zero-thermal-evidence.json
          artifacts/m31/manifests/m31-phase-interference-active-zero-thermal-evidence-manifest.json
          artifacts/m31/qualification/m31-phase-interference-active-zero-thermal-evidence-qualification.json
          artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
          REQUIRED_FILES

          test "$(wc -c < ROADMAP.md)" -eq "$ROADMAP_BYTES"
          test "$(sha256sum ROADMAP.md | cut -d' ' -f1)" = "$ROADMAP_SHA256"

          test -f "$TARGET_PATH"
          test ! -L "$TARGET_PATH"
          current_sha="$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)"
          if test "$current_sha" = "$SOURCE_SHA256"; then
            test "$(wc -c < "$TARGET_PATH")" -eq "$SOURCE_BYTES"
            test "$(wc -l < "$TARGET_PATH")" -eq "$SOURCE_LINES"
          elif test "$current_sha" = "$TARGET_SHA256"; then
            test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
            test "$(wc -l < "$TARGET_PATH")" -eq "$TARGET_LINES"
          else
            echo "PROJECT_STRUCTURE.md boundary mismatch: $current_sha" >&2
            exit 1
          fi
          echo "Source boundary and protected histories: PASS"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run all 60 focused M31 qualification tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_frp_m31_phase_interference_thermal_evidence -v 2>&1 | tee /tmp/m31d13-tests.log
          grep -F "Ran 60 tests" /tmp/m31d13-tests.log
          grep -Fx "OK" /tmp/m31d13-tests.log

      - name: Install complete PROJECT_STRUCTURE.md
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)"
          if test "$current_sha" = "$TARGET_SHA256"; then
            echo "Complete M31 PROJECT_STRUCTURE.md is already installed."
            exit 0
          fi
          test "$current_sha" = "$SOURCE_SHA256"

          block_base64() {
            cat <<'BLOCK_PAYLOAD'
          H4sIAAAAAAACA8Va23LjuBF911ewal/iKkO2rBmPJ3nS2PKsUr6tJG8uWykMTEISMyShgKBm
