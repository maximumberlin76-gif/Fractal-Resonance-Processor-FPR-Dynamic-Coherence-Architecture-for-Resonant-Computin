name: FRP M31A1 Phase-Interference Thermal Evidence Source Part 1 Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m31a1-evidence-source-part-1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-m31-source-part-1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      M31_SOURCE_PATH: frp_m31_phase_interference_thermal_evidence.py
      M31_SOURCE_SHA256: 1e4ccfd7b157cd2bac609c34dfec9da791653a31af7b29b75502c755807b9c62
      M31_SOURCE_BYTES: "42092"
      M31_PART_PATH: .frp-bootstrap/m31/source.py.bz2.b64.part01
      M31_PART_SHA256: de590de358d074549d6efbdcb271e8163a0529d603b389489cbe52388423865b
      M31_PART_BYTES: "6000"
      M30_ARCHIVE_PATH: artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
      M30_ARCHIVE_SHA256: 05ea33f6f3f505d315af930c2d51779f7189905308473f32a57375e477069caa
      M30_CORE_WORKFLOW_PATH: .github/workflows/frp-m30-observatory-full-core-trace-qualification-workflow.yml
      M30_CORE_WORKFLOW_SHA256: 01ca22bc98f63d9d4ea4a58299d53ff58b410f3f2db94b81097d7cef3ad4dee7
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate the immutable M30 evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          required = {
              os.environ["M30_ARCHIVE_PATH"]: os.environ["M30_ARCHIVE_SHA256"],
              os.environ["M30_CORE_WORKFLOW_PATH"]: os.environ[
                  "M30_CORE_WORKFLOW_SHA256"
              ],
          }
          for name, expected in required.items():
              path = Path(name)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"required M30 boundary is missing: {name}")
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(f"M30 boundary digest mismatch: {name}")

          source = Path(os.environ["M31_SOURCE_PATH"])
          part = Path(os.environ["M31_PART_PATH"])
          if source.exists():
              if source.is_symlink() or not source.is_file():
                  raise SystemExit("invalid existing M31 producer source")
              raw = source.read_bytes()
              if len(raw) != int(os.environ["M31_SOURCE_BYTES"]):
                  raise SystemExit("existing M31 producer byte count mismatch")
              if hashlib.sha256(raw).hexdigest() != os.environ[
                  "M31_SOURCE_SHA256"
              ]:
                  raise SystemExit("existing M31 producer digest mismatch")
              if part.exists():
                  raise SystemExit(
                      "assembled M31 source and stale part 1 both exist"
                  )
              Path("/tmp/m31-source-already-complete").write_text(
                  "PASS\n", encoding="ascii"
              )
          print("Immutable M30 evidence boundary: PASS")
          PY

      - name: Install integrity-bound M31 producer payload part 1
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/m31-source-already-complete ]]; then
            echo "M31 producer source is already assembled."
            exit 0
          fi
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          payload = """"""
          raw = payload.encode("ascii")
          if len(raw) != int(os.environ["M31_PART_BYTES"]):
              raise SystemExit("M31 payload part 1 byte count mismatch")
          if hashlib.sha256(raw).hexdigest() != os.environ["M31_PART_SHA256"]:
              raise SystemExit("M31 payload part 1 digest mismatch")
          destination = Path(os.environ["M31_PART_PATH"])
          if destination.exists() and (
              destination.is_symlink() or not destination.is_file()
          ):
              raise SystemExit("refusing non-regular M31 part 1 destination")
          destination.parent.mkdir(parents=True, exist_ok=True)
          if destination.parent.is_symlink():
              raise SystemExit("refusing symlink M31 bootstrap directory")
          destination.write_bytes(raw)
          print("M31 producer payload part 1 installed: PASS")
          PY

      - name: Validate the exact staged payload boundary
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/m31-source-already-complete ]]; then
            exit 0
          fi
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          part = Path(os.environ["M31_PART_PATH"])
          if part.is_symlink() or not part.is_file():
              raise SystemExit("M31 payload part 1 is missing")
          raw = part.read_bytes()
          if len(raw) != int(os.environ["M31_PART_BYTES"]):
              raise SystemExit("M31 payload part 1 byte count mismatch")
          if hashlib.sha256(raw).hexdigest() != os.environ["M31_PART_SHA256"]:
              raise SystemExit("M31 payload part 1 digest mismatch")
          if any(byte not in (
              *range(ord("A"), ord("Z") + 1),
              *range(ord("a"), ord("z") + 1),
              *range(ord("0"), ord("9") + 1),
              ord("+"),
              ord("/"),
              ord("="),
          ) for byte in raw):
              raise SystemExit("M31 payload part 1 is not strict Base64 text")
          print("M31 payload part 1 boundary: PASS")
          PY

      - name: Commit and publish only M31 source payload part 1
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/m31-source-already-complete ]]; then
            echo "M31 producer source is already complete; no commit is required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$M31_PART_PATH"
          if git diff --cached --quiet; then
            echo "M31 producer payload part 1 is already committed."
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "$M31_PART_PATH"
          git commit \
            -m "Add M31 evidence producer payload part 1" \
            -m "Stage the first integrity-bound mobile-safe payload segment for the M31 FRP phase-interference, active-zero, and ternary-binary thermal evidence producer. Preserve the immutable -1/0/1 core, active neutral state 0, temporal schedulers 1/7 and 7/1, separate free service mode, distinct thermal measurement contours, and the one-way read-only Observatory boundary."
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish M31A1 summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## FRP M31A1 Evidence Producer Source"
            echo
            echo "| Boundary | Value |"
            echo "|---|---|"
            echo "| Repository | FRP |"
            echo "| Payload segment | 1 of 2 |"
            echo "| Segment bytes | 6000 |"
            echo "| Final source | frp_m31_phase_interference_thermal_evidence.py |"
            echo "| Balanced ternary kernel | -1/0/1 |"
            echo "| Active neutral state | 0 |"
            echo "| Temporal scheduler modes | 1/7, 7/1 |"
            echo "| Thermal contours | separate |"
            echo "| Observatory direction | upstream published bytes to downstream |"
            echo
            echo "Run M31A2 manually after this workflow is green."
          } >> "$GITHUB_STEP_SUMMARY"
