          test "$(wc -c < "$compact")" -eq "$BLOCK_BASE64_LENGTH"
          test "$(sha256sum "$compact" | cut -d' ' -f1)" = "$BLOCK_BASE64_SHA256"
          base64 --decode "$compact" > "$compressed"
          test "$(wc -c < "$compressed")" -eq "$BLOCK_GZIP_BYTES"
          test "$(sha256sum "$compressed" | cut -d' ' -f1)" = "$BLOCK_GZIP_SHA256"
          gzip --decompress --stdout "$compressed" > "$block"
          test "$(wc -c < "$block")" -eq "$BLOCK_BYTES"
          test "$(wc -l < "$block")" -eq "$BLOCK_LINES"
          test "$(sha256sum "$block" | cut -d' ' -f1)" = "$BLOCK_SHA256"

          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          source = Path(os.environ["TARGET_PATH"]).read_bytes()
          block = Path("/tmp/m31d12-roadmap-current.md").read_bytes()
          marker = "# Roadmap — Fractal Resonance Processor (FRP)\n\n".encode()
          if not source.startswith(marker) or source.count(marker) != 1:
              raise SystemExit("ROADMAP.md insertion boundary mismatch")
          rendered = marker + block + source[len(marker):]
          expected = (int(os.environ["TARGET_BYTES"]), os.environ["TARGET_SHA256"])
          observed = (len(rendered), hashlib.sha256(rendered).hexdigest())
          if observed != expected:
              raise SystemExit("rendered ROADMAP.md identity mismatch")
          if rendered.count(b"\n") != int(os.environ["TARGET_LINES"]):
              raise SystemExit("rendered ROADMAP.md line-count mismatch")
          Path("/tmp/ROADMAP.md").write_bytes(rendered)
          print("Deterministic ROADMAP.md composition: PASS")
          PY

          install -m 0644 "$rendered" "$TARGET_PATH"
          test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
          test "$(wc -l < "$TARGET_PATH")" -eq "$TARGET_LINES"
          test "$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)" = "$TARGET_SHA256"
          echo "Complete M31 ROADMAP.md installed: PASS"

      - name: Qualify ROADMAP.md content, links, and preserved history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["TARGET_PATH"])
          raw = path.read_bytes()
          expected = (int(os.environ["TARGET_BYTES"]), os.environ["TARGET_SHA256"])
          observed = (len(raw), hashlib.sha256(raw).hexdigest())
          if observed != expected:
              raise SystemExit("ROADMAP.md target identity mismatch")
          if raw.count(b"\n") != int(os.environ["TARGET_LINES"]):
              raise SystemExit("ROADMAP.md line-count mismatch")

          marker = "# Roadmap — Fractal Resonance Processor (FRP)\n\n".encode()
          block_end = len(marker) + int(os.environ["BLOCK_BYTES"])
          block = raw[len(marker):block_end]
          expected_block = (int(os.environ["BLOCK_BYTES"]), os.environ["BLOCK_SHA256"])
          observed_block = (len(block), hashlib.sha256(block).hexdigest())
          if observed_block != expected_block:
              raise SystemExit("current roadmap register identity mismatch")
          reconstructed_source = raw[:len(marker)] + raw[block_end:]
          expected_source = (int(os.environ["SOURCE_BYTES"]), os.environ["SOURCE_SHA256"])
          observed_source = (
              len(reconstructed_source),
              hashlib.sha256(reconstructed_source).hexdigest(),
          )
          if observed_source != expected_source:
              raise SystemExit("historical ROADMAP.md bytes were not preserved")

          text = raw.decode("utf-8")
          current = block.decode("utf-8")
          required = (
              "## Current Roadmap State — FRP v3.3.0 / M31",
              "FRP v3.3.0 / M31 — PASS",
              "M31 — Phase-Interference, Active-Zero, and Thermal-Evidence Publication",
              "-1/0/1",
              "60 / 60 PASS",
              "## Completed Architecture Progression",
