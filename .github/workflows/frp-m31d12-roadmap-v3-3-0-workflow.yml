              "FRP is the source of canonical published bytes.",
              "one-way, read-only boundary",
              "## Preserved Roadmap History Through M30",
              "Until these closure conditions are met, M30 remains a planned milestone",
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f"ROADMAP.md required records missing: {missing}")
          if "-1/0/" + chr(43) + "1" in text:
              raise SystemExit("ROADMAP.md forbidden ternary notation present")

          links = re.findall(r"\]\(([^)]+)\)", current)
          if len(links) != 89 or len(set(links)) != 73:
              raise SystemExit("current roadmap link registry count mismatch")
          missing_paths = [value for value in sorted(set(links)) if not Path(value).is_file()]
          if missing_paths:
              raise SystemExit(f"ROADMAP.md link targets missing: {missing_paths}")
          print("ROADMAP.md M0-M31 continuity, links, and historical bytes: PASS")
          PY

      - name: Prove protected histories are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          tree_inventory artifacts > /tmp/m31d12-artifacts.after
          tree_inventory benchmarks > /tmp/m31d12-benchmarks.after
          tree_inventory schemas > /tmp/m31d12-schemas.after
          historical_inventory > /tmp/m31d12-history.after
          cmp --silent /tmp/m31d12-artifacts.before /tmp/m31d12-artifacts.after
          cmp --silent /tmp/m31d12-benchmarks.before /tmp/m31d12-benchmarks.after
          cmp --silent /tmp/m31d12-schemas.before /tmp/m31d12-schemas.after
          cmp --silent /tmp/m31d12-history.before /tmp/m31d12-history.after
          echo "Evidence, benchmark, schema, and release histories: BYTE-IDENTICAL"

