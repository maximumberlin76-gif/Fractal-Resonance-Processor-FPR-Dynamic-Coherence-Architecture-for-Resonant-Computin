name: FRP M31A2 Phase-Interference Thermal Evidence Source Part 2 Workflow

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m31a2-evidence-source-part-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-m31-source-part-2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      M31_SOURCE_PATH: frp_m31_phase_interference_thermal_evidence.py
      M31_SOURCE_SHA256: 1e4ccfd7b157cd2bac609c34dfec9da791653a31af7b29b75502c755807b9c62
      M31_SOURCE_BYTES: "42092"
      M31_PART_1_PATH: .frp-bootstrap/m31/source.py.bz2.b64.part01
      M31_PART_1_SHA256: de590de358d074549d6efbdcb271e8163a0529d603b389489cbe52388423865b
      M31_PART_1_BYTES: "6000"
      M31_PART_2_PATH: .frp-bootstrap/m31/source.py.bz2.b64.part02
      M31_PART_2_SHA256: 5cdd8f05bfd21a8d7839c8d9426c32248569459ce3f4785249b24ddbf3f75f53
      M31_PART_2_BYTES: "6028"
      M30_ARCHIVE_PATH: artifacts/m30/packages/frp-v3.2.0-m30-archival-release.tar.gz
      M30_ARCHIVE_SHA256: 05ea33f6f3f505d315af930c2d51779f7189905308473f32a57375e477069caa
      M30_CORE_WORKFLOW_PATH: .github/workflows/frp-m30-observatory-full-core-trace-qualification-workflow.yml
      M30_CORE_WORKFLOW_SHA256: 01ca22bc98f63d9d4ea4a58299d53ff58b410f3f2db94b81097d7cef3ad4dee7
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate M30 and the committed M31A1 segment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          required = {
              os.environ["M30_ARCHIVE_PATH"]: os.environ["M30_ARCHIVE_SHA256"],
              os.environ["M30_CORE_WORKFLOW_PATH"]: os.environ[
                  "M30_CORE_WORKFLOW_SHA256"
              ],
          }
          for name, expected in required.items():
              path = Path(name)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"required M30 boundary is missing: {name}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  raise SystemExit(f"M30 boundary digest mismatch: {name}")

          source = Path(os.environ["M31_SOURCE_PATH"])
          part_1 = Path(os.environ["M31_PART_1_PATH"])
          part_2 = Path(os.environ["M31_PART_2_PATH"])
          if source.exists():
              if source.is_symlink() or not source.is_file():
                  raise SystemExit("invalid existing M31 producer source")
              raw = source.read_bytes()
              if len(raw) != int(os.environ["M31_SOURCE_BYTES"]):
                  raise SystemExit("existing M31 producer byte count mismatch")
              if hashlib.sha256(raw).hexdigest() != os.environ[
                  "M31_SOURCE_SHA256"
              ]:
                  raise SystemExit("existing M31 producer digest mismatch")
              if part_1.exists() or part_2.exists():
                  raise SystemExit("assembled M31 source and stale parts coexist")
              Path("/tmp/m31-source-already-complete").write_text(
                  "PASS\n", encoding="ascii"
              )
          else:
              if part_1.is_symlink() or not part_1.is_file():
                  raise SystemExit("M31A1 payload part 1 is missing")
              raw = part_1.read_bytes()
              if len(raw) != int(os.environ["M31_PART_1_BYTES"]):
                  raise SystemExit("M31A1 payload part 1 byte count mismatch")
              if hashlib.sha256(raw).hexdigest() != os.environ[
                  "M31_PART_1_SHA256"
              ]:
                  raise SystemExit("M31A1 payload part 1 digest mismatch")
          print("M31A1 sequential boundary: PASS")
          PY

      - name: Install integrity-bound M31 producer payload part 2
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/m31-source-already-complete ]]; then
            echo "M31 producer source is already assembled."
            exit 0
          fi
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          payload_segments = (
              """""",
              """""",
              """""",
          )
          segment_expectations = (
              (
                  2010,
                  "ec41bff3d977000ab1fe9a9d6e0bba5e8a630e7d50a42c1412135a7673df9932",
              ),
              (
                  2010,
                  "ad63fced75d9c3045debf18b3667ae926b460b7f15d148763e6256646dd48cd8",
              ),
              (
                  2008,
                  "8add72eccd1accf54a22395b0c852dbe0220845d03ef6b3b3cf60e36fee217e4",
              ),
          )
          raw_segments = []
          for index, (segment, expectation) in enumerate(
              zip(payload_segments, segment_expectations, strict=True), start=1
          ):
              raw_segment = segment.encode("ascii")
              expected_bytes, expected_digest = expectation
              if len(raw_segment) != expected_bytes:
                  raise SystemExit(
                      f"M31 payload part 2 segment {index} byte count mismatch"
                  )
              if hashlib.sha256(raw_segment).hexdigest() != expected_digest:
                  raise SystemExit(
                      f"M31 payload part 2 segment {index} digest mismatch"
                  )
              raw_segments.append(raw_segment)
          raw = b"".join(raw_segments)
          if len(raw) != int(os.environ["M31_PART_2_BYTES"]):
              raise SystemExit("M31 payload part 2 byte count mismatch")
          if hashlib.sha256(raw).hexdigest() != os.environ[
              "M31_PART_2_SHA256"
          ]:
              raise SystemExit("M31 payload part 2 digest mismatch")
          destination = Path(os.environ["M31_PART_2_PATH"])
          if destination.exists() and (
              destination.is_symlink() or not destination.is_file()
          ):
              raise SystemExit("refusing non-regular M31 part 2 destination")
          destination.parent.mkdir(parents=True, exist_ok=True)
          if destination.parent.is_symlink():
              raise SystemExit("refusing symlink M31 bootstrap directory")
          destination.write_bytes(raw)
          print("M31 producer payload part 2 installed: PASS")
          PY

      - name: Validate the complete two-part payload boundary
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/m31-source-already-complete ]]; then
            exit 0
          fi
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          for path_name, size_name, digest_name in (
              ("M31_PART_1_PATH", "M31_PART_1_BYTES", "M31_PART_1_SHA256"),
              ("M31_PART_2_PATH", "M31_PART_2_BYTES", "M31_PART_2_SHA256"),
          ):
              part = Path(os.environ[path_name])
              if part.is_symlink() or not part.is_file():
                  raise SystemExit(f"M31 payload segment missing: {part}")
              raw = part.read_bytes()
              if len(raw) != int(os.environ[size_name]):
                  raise SystemExit(f"M31 payload segment size mismatch: {part}")
              if hashlib.sha256(raw).hexdigest() != os.environ[digest_name]:
                  raise SystemExit(
                      f"M31 payload segment digest mismatch: {part}"
                  )
          print("M31 complete two-part payload boundary: PASS")
          PY

      - name: Commit and publish only M31 source payload part 2
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/m31-source-already-complete ]]; then
            echo "M31 producer source is already complete; no commit is required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$M31_PART_2_PATH"
          if git diff --cached --quiet; then
            echo "M31 producer payload part 2 is already committed."
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "$M31_PART_2_PATH"
          git commit -m "Add M31 evidence producer payload part 2" -m "Stage the second integrity-bound mobile-safe payload segment for the M31 FRP phase-interference, active-zero, and ternary-binary thermal evidence producer. Preserve the immutable -1/0/1 core, active neutral state 0, temporal schedulers 1/7 and 7/1, separate free service mode, distinct thermal measurement contours, and the one-way read-only Observatory boundary."
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Publish M31A2 summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## FRP M31A2 Evidence Producer Source"
            echo
            echo "| Boundary | Value |"
            echo "|---|---|"
            echo "| Repository | FRP |"
            echo "| Payload segment | 2 of 2 |"
            echo "| Segment bytes | 6028 |"
            echo "| Combined Base64 bytes | 12028 |"
            echo "| Final source | frp_m31_phase_interference_thermal_evidence.py |"
            echo "| Balanced ternary kernel | -1/0/1 |"
            echo "| Active neutral state | 0 |"
            echo "| Temporal scheduler modes | 1/7, 7/1 |"
            echo "| Thermal contours | separate |"
            echo
            echo "Run M31A3 manually after this workflow is green."
          } >> "$GITHUB_STEP_SUMMARY"
