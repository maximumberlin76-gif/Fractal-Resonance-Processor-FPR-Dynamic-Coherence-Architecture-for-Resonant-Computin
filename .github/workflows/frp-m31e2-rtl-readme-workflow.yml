name: FRP M31E2 RTL README

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m31e2-rtl-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-m31-rtl-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_PATH: rtl/m31/README.md
      TARGET_BYTES: "15565"
      TARGET_LINES: "474"
      TARGET_SHA256: 75f0d94b2ceacbf356f336701f7a885fc036b0859806ac5f953b1b10c1f826f0
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ github.ref_name }}" = "main"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          echo "Manual main-branch boundary: PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify exact RTL source and capture protected histories
        shell: bash
        run: |
          set -euo pipefail

          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          historical_inventory() {
            find . -maxdepth 1 -type f \
              \( -name 'RELEASE_NOTES_v*.md' \
                 -o -name 'TEST_REPORT_v*.md' \
                 -o -name 'FRP_VALIDATION_INDEX_v*.md' \
                 -o -name 'RELEASE_CHECKLIST_v*.md' \) \
              -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          protected_rtl_inventory() {
            find rtl -type f ! -path "$TARGET_PATH" -print0 \
              | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          check_identity() {
            path="$1"
            bytes="$2"
            digest="$3"
            test -f "$path"
            test ! -L "$path"
            test "$(wc -c < "$path")" -eq "$bytes"
            test "$(sha256sum "$path" | cut -d' ' -f1)" = "$digest"
          }

          test -d rtl/m31
          test ! -L rtl
          test ! -L rtl/m31
          test "$(find rtl/m31 -maxdepth 1 -type f ! -name README.md | wc -l)" -eq 20
          test "$(find rtl/m31 -maxdepth 1 -type f -name '*.sv' | wc -l)" -eq 18
          test "$(wc -l < rtl/m31/frp_m31_sin_q30.mem)" -eq 4096

          while IFS='|' read -r path bytes digest
          do
            check_identity "$path" "$bytes" "$digest"
          done <<'M31_RTL_IDENTITIES'
          rtl/m31/frp_m31.f|40|9f8d99d47f1545f2763b9ac63f46b571b5f8cc6f6eaaabaa978fd5810e9fe6f0
          rtl/m31/frp_m31_active_neutral.sv|25909|765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0
          rtl/m31/frp_m31_assertions.sv|24366|16a6abea57d2161a58ad5660c62f86cf057e65dbb1d9ae76e355e912a378077b
          rtl/m31/frp_m31_capacity_guard.sv|20787|d0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123
          rtl/m31/frp_m31_core.sv|9019|92d394a0838515a6e00c0c5c5330edf42077b5d75d290d05ac73dd4f06e1510c
          rtl/m31/frp_m31_execution_core.sv|33724|e516a5cd378bd2ddecdadc5abb13ddef26c63fafe5bda65b47a6bd859ca66f92
          rtl/m31/frp_m31_execution_tb.sv|16492|53d0f4f0d723aec2d39e52ba28e0cbb952e7afc0804de0e252d1b990221fbb6c
          rtl/m31/frp_m31_fixed_point_pkg.sv|7278|6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24
          rtl/m31/frp_m31_pending_routes.sv|17005|18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411
          rtl/m31/frp_m31_phase_interference.sv|11245|e8ceb80feb0b30db5e28d70bc4d68d51506da4d596b46a73c0137465d1455fe0
          rtl/m31/frp_m31_phase_request_adapter.sv|2251|fa78bcfe965270cc74855908aa392989d857575a2097a126539aabb1aab8990d
          rtl/m31/frp_m31_phase_thermal_assertions.sv|3783|fe7b06073e65fc64acf7232038911230db27fe3a5ce000d0e1d421e2f49b1b3b
          rtl/m31/frp_m31_pkg.sv|18531|762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94
          rtl/m31/frp_m31_request_lanes.sv|18290|32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109
          rtl/m31/frp_m31_scheduler.sv|10560|fc9de24b41736e5c5a9f9e464318c80adbfda9dc8cc4362c0c55bfed403bf97f
          rtl/m31/frp_m31_sin_q30.mem|36864|adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d
          rtl/m31/frp_m31_stability.sv|2203|69c06833e6dfbb28e25b74a5787dcd03756dddf0f66726de3ea47c1ad2931931
          rtl/m31/frp_m31_state_update.sv|18147|ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90
          rtl/m31/frp_m31_tb.sv|9679|3e6bc290634159b77d27e4970827b856f95c0988c269542abfd36e0bfb49fb93
          rtl/m31/frp_m31_thermal_proxy.sv|1883|34df4ebfc5dfad8e3e5e454e560404585de5c881e6f75abaae367d3bd9fb11bd
          M31_RTL_IDENTITIES

          tree_inventory artifacts > /tmp/m31e2-artifacts.before
          tree_inventory benchmarks > /tmp/m31e2-benchmarks.before
          tree_inventory schemas > /tmp/m31e2-schemas.before
          tree_inventory fpga > /tmp/m31e2-fpga.before
          protected_rtl_inventory > /tmp/m31e2-protected-rtl.before
          historical_inventory > /tmp/m31e2-history.before

          if test -e "$TARGET_PATH"; then
            check_identity "$TARGET_PATH" "$TARGET_BYTES" "$TARGET_SHA256"
          fi

          echo "Exact M31 RTL source and protected histories: PASS"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run all 60 focused M31 qualification tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_frp_m31_phase_interference_thermal_evidence -v \
            2>&1 | tee /tmp/m31e2-python-tests.log
          grep -F "Ran 60 tests" /tmp/m31e2-python-tests.log
          grep -Fx "OK" /tmp/m31e2-python-tests.log

      - name: Assemble exact M31 RTL README
        shell: bash
        run: |
          set -euo pipefail
          umask 022

          cat > /tmp/frp-m31-readme.md <<'FRP_M31_README_DOCUMENT'
          # FRP M31 Phase-Interference RTL Contour
          
          ## Version
          
          `FRP v3.3.0`
          
          ## Milestone
          
          `M31 — Phase-Interference, Active-Zero, Thermal, and Stability RTL`
          
          ## Processor
          
          `FRP — Ternary Fractal Resonant Coherence Processor`
          
          ## RTL Boundary
          
          The M31 RTL contour implements the retained relative-phase, resonance-selection,
          balanced ternary execution, thermal-proxy, and stability path in SystemVerilog.
          
          The integrated contour begins with retained phase and frequency words, computes
          relative-phase interactions and coherence observables, derives balanced ternary
          targets, executes those targets through active computational zero, and exposes
          the resulting activity, thermal, and stability observables.
          
          Integrated chain:
          
          `retained phase and frequency`
          
          → `relative-phase interaction`
          
          → `pair, cluster, and global coherence`
          
          → `resonance projection and ternary target`
          
          → `deterministic request-lane selection`
          
          → `active-zero balanced ternary execution`
          
          → `retained state and pending route`
          
          → `normalized thermal proxy`
          
          → `coherence capacity, pressure, and stability margin`
          
          ## Qualification Profile
          
          | Property | Qualified value |
          |---|---:|
          | Retained cells | `8` |
          | Request lanes | `2` |
          | Transition fraction | `0.25` |
          | Temporal period | `8` ticks |
          | Trigonometric address width | `12` bits |
          | Trigonometric entries | `4096` |
          | Retained ternary states | `-1/0/1` |
          | Fixed-point domains | `S32Q16`, `S32Q30` |
          | Phase domain | `PHASE_U32` |
          | Coupling-control domain | `GAMMA_S32` |
          
          The eight-cell profile is the exact phase-interference qualification boundary
          implemented by `frp_m31_phase_interference`.
          
          ## Balanced Ternary State Domain
          
          The retained processor-state domain is:
          
          `{-1, 0, 1}`
          
          | State | Computational role |
          |---|---|
          | `-1` | negative, inhibitory, counter-phase, or suppressive potential |
          | `0` | active balancing, mediation, routing, damping, and stabilization state |
          | `1` | positive, excitatory, phase-supporting, or constructive potential |
          
          State `0` is an active computational state. It mediates polarity changes,
          retains the temporal separation between opposite states, and participates in
          the coherence-capacity calculation.
          
          ## Canonical Hardware Encoding
          
          | Ternary state | Two-bit encoding |
          |---|---|
          | `-1` | `2'b11` |
          | `0` | `2'b00` |
          | `1` | `2'b01` |
          | reserved | `2'b10` |
          
          The retained state, phase target, transition candidate, and pending-route
          domains share this encoding.
          
          ## Fixed-Point and Phase Domains
          
          | Type | Representation | Role |
          |---|---|---|
          | `frp_m31_s32q16_t` | signed 32-bit Q16 | frequency, coupling, thermal, pressure, and margin values |
          | `frp_m31_s32q30_t` | signed 32-bit Q30 | trigonometric, coherence, topology, and normalized factors |
          | `frp_m31_phase_u32_t` | unsigned 32-bit phase word | full-turn retained phase accumulator |
          | `frp_m31_gamma_s32_t` | signed 32-bit control word | effective coupling control |
          
          Canonical constants include:
          
          | Constant | Exact integer value |
          |---|---:|
          | Q16 one | `65536` |
          | Q30 one | `1073741824` |
          | Resonance target threshold Q30 | `354334802` |
          | Nominal gamma | `644245094` |
          | Nominal coupling Q16 | `18350` |
          | Delay alpha Q16 | `19661` |
          | Base frequency Q16 | `65536` |
          | Thermal decay Q30 | `1020054733` |
          | Thermal gain Q30 | `10737418` |
          
          Arithmetic helpers implement signed saturation and deterministic round-to-nearest
          conversion with half cases directed away from zero.
          
          ## Phase and Interference Path
          
          Each cell retains a 32-bit phase word and a signed Q16 frequency word. On an
          enabled tick, the phase engine combines:
          
          - retained phase and filtered frequency;
          - cell-state and switching contributions;
          - scheduler-state frequency push;
          - effective gamma control;
          - per-node thermal factor;
          - relative-phase sine interaction across the eight-cell topology.
          
          The topology uses three exact Q30 shell weights:
          
          | Topological distance | Q30 weight |
          |---:|---:|
          | `1` | `516461574` |
          | `2` | `158959695` |
          | `3` | `59840215` |
          
          The phase path publishes per-cell coupling fields and phase projections together
          with pair, cluster, and global coherence plus organization dispersion.
          
          ## Trigonometric Memory
          
          `frp_m31_sin_q30.mem` contains `4096` uppercase eight-hex-digit Q30 sine words.
          Address bits `phase_word[31:20]` select the sine value; a quarter-turn address
          offset selects cosine.
          
          The memory is derived exactly from the published M15 vector:
          
          [`artifacts/m18/m15_vectors/frp_m15_trig_lut_q30.vec`](../../artifacts/m18/m15_vectors/frp_m15_trig_lut_q30.vec)
          
          The installed memory SHA-256 is:
          
          `adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d`
          
          Qualified cardinal points are:
          
          | Address | Phase | Q30 value |
          |---:|---:|---:|
          | `0` | zero turn | `0` |
          | `1024` | quarter turn | `1073741824` |
          | `2048` | half turn | `0` |
          | `3072` | three-quarter turn | `-1073741824` |
          
          ## Resonance Selection
          
          The sine projection determines the balanced ternary phase target:
          
          | Projection relation | Target |
          |---|---|
          | `projection > 354334802` | `1` |
          | `projection < -354334802` | `-1` |
          | projection inside the inclusive threshold band | `0` |
          
          The phase-request adapter scans cells in ascending index order, respects
          retained pending routes and scheduler eligibility, and selects up to two phase
          targets for the qualified eight-cell profile.
          
          `auto_target_enable` selects the phase-derived request path. The external
          request and target ports remain available for deterministic execution control.
          
          ## Active-Zero Polarity Routing
          
          Opposite-polarity transitions are separated across eligible processor ticks:
          
          `-1 → 0 → 1`
          
          `1 → 0 → -1`
          
          The first leg enters active computational zero and retains the requested
          polarity in the pending-route bank. A later commit-capable tick completes the
          route from `0` and clears that pending slot.
          
          The integrated execution boundary records:
          
          `actual_direct_events = 0`
          
          `reserved_state_events = 0`
          
          `queue_overflow_events = 0`
          
          ## Temporal Scheduler
          
          The execution core supports three modes:
          
          | Mode | Eight-tick sequence | Commit-capable state | Neutralize-capable state |
          |---|---|---|---|
          | `free` | eight free ticks | `free` | `free` |
          | `7/1` | seven balance, one commit | `commit` | `balance` |
          | `1/7` | one excite, seven neutralize | `excite` | `neutralize` |
          
          Pending-route completion has priority over explicit requests. Requests are
          arbitrated in ascending lane order, and retained state from tick `N` becomes the
          input state for tick `N + 1`.
          
          ## Distributed Transition Capacity
          
          The execution boundary uses:
          
          `REQUEST_LANES = max(1, round(CELLS × 0.25))`
          
          | Cells | Request lanes |
          |---:|---:|
          | `8` | `2` |
          | `16` | `4` |
          | `32` | `8` |
          
          Capacity is consumed by retained-state changes. Pending-route completions are
          ordered first by ascending cell index, followed by accepted explicit requests
          in ascending lane order.
          
          ## Thermal and Stability Observables
          
          The thermal block integrates normalized switching cost through the common-RC
          comparative model and retains current and peak Q16 proxy values.
          
          The stability block combines:
          
          - global coherence;
          - cluster coherence;
          - the active-zero cell fraction;
          - current thermal proxy;
          - normalized switch load.
          
          It publishes `coherence_capacity_q16`, `pressure_q16`,
          `stability_margin_q16`, and `stable`. The qualified profile requires a positive
          stability margin after the deterministic transition sequence.
          
          ## Integrated Core Parameters
          
          | Parameter | Meaning | Default |
          |---|---|---:|
          | `CELLS` | retained phase and ternary cells | `8` |
          | `REQUEST_LANES` | admitted request lanes | derived as `2` |
          | `CELL_INDEX_BITS` | packed cell-index width | derived from `CELLS` |
          | `COUNTER_BITS` | telemetry counter width | `32` |
          | `SIN_LUT_FILE` | Q30 sine-memory path | `rtl/m31/frp_m31_sin_q30.mem` |
          
          ## Integrated Core Interface
          
          Control inputs:
          
          - `clk`, `rst_n`, `tick_enable`, and `clear_counters`;
          - `scheduler_mode`;
          - `phase_load_valid`.
          
          Phase-domain inputs:
          
          - `phase_load`;
          - `frequency_load_q16`;
          - `gamma_effective_word`;
          - `thermal_node_factor_q30`.
          
          Target-selection inputs:
          
          - `auto_target_enable`;
          - `external_request_valid`;
          - `external_request_cell_index`;
          - `external_request_target`;
          - `external_target_bank`.
          
          Phase and coherence outputs:
          
          - retained phase and current frequency;
          - coupling field and phase projection;
          - balanced ternary phase target;
          - pair, cluster, and global coherence;
          - organization dispersion.
          
          Execution outputs:
          
          - retained ternary state and pending-route bank;
          - scheduler state and recorded tick count;
          - accepted-change mask and count;
          - normalized switch-load numerator;
          - direct-transition, reserved-state, and queue-overflow counters;
          - integrated execution invariant flags.
          
          Thermal and stability outputs:
          
          - current and peak thermal proxy;
          - coherence capacity and pressure;
          - stability margin and stable flag.
          
          ## Source Inventory
          
          | File | Function |
          |---|---|
          | `frp_m31.f` | integrated source-list entry point for `frp_m31_core.sv` |
          | `frp_m31_pkg.sv` | canonical ternary, scheduler, transition, rejection, invariant, and capacity semantics |
          | `frp_m31_fixed_point_pkg.sv` | fixed-point types, exact constants, saturation, rounding, multiplication, topology, and phase conversion |
          | `frp_m31_scheduler.sv` | free, `7/1`, and `1/7` temporal scheduler and counters |
          | `frp_m31_request_lanes.sv` | deterministic request arbitration and pending-cell ownership |
          | `frp_m31_pending_routes.sv` | retained opposite-polarity target storage and completion clearing |
          | `frp_m31_active_neutral.sv` | active-zero transition classification and candidate generation |
          | `frp_m31_capacity_guard.sv` | distributed transition-capacity admission |
          | `frp_m31_state_update.sv` | capacity-approved retained-state writeback |
          | `frp_m31_execution_core.sv` | integrated scheduler, routing, capacity, and retained-state engine |
          | `frp_m31_assertions.sv` | execution-domain, scheduler, routing, capacity, and writeback assertions |
          | `frp_m31_execution_tb.sv` | deterministic execution-core qualification testbench |
          | `frp_m31_phase_interference.sv` | retained phase, relative-phase coupling, coherence, dispersion, and resonance targets |
          | `frp_m31_phase_request_adapter.sv` | phase-target to active-zero request-lane adapter |
          | `frp_m31_thermal_proxy.sv` | normalized common-RC switching-cost integration |
          | `frp_m31_stability.sv` | coherence-capacity, pressure, margin, and stable observables |
          | `frp_m31_core.sv` | complete retained-phase, active-zero, thermal, and stability integration |
          | `frp_m31_phase_thermal_assertions.sv` | integrated phase, coherence, target, ternary, and thermal assertions |
          | `frp_m31_tb.sv` | complete deterministic M31 RTL qualification testbench |
          | `frp_m31_sin_q30.mem` | exact 4096-entry Q30 trigonometric memory |
          
          `frp_m31.f` names `frp_m31_core.sv`; the guarded include graph rooted at that
          file supplies the complete integrated implementation.
          
          ## Assertion Layers
          
          The execution assertion layer checks:
          
          - canonical ternary encodings;
          - reset to active zero;
          - retained state and pending-route stability;
          - scheduler states and counter relations;
          - ascending request-lane arbitration;
          - transition classification and capacity;
          - tick-separated opposite-polarity routing;
          - pending-target retention and completion;
          - state writeback and integrated invariant flags.
          
          The phase and thermal assertion layer checks:
          
          - pair, cluster, and global coherence ranges;
          - organization-dispersion range;
          - resonance target selection at both thresholds;
          - active-zero target selection inside the threshold band;
          - current and peak thermal-proxy relation;
          - ternary retained-state validity;
          - tick-separated polarity writeback;
          - zero direct, reserved-state, and queue-overflow event counters.
          
          ## Deterministic Qualification
          
          The execution testbench covers all three scheduler modes, both opposite-polarity
          routes, pending-route retention and completion, two-lane capacity, counter
          clearing, retained-state continuity, and all integrated execution invariants.
          
          The complete testbench covers:
          
          - reset to active computational zero;
          - exact quarter-turn positive and three-quarter-turn negative projections;
          - positive and negative resonance targets;
          - populated relative-phase coupling;
          - automatic phase-target commit from zero;
          - opposite-polarity routing through zero;
          - pending-target completion and clearing;
          - thermal-proxy integration;
          - positive stability margin;
          - complete inherited execution invariant flags.
          
          ## Verilator Commands
          
          Run from the repository root.
          
          Integrated-core lint:
          
          ```
          verilator \
            --lint-only \
            --sv \
            -Wall \
            -Wno-fatal \
            --top-module frp_m31_core \
            -f rtl/m31/frp_m31.f
          ```
          
          Execution-core qualification:
          
          ```
          verilator \
            --binary \
            --sv \
            --timing \
            --assert \
            -Wall \
            -Wno-fatal \
            -CFLAGS "-std=c++20" \
            --top-module frp_m31_execution_tb \
            --Mdir build/frp-m31-execution \
            -Irtl/m31 \
            rtl/m31/frp_m31_execution_tb.sv
          
          build/frp-m31-execution/Vfrp_m31_execution_tb
          ```
          
          Complete M31 qualification:
          
          ```
          verilator \
            --binary \
            --sv \
            --timing \
            --assert \
            -Wall \
            -Wno-fatal \
            -CFLAGS "-std=c++20" \
            --top-module frp_m31_tb \
            --Mdir build/frp-m31-complete \
            -Irtl/m31 \
            rtl/m31/frp_m31_tb.sv
          
          build/frp-m31-complete/Vfrp_m31_tb
          ```
          
          ## Qualified Terminal Records
          
          Execution-core record:
          
          ```
          FRP M31 deterministic RTL testbench completed.
          CELLS=8 REQUEST_LANES=2
          ticks_recorded=16
