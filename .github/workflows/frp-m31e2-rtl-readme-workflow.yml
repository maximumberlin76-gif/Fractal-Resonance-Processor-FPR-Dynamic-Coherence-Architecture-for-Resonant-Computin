name: FRP M31E2 RTL README

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m31e2-rtl-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-m31-rtl-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_PATH: rtl/m31/README.md
      TARGET_BYTES: "15585"
      TARGET_LINES: "474"
      TARGET_SHA256: 45812ce0b7f21e25d9e523cb8f32cdfb8b9da6291561f66df77315671844c2ca
      PAYLOAD_GZIP_BYTES: "5307"
      PAYLOAD_GZIP_SHA256: b850de2fcc3ff235bf9b5ecc9b3d9b3f2dc003d1de35c06cd822f1afcb4516de
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Require manual main-branch execution
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ github.ref_name }}" = "main"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          echo "Manual main-branch boundary: PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify exact RTL source and capture protected histories
        shell: bash
        run: |
          set -euo pipefail

          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          historical_inventory() {
            find . -maxdepth 1 -type f \
              \( -name 'RELEASE_NOTES_v*.md' \
                 -o -name 'TEST_REPORT_v*.md' \
                 -o -name 'FRP_VALIDATION_INDEX_v*.md' \
                 -o -name 'RELEASE_CHECKLIST_v*.md' \) \
              -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          protected_rtl_inventory() {
            find rtl -type f ! -path "$TARGET_PATH" -print0 \
              | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          check_identity() {
            path="$1"
            bytes="$2"
            digest="$3"
            test -f "$path"
            test ! -L "$path"
            test "$(wc -c < "$path")" -eq "$bytes"
            test "$(sha256sum "$path" | cut -d' ' -f1)" = "$digest"
          }

          test -d rtl/m31
          test ! -L rtl
          test ! -L rtl/m31
          test "$(find rtl/m31 -maxdepth 1 -type f ! -name README.md | wc -l)" -eq 20
          test "$(find rtl/m31 -maxdepth 1 -type f -name '*.sv' | wc -l)" -eq 18
          test "$(wc -l < rtl/m31/frp_m31_sin_q30.mem)" -eq 4096

          while IFS='|' read -r path bytes digest
          do
            check_identity "$path" "$bytes" "$digest"
          done <<'M31_RTL_IDENTITIES'
          rtl/m31/frp_m31.f|40|9f8d99d47f1545f2763b9ac63f46b571b5f8cc6f6eaaabaa978fd5810e9fe6f0
          rtl/m31/frp_m31_active_neutral.sv|25909|765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0
          rtl/m31/frp_m31_assertions.sv|24366|16a6abea57d2161a58ad5660c62f86cf057e65dbb1d9ae76e355e912a378077b
          rtl/m31/frp_m31_capacity_guard.sv|20787|d0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123
          rtl/m31/frp_m31_core.sv|9019|92d394a0838515a6e00c0c5c5330edf42077b5d75d290d05ac73dd4f06e1510c
          rtl/m31/frp_m31_execution_core.sv|33724|e516a5cd378bd2ddecdadc5abb13ddef26c63fafe5bda65b47a6bd859ca66f92
          rtl/m31/frp_m31_execution_tb.sv|16492|53d0f4f0d723aec2d39e52ba28e0cbb952e7afc0804de0e252d1b990221fbb6c
          rtl/m31/frp_m31_fixed_point_pkg.sv|7278|6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24
          rtl/m31/frp_m31_pending_routes.sv|17005|18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411
          rtl/m31/frp_m31_phase_interference.sv|11245|e8ceb80feb0b30db5e28d70bc4d68d51506da4d596b46a73c0137465d1455fe0
          rtl/m31/frp_m31_phase_request_adapter.sv|2251|fa78bcfe965270cc74855908aa392989d857575a2097a126539aabb1aab8990d
          rtl/m31/frp_m31_phase_thermal_assertions.sv|3783|fe7b06073e65fc64acf7232038911230db27fe3a5ce000d0e1d421e2f49b1b3b
          rtl/m31/frp_m31_pkg.sv|18531|762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94
          rtl/m31/frp_m31_request_lanes.sv|18290|32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109
          rtl/m31/frp_m31_scheduler.sv|10560|fc9de24b41736e5c5a9f9e464318c80adbfda9dc8cc4362c0c55bfed403bf97f
          rtl/m31/frp_m31_sin_q30.mem|36864|adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d
          rtl/m31/frp_m31_stability.sv|2203|69c06833e6dfbb28e25b74a5787dcd03756dddf0f66726de3ea47c1ad2931931
          rtl/m31/frp_m31_state_update.sv|18147|ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90
          rtl/m31/frp_m31_tb.sv|9679|3e6bc290634159b77d27e4970827b856f95c0988c269542abfd36e0bfb49fb93
          rtl/m31/frp_m31_thermal_proxy.sv|1883|34df4ebfc5dfad8e3e5e454e560404585de5c881e6f75abaae367d3bd9fb11bd
          M31_RTL_IDENTITIES

          tree_inventory artifacts > /tmp/m31e2-artifacts.before
          tree_inventory benchmarks > /tmp/m31e2-benchmarks.before
          tree_inventory schemas > /tmp/m31e2-schemas.before
          tree_inventory fpga > /tmp/m31e2-fpga.before
          protected_rtl_inventory > /tmp/m31e2-protected-rtl.before
          historical_inventory > /tmp/m31e2-history.before

          if test -e "$TARGET_PATH"; then
            check_identity "$TARGET_PATH" "$TARGET_BYTES" "$TARGET_SHA256"
          fi

          echo "Exact M31 RTL source and protected histories: PASS"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run all 60 focused M31 qualification tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_frp_m31_phase_interference_thermal_evidence -v \
            2>&1 | tee /tmp/m31e2-python-tests.log
          grep -F "Ran 60 tests" /tmp/m31e2-python-tests.log
          grep -Fx "OK" /tmp/m31e2-python-tests.log

      - name: Assemble exact M31 RTL README
        shell: bash
        run: |
          set -euo pipefail
          umask 022

          cat > /tmp/frp-m31-readme.md.gz.b64 <<'FRP_M31_README_PAYLOAD'
