      - name: Qualify M31 RTL README
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          document = Path("/tmp/frp-m31-readme.md")
          text = document.read_text(encoding="utf-8")

          required_headings = (
              "# FRP M31 Phase-Interference RTL Contour",
              "## RTL Boundary",
              "## Balanced Ternary State Domain",
              "## Fixed-Point and Phase Domains",
              "## Phase and Interference Path",
              "## Trigonometric Memory",
              "## Resonance Selection",
              "## Active-Zero Polarity Routing",
              "## Temporal Scheduler",
              "## Distributed Transition Capacity",
              "## Thermal and Stability Observables",
              "## Integrated Core Interface",
              "## Source Inventory",
              "## Assertion Layers",
              "## Deterministic Qualification",
              "## Verilator Commands",
              "## Qualified Terminal Records",
              "## Published Evidence and Provenance",
          )
          for heading in required_headings:
              if heading not in text:
                  raise SystemExit(f"missing required heading: {heading}")

          source_names = sorted(
              path.name
              for path in Path("rtl/m31").iterdir()
              if path.is_file() and path.name != "README.md"
          )
          if len(source_names) != 20:
              raise SystemExit("M31 RTL source cardinality mismatch")
          for name in source_names:
              if f"`{name}`" not in text:
                  raise SystemExit(f"README source inventory omission: {name}")

          forbidden = ("-1/0/+1", "TODO", "TBD", "PLACEHOLDER")
          for value in forbidden:
              if value in text:
                  raise SystemExit(f"forbidden README text: {value}")

          fence_lines = [line for line in text.splitlines() if line.startswith("```")]
          if len(fence_lines) % 2:
              raise SystemExit("unbalanced Markdown fence")

          target_parent = Path("rtl/m31").resolve()
          links = re.findall(r"[^]]+([^)]+)", text)
          if len(links) != 12:
              raise SystemExit("README repository-link cardinality mismatch")
          for link in links:
              if "://" in link or link.startswith("#"):
                  continue
              resolved = (target_parent / link).resolve()
              if not resolved.is_file():
                  raise SystemExit(f"unresolved README link: {link}")

          print("M31 RTL README qualification: PASS")
          PY

      - name: Install integrity-bound M31 RTL README
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 /tmp/frp-m31-readme.md "$TARGET_PATH"
          test ! -L "$TARGET_PATH"
          test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
          test "$(wc -l < "$TARGET_PATH")" -eq "$TARGET_LINES"
          test "$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)" = \
            "$TARGET_SHA256"
          echo "Integrity-bound M31 RTL README installation: PASS"

      - name: Verify preservation and exact change boundary
        shell: bash
        run: |
          set -euo pipefail

          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          historical_inventory() {
            find . -maxdepth 1 -type f \
              -name 'RELEASE_NOTES_v*.md' \
                 -o -name 'TEST_REPORT_v*.md' \
                 -o -name 'FRP_VALIDATION_INDEX_v*.md' \
                 -o -name 'RELEASE_CHECKLIST_v*.md' \
              -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          protected_rtl_inventory() {
            find rtl -type f ! -path "$TARGET_PATH" -print0 \
              | LC_ALL=C sort -z | xargs -0 -r sha256sum
          }

          tree_inventory artifacts > /tmp/m31e2-artifacts.after
          tree_inventory benchmarks > /tmp/m31e2-benchmarks.after
          tree_inventory schemas > /tmp/m31e2-schemas.after
          tree_inventory fpga > /tmp/m31e2-fpga.after
          protected_rtl_inventory > /tmp/m31e2-protected-rtl.after
          historical_inventory > /tmp/m31e2-history.after

          cmp /tmp/m31e2-artifacts.before /tmp/m31e2-artifacts.after
          cmp /tmp/m31e2-benchmarks.before /tmp/m31e2-benchmarks.after
          cmp /tmp/m31e2-schemas.before /tmp/m31e2-schemas.after
          cmp /tmp/m31e2-fpga.before /tmp/m31e2-fpga.after
          cmp /tmp/m31e2-protected-rtl.before /tmp/m31e2-protected-rtl.after
          cmp /tmp/m31e2-history.before /tmp/m31e2-history.after

          changed="$(git status --porcelain | awk '{print $2}')"
          if test -n "$changed"; then
            test "$changed" = "$TARGET_PATH"
          fi
          echo "Preservation and exact README change boundary: PASS"

      - name: Commit and publish only rtl/m31/README.md
        shell: bash
        run: |
          set -euo pipefail
          git add -- "$TARGET_PATH"

          if git diff --cached --quiet; then
            echo "Exact M31 RTL README is already published."
            exit 0
          fi

          test "$(git diff --cached --name-only)" = "$TARGET_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add FRP M31 RTL README"
          git push origin HEAD:main

      - name: Verify published state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show "origin/main:$TARGET_PATH" > /tmp/frp-m31-readme.published.md
          test "$(wc -c < /tmp/frp-m31-readme.published.md)" -eq "$TARGET_BYTES"
          test "$(wc -l < /tmp/frp-m31-readme.published.md)" -eq "$TARGET_LINES"
          test "$(sha256sum /tmp/frp-m31-readme.published.md | cut -d' ' -f1)" = \
            "$TARGET_SHA256"
          echo "Published M31 RTL README identity: PASS"

      - name: Publish M31E2 summary
        if: always()
        shell: bash
        run: |
          {
            echo "## FRP M31E2 RTL README"
            echo
            echo "- Trigger: manual workflow_dispatch on main"
            echo "- Target: rtl/m31/README.md"
            echo "- Version: FRP v3.3.0"
            echo "- Ternary notation: -1/0/1 with active computational zero"
            echo "- RTL inventory: 20 existing implementation files documented"
            echo "- Qualification: all 60 focused M31 tests"
            echo "- Evidence, benchmarks, schemas, releases, FPGA, and all RTL sources: preserved"
          } >> "$GITHUB_STEP_SUMMARY"
