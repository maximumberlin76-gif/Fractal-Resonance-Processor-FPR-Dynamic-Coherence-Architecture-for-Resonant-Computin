              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or not path.parts
                      or any(part in ("", ".", "..") for part in member.name.split("/"))
                  ):
                      raise SystemExit(f"unsafe M25 payload path: {member.name}")
                  if member.isdir():
                      continue
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f"non-regular M25 payload member: {member.name}")
                  if member.name in extracted:
                      raise SystemExit(f"duplicate M25 payload member: {member.name}")
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"unreadable M25 payload member: {member.name}")
                  extracted[member.name] = stream.read()

          if set(extracted) != set(expected_files):
              missing = sorted(set(expected_files) - set(extracted))
              extra = sorted(set(extracted) - set(expected_files))
              raise SystemExit(f"M25 payload membership mismatch: missing={missing}, extra={extra}")

          for relative, expected_digest in sorted(expected_files.items()):
              observed_digest = hashlib.sha256(extracted[relative]).hexdigest()
              if observed_digest != expected_digest:
                  raise SystemExit(
                      f"M25 source digest mismatch for {relative}: "
                      f"{observed_digest} != {expected_digest}"
                  )

          work_root = Path(os.environ["M25_ROOT"])
          if work_root.is_symlink():
              raise SystemExit(f"M25 work root is a symlink: {work_root}")
          if work_root.exists():
              shutil.rmtree(work_root)
          work_root.mkdir(parents=True, mode=0o700)

          repository_root = Path.cwd().resolve()
          for relative, raw in sorted(extracted.items()):
              parts = PurePosixPath(relative).parts
              work_target = work_root.joinpath(*parts)
              work_target.parent.mkdir(parents=True, exist_ok=True)
              work_target.write_bytes(raw)

              destination = repository_root.joinpath(*parts)
              if destination.is_symlink():
                  raise SystemExit(f"refusing M25 symlink destination: {relative}")
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(raw)

          print(json.dumps({
              "status": "PASS",
              "archive_sha256": observed_archive_sha256,
              "file_count": len(extracted),
          }, sort_keys=True))
