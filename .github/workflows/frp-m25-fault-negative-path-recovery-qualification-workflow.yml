name: FRP M25 Fault Negative-Path and Recovery Qualification

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frp-m25-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close-m25:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M25_ROOT: /tmp/frp_m25_creation
      M25_FORMAL_ROOT: /tmp/frp_m25_formal
      M25_SOURCE_COMMIT: a01fb687fd1e4f0159f0d8cd885863afb8b87a1e
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact Python and formal dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt yowasp-yosys==0.68.0.0.post1208
          python --version
          yowasp-yosys -V

      - name: Validate the immutable M24 to M25 source boundary
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${M25_SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$M25_SOURCE_COMMIT" HEAD

          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/frp-m25-fault-negative-path-recovery-qualification-workflow.yml|\
              frp_m25_fault_negative_recovery_qualification.py|\
              frp_m25_safe_artifact_validator.py|\
              formal/m25/*|\
              schemas/m25/*|\
              artifacts/m25/*|\
              tests/test_frp_m25_fault_negative_recovery_qualification.py)
                ;;
              *)
                echo "Unexpected change after the exact M24 boundary: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$M25_SOURCE_COMMIT"..HEAD)

          test "$(git show -s --format=%s "$M25_SOURCE_COMMIT")" = "Add M24 formal and bounded verification closure"
          test "$(git rev-parse "$M25_SOURCE_COMMIT")" = "$M25_SOURCE_COMMIT"

