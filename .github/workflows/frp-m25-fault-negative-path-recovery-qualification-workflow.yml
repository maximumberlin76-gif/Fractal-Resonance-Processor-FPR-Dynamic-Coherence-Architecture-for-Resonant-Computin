      - name: Enforce the immutable core vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("frp_m25_fault_negative_recovery_qualification.py"),
              Path("frp_m25_safe_artifact_validator.py"),
              *sorted(Path("formal/m25").glob("*.sv")),
              *sorted(Path("schemas/m25").glob("*.json")),
              Path("tests/test_frp_m25_fault_negative_recovery_qualification.py"),
          ]
          forbidden = "-1/0/" + "+1"
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if forbidden in text:
                  raise SystemExit(f"non-canonical ternary notation in {path}")
          PY
          grep -F '"balanced_ternary_notation": {"const": "-1/0/1"}' schemas/m25/frp_m25_fault_negative_recovery_contract.v2.7.0.schema.json
          grep -F '"temporal_scheduler_modes": {"const": ["1/7", "7/1"]}' schemas/m25/frp_m25_fault_negative_recovery_contract.v2.7.0.schema.json

      - name: Run exact bounded RTL fault and recovery proofs
        shell: bash
        run: |
          set -euo pipefail
          python frp_m25_fault_negative_recovery_qualification.py \
            --run-formal \
            --repository-root . \
            --work-root "$M25_FORMAL_ROOT" \
            --yosys yowasp-yosys \
            --source-commit "$M25_SOURCE_COMMIT" \
            --output /tmp/frp_m25_formal_result.json
          python -m json.tool /tmp/frp_m25_formal_result.json

      - name: Generate the complete deterministic M25 artifact package
        shell: bash
        run: |
          set -euo pipefail
          python frp_m25_fault_negative_recovery_qualification.py \
            --generate \
            --repository-root . \
            --output-root . \
            --formal-result /tmp/frp_m25_formal_result.json \
            --source-commit "$M25_SOURCE_COMMIT" \
            --output /tmp/frp_m25_generation.json
          python -m json.tool /tmp/frp_m25_generation.json

      - name: Run complete M25 qualification tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_frp_m25_fault_negative_recovery_qualification.py' -v
          python frp_m25_fault_negative_recovery_qualification.py \
            --verify \
            --repository-root . \
            --formal-result /tmp/frp_m25_formal_result.json \
            --source-commit "$M25_SOURCE_COMMIT" \
            --output /tmp/frp_m25_verification.json
          python frp_m25_fault_negative_recovery_qualification.py \
            --self-test \
            --repository-root . \
            --source-commit "$M25_SOURCE_COMMIT" \
            --output /tmp/frp_m25_self_test.json
          python -m json.tool /tmp/frp_m25_verification.json
          python -m json.tool /tmp/frp_m25_self_test.json

      - name: Run the complete repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate the closed M25 change boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- rtl/m16 rtl/m22 rtl/m23 formal/m24 artifacts/m24 schemas/m24

          while IFS= read -r changed_path; do
            case "$changed_path" in
              frp_m25_fault_negative_recovery_qualification.py|\
              frp_m25_safe_artifact_validator.py|\
              formal/m25/*|\
              schemas/m25/*|\
              artifacts/m25/*|\
              tests/test_frp_m25_fault_negative_recovery_qualification.py)
                ;;
              *)
                echo "M25 attempted to modify an undeclared path: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | LC_ALL=C sort -u
          )

      - name: Create the qualified M25 commit and push main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            frp_m25_fault_negative_recovery_qualification.py \
            frp_m25_safe_artifact_validator.py \
            formal/m25 \
            schemas/m25 \
            artifacts/m25 \
            tests/test_frp_m25_fault_negative_recovery_qualification.py

          if git diff --cached --quiet; then
            echo "M25 package is already byte-identical; no commit required."
            exit 0
          fi

          git commit -m "Add M25 fault negative-path and recovery qualification" \
            -m "Qualify all declared fault, deferral, invalid artifact, pending-route, reset, overflow-detection, and deterministic recovery paths against the immutable -1/0/1 core and the 1/7 and 7/1 temporal scheduler modes."

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Retain M25 proof and qualification logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frp-m25-fault-negative-recovery-logs-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            /tmp/frp_m25_formal_result.json
            /tmp/frp_m25_generation.json
            /tmp/frp_m25_verification.json
            /tmp/frp_m25_self_test.json
            /tmp/frp_m25_formal/logs/*.log
