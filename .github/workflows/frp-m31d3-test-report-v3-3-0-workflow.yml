          test "$(wc -c < "$rendered")" -eq "$TARGET_BYTES"
          test "$(wc -l < "$rendered")" -eq "$TARGET_LINES"
          test "$(sha256sum "$rendered" | cut -d' ' -f1)" = "$TARGET_SHA256"
          install -m 0644 "$rendered" "$TARGET_PATH"
          echo "Additive v3.3.0 test report installed: PASS"

      - name: Qualify test-report content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          target = Path(os.environ["TARGET_PATH"])
          raw = target.read_bytes()
          if len(raw) != int(os.environ["TARGET_BYTES"]):
              raise SystemExit("test-report byte mismatch")
          if hashlib.sha256(raw).hexdigest() != os.environ["TARGET_SHA256"]:
              raise SystemExit("test-report digest mismatch")
          if not raw.endswith(bytes([10])) or raw.endswith(bytes([10, 10])):
              raise SystemExit("test-report newline mismatch")
          text = raw.decode("utf-8")

          evidence = json.loads(Path(os.environ["M31_EVIDENCE_PATH"]).read_text(encoding="utf-8"))
          qualification = json.loads(Path(os.environ["M31_QUALIFICATION_PATH"]).read_text(encoding="utf-8"))
          if evidence["milestone"] != "M31" or evidence["status"] != "PASS":
              raise SystemExit("M31 evidence identity mismatch")
          if qualification["status"] != "PASS":
              raise SystemExit("M31 qualification status mismatch")
          if len(qualification["checks"]) != 13 or not all(qualification["checks"].values()):
              raise SystemExit("M31 qualification checks mismatch")

          required = (
              "FRP v3.3.0 Test Report",
              "60 / 60 PASS",
              "13 / 13 PASS",
              "Canonical M31 outputs | `4 / 4 exact`",
              "active-zero observations | `702`",
              "actual direct events | `0`",
              "direct opposite-polarity transitions | `0`",
              "15.6923076923",
              "93.63%",
              "All 11 negative-path tests pass.",
              "metric normalization | forbidden | `PASS`",
              "semantic reimplementation | forbidden | `PASS`",
              "FRP source mutation | forbidden | `PASS`",
              "writeback | forbidden | `PASS`",
              os.environ["D1_INDEX_SHA256"],
              os.environ["D2_NOTES_SHA256"],
              "FRP v3.3.0 / M31 TEST REPORT — PASS",
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"test-report claims missing: {missing}")
          forbidden = "-1/0/" + chr(43) + "1"
          if forbidden in text:
              raise SystemExit("forbidden ternary notation in test report")
          print("FRP v3.3.0 test-report content: PASS")
          PY

      - name: Prove all prior histories are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          tree_inventory() {
            find "$1" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          historical_inventory() {
            find . -maxdepth 1 -type f '(' -name 'RELEASE_NOTES_v*.md' -o -name 'TEST_REPORT_v*.md' -o -name 'FRP_VALIDATION_INDEX_v*.md' -o -name 'RELEASE_CHECKLIST_v*.md' ')' ! -name "$TARGET_PATH" -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          }
          tree_inventory artifacts > /tmp/m31d3-artifacts.after
          tree_inventory benchmarks > /tmp/m31d3-benchmarks.after
          tree_inventory schemas > /tmp/m31d3-schemas.after
          historical_inventory > /tmp/m31d3-history.after
          cmp --silent /tmp/m31d3-artifacts.before /tmp/m31d3-artifacts.after
          cmp --silent /tmp/m31d3-benchmarks.before /tmp/m31d3-benchmarks.after
          cmp --silent /tmp/m31d3-schemas.before /tmp/m31d3-schemas.after
          cmp --silent /tmp/m31d3-history.before /tmp/m31d3-history.after
          echo "All prior evidence, benchmark, schema, and release histories: BYTE-IDENTICAL"

      - name: Verify only the new test report changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          untracked="$(git ls-files --others --exclude-standard)"
          if test -n "$changed" && test "$changed" != "$TARGET_PATH"; then
            echo "Unexpected changed paths: $changed" >&2
            exit 1
          fi
          if test -n "$untracked" && test "$untracked" != "$TARGET_PATH"; then
            echo "Unexpected untracked paths: $untracked" >&2
            exit 1
          fi
          echo "Single additive file boundary: PASS"

      - name: Commit and publish the test report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          staged="$(git diff --cached --name-only)"
          if test -z "$staged"; then
            test -z "$(git status --porcelain)"
            echo "FRP v3.3.0 test report is already published."
            exit 0
          fi
          test "$staged" = "$TARGET_PATH"
          git commit -m "Add FRP v3.3.0 M31 test report"
          git push origin HEAD:main

      - name: Verify published state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(wc -c < "$TARGET_PATH")" -eq "$TARGET_BYTES"
          test "$(sha256sum "$TARGET_PATH" | cut -d' ' -f1)" = "$TARGET_SHA256"
          echo "FRP M31D3 test report v3.3.0: PASS"
          {
            echo "## FRP M31D3 Test Report v3.3.0"
            echo
            echo "- New file: TEST_REPORT_v3_3_0.md"
            echo "- M31 tests: 60 / 60 PASS"
            echo "- Existing histories: byte-identical"
            echo "- Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
